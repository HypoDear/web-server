<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="个人网页应用合集 · 纯静态、零依赖、开箱即用">
<meta name="theme-color" content="#0e1116">
<title>应用合集</title>
<style>
:root{
  --bg:#0e1116; --card:#161b22; --card-h:#1b2230; --ink:#e6edf3;
  --ink-soft:#8b949e; --ink-dim:#6e7681; --line:#21262d; --accent:#2563eb;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;line-height:1.55;
}
.wrap{width:100%;max-width:480px}
header{text-align:center;margin-bottom:28px}
h1{font-size:24px;font-weight:600;letter-spacing:3px;margin:0 0 8px}
header p{margin:0;color:var(--ink-soft);font-size:12.5px;letter-spacing:1px}
.list{display:flex;flex-direction:column;gap:10px}
.card{
  display:flex;align-items:center;gap:14px;
  text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;transition:transform .15s,border-color .15s,background .15s;
}
.card:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--card-h)}
.ico{
  flex:0 0 auto;width:38px;height:38px;border-radius:10px;
  background:#0f1b2e;border:1px solid #1e3252;
  display:flex;align-items:center;justify-content:center;
}
.ico svg{width:19px;height:19px;fill:#3b82f6}
.txt{flex:1;min-width:0}
.card h2{margin:0 0 2px;font-size:15.5px;font-weight:500;letter-spacing:.5px}
.card p{margin:0;font-size:12px;color:var(--ink-soft)}
.arrow{flex:0 0 auto;color:var(--ink-dim);font-size:16px}
.card:hover .arrow{color:var(--accent)}
footer{margin-top:30px;text-align:center;font-size:11px;color:#565d66;letter-spacing:.3px;line-height:1.8}
footer a{color:#565d66}
@media(max-width:360px){
  .card{padding:14px}
  .card p{font-size:11.5px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>应用合集</h1>
    <p>纯静态 · 零依赖 · 开箱即用</p>
  </header>

  <div class="list">
    <a class="card" href="flac/">
      <span class="ico">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </span>
      <span class="txt">
        <h2>FLAC 歌单</h2>
        <p>无损歌单播放器，点击即播</p>
      </span>
      <span class="arrow">›</span>
    </a>
  </div>

  <footer>
    <a href="https://github.com/HypoDear/web-server">在 GitHub 上查看源码</a>
  </footer>
</div>
</body>
</html>
