<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#FAF9F6">
<title>深圳摩天轮</title>
<meta name="description" content="深圳与东京两座体素小城，海风把摩天轮吹得很慢，各处藏着彩蛋。">
<style>:root{--paper:#FAF9F6;--ink:#383838;--muted:#F2F0EB;--faded:#6B6960;--line:#E8E6E0;--clay:#DA7756;--clay-deep:#C4623F;--ring:#D6D4CD;--plate:#FDFCFA;
  --serif:'Source Serif 4','Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif;--sans:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#FAF9F6;color:#383838;font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .7s ease}
body:has(.tw[data-scene="tokyo"]){background:#262522}
.tw{--pad:clamp(14px,2.2vw,32px);min-height:100vh;min-height:100dvh;max-width:1720px;margin:0 auto;padding:var(--pad) var(--pad) calc(var(--pad) + 24px);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(10px,1.7vh,18px);background:var(--paper);color:var(--ink);transition:background-color .7s ease,color .7s ease}
.tw[data-scene="tokyo"]{--paper:#262522;--ink:#ECE9E1;--muted:#33312D;--faded:#A8A49A;--line:#45423C;--ring:#5A564E;--plate:#2E2D29}

.tw-mast{display:flex;align-items:flex-end;justify-content:space-between;gap:clamp(16px,4vw,56px)}
.tw-head{min-width:0}
.tw-kicker{margin:0 0 .5em;display:flex;align-items:center;gap:.8em;font-size:clamp(11px,.82vw,13px);font-weight:500;letter-spacing:.22em;color:var(--faded)}
.tw-kicker i{flex:none;width:1.9em;height:2px;border-radius:2px;background:var(--clay)}
.tw-title{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.3vw,50px);line-height:1.16;letter-spacing:.04em}
.tw-desc{margin:.6em 0 0;max-width:44em;font-family:var(--serif);font-size:clamp(13px,1.02vw,16px);line-height:1.75;color:var(--faded)}
.tw-seal{flex:none;display:flex;align-items:flex-start;gap:.7em}
.tw-seal b{display:grid;place-items:center;width:2.05em;height:2.05em;border-radius:.3em;background:var(--clay);color:#FDFCFA;font-family:var(--serif);font-weight:700;font-size:clamp(22px,2.1vw,32px);box-shadow:inset 0 0 0 2px rgba(253,252,250,.28)}
.tw-seal span{display:flex;flex-direction:row-reverse;gap:.6em;font-family:var(--serif);font-size:clamp(11px,.86vw,13px);color:var(--faded);border-left:1px solid var(--line);padding-left:.75em}
.tw-seal em{font-style:normal;width:1em;line-height:1.3;word-break:break-all;text-align:center}

.tw-stage{position:relative;min-height:clamp(260px,46vh,560px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--muted);
  box-shadow:0 1px 2px rgba(56,56,56,.05),0 26px 48px -30px rgba(120,84,60,.42);touch-action:none;transition:border-color .7s ease}
.tw-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .38s ease}
.tw.is-ready .tw-stage canvas{opacity:1}
.tw.is-ready .tw-stage.is-swapping canvas{opacity:0}
#tw-world{cursor:grab;outline:none}
.tw-stage.is-drag #tw-world{cursor:grabbing}
#tw-fx{pointer-events:none}
.tw-hint{position:absolute;left:1.1em;bottom:.9em;margin:0;padding:.42em .95em;border-radius:99px;font-size:clamp(10px,.76vw,12px);letter-spacing:.14em;color:#FDFCFA;background:rgba(56,56,56,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none}
.tw-eggs{position:absolute;right:1em;top:.9em;display:flex;align-items:center;gap:.7em;margin:0;padding:.46em .95em;border:0;border-radius:99px;font:inherit;font-size:clamp(10px,.8vw,12px);letter-spacing:.12em;color:#FDFCFA;background:rgba(56,56,56,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;opacity:0;transition:opacity .4s,background-color .25s}
.tw.is-ready .tw-eggs{opacity:1}
.tw-eggs:hover{background:rgba(56,56,56,.52)}
.tw-eggs:focus-visible{outline:2px solid #FDFCFA;outline-offset:2px}
.tw-eggs em{font-style:normal;opacity:.82}
.tw-eggs b{font-family:var(--serif);font-weight:600;letter-spacing:.04em}
.tw-eggs span{display:flex;gap:4px}
.tw-eggs span i{width:6px;height:6px;border-radius:2px;background:rgba(253,252,250,.34);transition:background-color .3s,transform .3s}
.tw-eggs span i.on{background:var(--clay);transform:rotate(45deg)}
.tw-eggs.is-full b{color:#F6C9B5}
.tw-toast{position:absolute;left:50%;bottom:1.1em;max-width:min(86%,34em);margin:0;padding:.6em 1.25em;border-radius:99px;font-family:var(--serif);font-size:clamp(12px,.98vw,15px);line-height:1.5;letter-spacing:.06em;text-align:center;color:#383838;background:rgba(253,252,250,.94);box-shadow:0 10px 26px -14px rgba(60,40,28,.6);border:1px solid rgba(218,119,86,.5);opacity:0;transform:translate(-50%,10px);transition:opacity .3s,transform .3s;pointer-events:none}
.tw-toast.is-on{opacity:1;transform:translate(-50%,0)}
.tw-loading{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-family:var(--serif);letter-spacing:.2em;color:var(--faded);transition:opacity .4s}
.tw.is-ready .tw-loading{opacity:0}

.tw-dock{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px clamp(12px,2vw,28px)}
.tw-dock button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tw-dock button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.tw-scenes{display:flex;padding:4px;border-radius:99px;border:1px solid var(--line);background:var(--plate)}
.tw-scenes button{border:0;background:none;border-radius:99px;padding:.62em 1.25em;font-family:var(--serif);font-size:clamp(13px,1vw,15px);letter-spacing:.08em;color:var(--faded);transition:background-color .25s,color .25s}
.tw-scenes button:hover{color:var(--ink)}
.tw-scenes button[aria-selected="true"]{background:var(--clay);color:#FDFCFA}
.tw-scenes button[aria-selected="true"]:hover{background:var(--clay-deep)}
.tw-views{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto;justify-content:center}
.tw-chip,.tw-pause{display:inline-flex;align-items:baseline;gap:.6em;border:1px solid var(--line);background:var(--plate);border-radius:99px;padding:.56em 1.1em;font-size:clamp(12px,.92vw,14px);letter-spacing:.06em;transition:border-color .25s,background-color .25s}
.tw-chip i{font-family:var(--serif);font-style:italic;font-size:.86em;color:var(--clay)}
.tw-chip:hover,.tw-pause:hover,.tw-orbit:hover{background:var(--muted);border-color:var(--ring)}
.tw-chip[aria-pressed="true"],.tw-orbit[aria-pressed="true"]{border-color:var(--clay);background:var(--muted)}
.tw-tools{display:flex;gap:8px}
.tw-orbit{display:inline-flex;align-items:center;gap:.6em;border:1px solid var(--line);background:var(--plate);border-radius:99px;padding:.56em 1.1em;font-size:clamp(12px,.92vw,14px);letter-spacing:.06em;transition:border-color .25s,background-color .25s}
.tw-orbit i{width:.8em;height:.8em;border-radius:50%;border:.16em solid var(--clay);border-right-color:transparent}
.tw-orbit[aria-pressed="true"] i{animation:tw-turn 1.6s linear infinite}
@keyframes tw-turn{to{transform:rotate(360deg)}}
.tw-pause{align-items:center}
.tw-pause i{width:.62em;height:.72em;border-left:.2em solid var(--clay);border-right:.2em solid var(--clay)}
.tw-pause[aria-pressed="true"] i{width:0;height:0;border:.38em solid transparent;border-left:.62em solid var(--clay);border-right:0}

@media (max-width:1200px){.tw-views{order:3;flex-basis:100%;justify-content:flex-start}}
/* 宽屏：文字和按钮收进左侧一栏，舞台占满整个高度——沙盘比上下叠放时大四成，细处才看得清 */
@media (min-width:1201px) and (min-aspect-ratio:5/4){
  .tw{height:100vh;height:100dvh;grid-template-columns:clamp(272px,22vw,380px) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"mast stage" "dock stage";column-gap:clamp(20px,2.4vw,40px);padding-bottom:max(var(--pad),36px)}
  .tw-mast{grid-area:mast;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:clamp(14px,2.6vh,30px);padding-top:clamp(2px,1.6vh,18px);min-height:0;overflow:hidden}
  .tw-stage{grid-area:stage;min-height:0}
  .tw-dock{grid-area:dock;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:10px}
  .tw-title{font-size:clamp(30px,2.75vw,46px);line-height:1.22;text-wrap:balance}
  .tw-desc{margin-top:.9em;font-size:clamp(13px,1vw,15.5px);line-height:1.85}
  .tw-scenes button{flex:1;padding:.62em .3em;letter-spacing:.04em;white-space:nowrap}
  .tw-views{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
  .tw-chip{justify-content:flex-start;padding:.56em .9em;white-space:nowrap;letter-spacing:.02em}
  .tw-chip:first-child{grid-column:1/-1}
  .tw-tools button{flex:1;justify-content:center}
}
@media (min-width:1201px) and (min-aspect-ratio:5/4) and (max-height:660px){.tw-desc{display:none}.tw-mast{gap:12px}}
@media (max-width:768px){
  .tw{grid-template-rows:auto auto auto}
  .tw-mast{align-items:flex-start}
  .tw-stage{height:min(64vh,118vw);min-height:300px}
  .tw-desc{line-height:1.65}
  .tw-hint{display:none}
  .tw-views{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
  .tw-views::-webkit-scrollbar{display:none}
  .tw-chip{flex:none;white-space:nowrap}
}
@media (max-width:480px){
  .tw-seal span{display:none}
  .tw-scenes{flex:1 1 100%}
  .tw-scenes button{flex:1;padding:.62em .4em;letter-spacing:.02em}
  .tw-chip{padding:.5em .85em}
  .tw-stage{border-radius:12px}
}
@media (prefers-reduced-motion:reduce){.tw,.tw-stage canvas,body{transition:none}}
/* Release mobile containment: the scroll strip must never widen the grid. */
@media(max-width:768px){.tw{grid-template-columns:minmax(0,1fr)}.tw-dock{min-width:0}.tw-views{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;min-width:0;max-width:100%;scrollbar-width:none;margin:0;padding:0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.tw-chip{flex:none;white-space:nowrap}.tw-views::-webkit-scrollbar{display:none}}
</style>
</head>
<body>
<main id="twin" class="tw" data-scene="harbor" data-view="all" data-renderer="webgl">
<header class="tw-mast">
  <div class="tw-head">
    <p class="tw-kicker"><i></i><span id="tw-kicker">深圳宝安 · 欢乐港湾 · 晴</span></p>
    <h1 class="tw-title" id="tw-title">海风把摩天轮吹得很慢</h1>
    <p class="tw-desc" id="tw-desc">湾区之光在蓝天里慢慢转。小满在广场上放风筝，阿澈踩着滑板喝冻柠茶，知夏支起画架，把这个下午画下来。</p>
  </div>
  <div class="tw-seal" aria-hidden="true"><b id="tw-seal">晴</b><span id="tw-season"><em>海风三级</em><em>午后三点</em></span></div>
</header>
<section class="tw-stage" aria-label="体素场景">
  <p class="tw-loading">正在一块一块搭起来</p>
  <canvas id="tw-air" aria-hidden="true"></canvas>
  <canvas id="tw-world" tabindex="0" role="img" aria-label="体素场景"></canvas>
  <canvas id="tw-fx" aria-hidden="true"></canvas>
  <button type="button" class="tw-eggs" id="tw-eggs" aria-label="彩蛋"><em>彩蛋</em><b>0 / 8</b><span aria-hidden="true"></span></button>
  <p class="tw-toast" id="tw-toast" role="status" aria-live="polite"></p>
  <p class="tw-hint">拖动可转一整圈 · 滚轮缩放 · 双击复位 · 点一点小东西</p>
</section>
<footer class="tw-dock">
  <div class="tw-scenes" role="tablist" aria-label="切换城市">
    <button type="button" role="tab" data-scene="harbor" aria-selected="true">深圳 · 欢乐港湾</button>
    <button type="button" role="tab" data-scene="tokyo" aria-selected="false">东京 · 街角便利店</button>
  </div>
  <div class="tw-views" id="tw-views" aria-label="切换视角"></div>
  <div class="tw-tools">
    <button type="button" class="tw-orbit" id="tw-orbit" aria-pressed="false"><i aria-hidden="true"></i><span>环绕</span></button>
    <button type="button" class="tw-pause" id="tw-pause" aria-pressed="false"><i aria-hidden="true"></i><span>暂停</span></button>
  </div>
</footer>
</main><script>;
/* ============================================================================
 * 深圳摩天轮
 * 渲染架构沿用「海珠雨后」：实例化立方体(WebGL1 + ANGLE_instanced_arrays) · 正交相机 ·
 * 光源空间阴影贴图 · 屏幕空间遮蔽 · 平面镜像倒影 · 2D 画布天空 · 2D 画布降级渲染
 * 在此基础上新增：材质通道(自发光/水面/湿地面/玻璃) · 俯视高度图遮蔽 · 点光源 · 光晕叠层 · 两段式手臂 IK
 * ========================================================================== */
const TAU=Math.PI*2,STRIDE=16;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]),unit=a=>mul(a,1/(len(a)||1)),lerp3=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k),mix(a[2],b[2],k)];
const ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const pulse=(t,a,b,c,d)=>ease((t-a)/(b-a))*(1-ease((t-c)/(d-c)));
function rng(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296;};}
function hash(x,y,z=0){let n=Math.imul(x+139,374761393)+Math.imul(y+87,668265263)+Math.imul(z+19,13571419);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;}

// 3x4 仿射矩阵：[X轴, Y轴, Z轴, 平移]。世界坐标 Z 向上，角色正面朝 -Y。
const I3=[1,0,0,0,1,0,0,0,1,0,0,0];
function mdir(m,x,y,z){return[m[0]*x+m[3]*y+m[6]*z,m[1]*x+m[4]*y+m[7]*z,m[2]*x+m[5]*y+m[8]*z];}
function mpt(m,x,y,z){return[m[0]*x+m[3]*y+m[6]*z+m[9],m[1]*x+m[4]*y+m[7]*z+m[10],m[2]*x+m[5]*y+m[8]*z+m[11]];}
function mmul(a,b){return[...mdir(a,b[0],b[1],b[2]),...mdir(a,b[3],b[4],b[5]),...mdir(a,b[6],b[7],b[8]),...mpt(a,b[9],b[10],b[11])];}
function pose(x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1){
  const a=Math.cos(rz),b=Math.sin(rz),c=Math.cos(ry),d=Math.sin(ry),e=Math.cos(rx),f=Math.sin(rx);
  return[s*a*c,s*b*c,-s*d,s*(a*d*f-b*e),s*(b*d*f+a*e),s*c*f,s*(a*d*e+b*f),s*(b*d*e-a*f),s*c*e,x,y,z];
}
function frame(a,b){const z=unit(sub(b,a)),ref=Math.abs(z[1])<.9?[0,1,0]:[1,0,0],x=unit(cross(ref,z)),y=cross(z,x);return[...x,...y,...z,a[0],a[1],a[2]];}
function pivot(p,r,tr=[0,0,0]){return mmul(pose(p[0]+tr[0],p[1]+tr[1],p[2]+tr[2],r[0],r[1],r[2]),[1,0,0,0,1,0,0,0,1,-p[0],-p[1],-p[2]]);}

// 颜色一律写成不带井号的十六进制，构建时转成浮点。
const COL=new Map();
function rgb(c){if(typeof c!=='string')return c;let v=COL.get(c);if(!v){const h=parseInt(c,16);v=[(h>>16)/255,((h>>8)&255)/255,(h&255)/255];COL.set(c,v);}return v;}
const css=(c,a=1)=>{const v=rgb(c);return`rgba(${Math.round(v[0]*255)},${Math.round(v[1]*255)},${Math.round(v[2]*255)},${a})`;};

// 材质通道：0 实体 · 1 自发光 · 2 水面 · 3 湿地面 · 4 玻璃 · 5 闪烁自发光
let M=I3,OUT=[];
function box(x,y,z,w,d,h,c,m=0){const p=mpt(M,x,y,z),k=rgb(c);OUT.push(p[0],p[1],p[2],M[0]*w,M[1]*w,M[2]*w,M[3]*d,M[4]*d,M[5]*d,M[6]*h,M[7]*h,M[8]*h,k[0],k[1],k[2],m);}
function inside(m,fn){const p=M;M=mmul(p,m);fn();M=p;}
function at(x,y,z,fn,rx=0,ry=0,rz=0,s=1){inside(pose(x,y,z,rx,ry,rz,s),fn);}
function beam(a,b,w,d,c,m=0){const L=len(sub(b,a));if(L<1e-5)return;inside(frame(a,b),()=>box(0,0,L/2,w,d,L,c,m));}
function tilted(x,y,z,w,d,h,c,rx=0,ry=0,rz=0,m=0){at(x,y,z,()=>box(0,0,0,w,d,h,c,m),rx,ry,rz);}
function scope(fn){const po=OUT,pm=M;OUT=[];M=I3;fn();const d=new Float32Array(OUT);OUT=po;M=pm;return d;}
// 像素画：贴在 XZ 平面上，朝向 -Y。z 为最底一行的中心高度。
function pixels(rows,sz,depth,pal,x=0,y=0,z=0,m=0){const n=rows[0].length;rows.forEach((row,j)=>{for(let i=0;i<row.length;){const k=row[i];let e=i+1;while(row[e]===k)e++;if(pal[k])box(x+((i+e-1)/2-(n-1)/2)*sz,y,z+(rows.length-1-j)*sz,(e-i)*sz,depth,sz,pal[k],m);i=e;}});}
// 体素化：逐格取色，沿 X 合并同色格，得到干净的大面。
function vox(b,s,fn,m=0){const nx=Math.round((b[1]-b[0])/s),ny=Math.round((b[3]-b[2])/s),nz=Math.round((b[5]-b[4])/s);
  for(let k=0;k<nz;k++){const z=b[4]+(k+.5)*s;for(let j=0;j<ny;j++){const y=b[2]+(j+.5)*s;let run=null,st=0;
    for(let i=0;i<=nx;i++){const c=i<nx?fn(b[0]+(i+.5)*s,y,z):null;if(c!==run){if(run)box(b[0]+(st+i)*s/2,y,z,(i-st)*s,s,s,run,m);run=c;st=i;}}}}}
function blob(cx,cy,cz,rx,ry,rz,s,cf,m=0){const nx=Math.ceil(rx/s),ny=Math.ceil(ry/s),nz=Math.ceil(rz/s);
  vox([cx-nx*s,cx+nx*s,cy-ny*s,cy+ny*s,cz-nz*s,cz+nz*s],s,(x,y,z)=>{const a=(x-cx)/rx,b=(y-cy)/ry,c=(z-cz)/rz;return a*a+b*b+c*c<=1?(typeof cf==='function'?cf(x,y,z):cf):null;},m);}
function disc(cx,cy,cz,r,h,c,m=0,s=.08){const n=Math.max(2,Math.round(r/s)),st=r/n;for(let j=-n;j<n;j++){const y=(j+.5)*st,hw=Math.sqrt(Math.max(0,r*r-y*y));box(cx,cy+y,cz,2*hw,st,h,typeof c==='function'?c(j,n):c,m);}}
function rbox(x,y,z,w,d,h,c,cut=.1,m=0){box(x,y,z,w-2*cut,d,h,c,m);box(x-w/2+cut/2,y,z,cut,d-2*cut,h,c,m);box(x+w/2-cut/2,y,z,cut,d-2*cut,h,c,m);}

(function(){

    if(w===W&&h===H)return;W=world.width=w;H=world.height=h;air.width=Math.max(2,w>>1);air.height=Math.max(2,h>>1);fx.width=Math.max(2,w>>1);fx.height=Math.max(2,h>>1);

  function bake(rig){let n=0;for(const e of rig)n+=parts[e[0]].length;if(n+STRIDE*4096>dynBuf.length)dynBuf=new Float32Array(n+STRIDE*8192);let o=0;

  // 点选：从屏幕上的一点沿视线射进场景，找最先碰到的方块
  function ray(px,py){const r=world.getBoundingClientRect(),v=camera(),nx=(px-r.left)/r.width*2-1,ny=1-(py-r.top)/r.height*2;

  // 交互：拖动旋转（一整圈不设限）、Shift 拖动平移、滚轮与双指缩放、双击复位
