<style>
:root{
  --bg:#faf8f3;--card:#fff;--sunk:#f3efe6;--line:#e7e1d5;--line2:#d2c9b8;
  --ink:#241f19;--ink2:#6a6257;--ink3:#9b9387;
  --shadow:0 1px 2px rgba(60,50,35,.05);--shadow-lg:0 22px 44px -26px rgba(60,50,35,.38),0 2px 6px rgba(60,50,35,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"SF Pro Display","DIN Alternate","Helvetica Neue",var(--font);
}
[data-theme="dark"]{color-scheme:dark;--bg:#101216;--card:#181b21;--sunk:#14171c;--line:#272c35;--line2:#363c47;
  --ink:#eae6de;--ink2:#9aa0ab;--ink3:#6c737f;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 22px 44px -24px rgba(0,0,0,.9)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:max(40px,env(safe-area-inset-top)) 22px max(40px,env(safe-area-inset-bottom));
  background-image:radial-gradient(900px 480px at 14% -12%,rgba(31,111,139,.075),transparent 64%),radial-gradient(720px 420px at 98% 0%,rgba(224,88,63,.06),transparent 62%);background-attachment:fixed}
[data-theme="dark"] body{background-image:radial-gradient(900px 480px at 14% -12%,rgba(95,179,208,.07),transparent 64%),radial-gradient(720px 420px at 98% 0%,rgba(224,88,63,.05),transparent 62%)}
.wrap{max-width:1080px;margin:0 auto}
/* 顶部 */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;box-shadow:var(--shadow)}
.kick i{width:6px;height:6px;border-radius:50%;background:#e0583f;box-shadow:0 0 0 3px rgba(224,88,63,.16)}
.acts{display:flex;gap:8px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);cursor:pointer;padding:0;box-shadow:var(--shadow);text-decoration:none;transition:color .2s,border-color .2s,transform .15s}
.ibtn:hover{color:var(--ink);border-color:var(--line2)}.ibtn:active{transform:scale(.94)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.thm .sun{display:none}[data-theme="dark"] .thm .sun{display:block}[data-theme="dark"] .thm .moon{display:none}
header{margin-bottom:24px}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px}
h1{font-size:clamp(30px,5.4vw,44px);font-weight:680;letter-spacing:-.02em;line-height:1.1}
.today{text-align:right;color:var(--ink2);font-size:13px;line-height:1.5}
.today b{display:block;font-family:var(--num);font-size:24px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:"a a d" "b e d" "c c d";gap:14px}
.card{--c:#2f7cf6;position:relative;overflow:hidden;isolation:isolate;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:22px 22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;
  transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s,border-color .3s;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.card::before{content:"";position:absolute;inset:-45% -15% auto 35%;height:260px;z-index:-1;pointer-events:none;
  background:radial-gradient(50% 100% at 60% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 72%)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card.a{grid-area:a;--c:#2f7cf6}.card.b{grid-area:b;--c:#e8558a;animation-delay:.05s}
.card.e{grid-area:e;--c:#1fae72;animation-delay:.1s}.card.c{grid-area:c;--c:#7c5cff;animation-delay:.15s}
.card.d{grid-area:d;--c:#f0932b;animation-delay:.2s}
.card.c .rows{grid-template-columns:repeat(3,1fr)}
.card.c .row{flex-direction:column;align-items:flex-start;gap:4px}
.card.d .list{flex:1;grid-auto-rows:1fr}
.card.d .list li{padding:14px 16px}.card.d .list .cd b{font-size:28px}
.tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.06em;
  color:color-mix(in srgb,var(--c) 78%,var(--ink));background:color-mix(in srgb,var(--c) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 22%,transparent);border-radius:999px;padding:4px 11px 4px 9px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.big{display:flex;align-items:baseline;gap:8px;margin:18px 0 4px;font-family:var(--num)}
.big span{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums;
  background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 62%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.card.a .big span{font-size:clamp(76px,10vw,108px)}
.big em{font-style:normal;font-family:var(--font);font-size:15px;font-weight:600;color:var(--ink2)}
.title2,.card .title{font-size:16.5px;font-weight:650;margin-top:6px}
.card.a .title{font-size:20px}
@media (min-width:901px){.card.a{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto 1fr;column-gap:34px}
  .card.a .tag{grid-column:1/-1}.card.a .big{grid-row:2/5;align-self:center;margin:12px 0 0}.card.a .title{margin-top:18px}
  .card.a .bar{grid-column:1/-1}}
.meta{margin-top:6px;font-size:13px;color:var(--ink2);line-height:1.75}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{margin-top:auto;padding-top:18px}
.track{position:relative;height:10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;width:0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent);
  transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.fill::after{content:"";position:absolute;right:2px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#fff;opacity:.9}
.cap{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
/* 薪酬 */
.rows{display:grid;gap:10px;margin-top:18px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.row .k{font-size:13px;color:var(--ink2)}
.row .val{display:flex;align-items:baseline;gap:4px;font-family:var(--num)}
.row b{font-size:24px;font-weight:700;letter-spacing:-.02em;color:color-mix(in srgb,var(--c) 82%,var(--ink));font-variant-numeric:tabular-nums}
.row i{font-style:normal;font-family:var(--font);font-size:12px;color:var(--ink3)}
.card.c .bar{padding-top:14px}
/* 节假日 */
.list{list-style:none;display:grid;gap:8px;margin-top:16px}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.list li:first-child{background:color-mix(in srgb,var(--c) 9%,var(--card));border-color:color-mix(in srgb,var(--c) 28%,var(--line))}
.list .nm{font-size:15px;font-weight:650;display:flex;align-items:center;gap:7px}
.list .kd{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:1px 7px}
.list .dt{font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.list .cd{display:flex;align-items:baseline;gap:3px;font-family:var(--num);white-space:nowrap}
.list .cd b{font-size:24px;font-weight:700;letter-spacing:-.02em;color:color-mix(in srgb,var(--c) 85%,var(--ink));font-variant-numeric:tabular-nums}
.list .cd i{font-style:normal;font-family:var(--font);font-size:12px;color:var(--ink3)}
.list .cd em{font-style:normal;font-family:var(--font);font-size:13px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:3px 10px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);text-align:center}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);grid-template-areas:"a a" "b e" "d c"}
  .card.c .rows{grid-template-columns:1fr}.card.c .row{flex-direction:row;align-items:baseline}.card.d .list{grid-auto-rows:auto}}
@media (max-width:600px){
  body{padding:28px 14px 32px}
  .grid{grid-template-columns:1fr;grid-template-areas:"a" "b" "e" "d" "c";gap:12px}
  .card{padding:19px 18px 17px;border-radius:20px}
  .big span{font-size:56px}.card.a .big span{font-size:78px}
  .today b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">

    <section class="card e">

      <div class="big"><span id="mDays">--</span><em>天后</em></div>
      <div class="title" id="mTitle">--</div>
      <div class="meta" id="mMeta"></div>
      <div class="bar">
        <div class="track"><div class="fill" id="mBar"></div></div>
        <div class="cap"><span id="mFrom"></span><span id="mTo"></span></div>
      </div>
    </section>

    <section class="card d">
      <div class="tag"><i></i>节假日 · 最近四个</div>
      <ul class="list" id="fesList"></ul>
    </section>

    <section class="card c">
      <div class="tag"><i></i>工作 · 薪酬概览</div>
      <div class="rows">
        <div class="row"><span class="k">工龄</span><span class="val"><b id="tenure">--</b><i>年</i></span></div>
        <div class="row"><span class="k">累计实发</span><span class="val"><b id="total">--</b><i>万元</i></span></div>
        <div class="row"><span class="k">月均实发</span><span class="val"><b id="avg">--</b><i>万元</i></span></div>
      </div>
      <div class="bar"><div class="meta" id="payMeta"></div></div>
    </section>
  </div>

  <footer>农历与节气数据内嵌（1900–2100），按当天日期实时计算</footer>
</div>

const BASE = Date.UTC(1900, 0, 31);
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

const leapMonth = y => LI[y - 1900] & 0xf;
const leapDays  = y => (LI[y - 1900] & 0x10000) ? 30 : 29;
const mDays     = (y, m) => (LI[y - 1900] & (0x10000 >> m)) ? 30 : 29;

function monthStart(y, m) {
  let off = ZY[y - 1900];
  const lm = leapMonth(y);
  for (let i = 1; i < m; i++) {
    off += mDays(y, i);
    if (lm === i) off += leapDays(y);
  }
  return BASE + off * DAY;
}

function solarToLunar(ts) {
  let y = new Date(ts).getUTCFullYear();
  if (ts < monthStart(y, 1)) y -= 1;
  const lm = leapMonth(y);
  for (let m = 1; m <= 12; m++) {
    const s = monthStart(y, m);
    const e = (m === 12) ? monthStart(y + 1, 1) : monthStart(y, m + 1);
    if (ts >= s && ts < e) return { y, m, d: Math.floor((ts - s) / DAY) + 1, leap: false };
    if (lm === m) {
      const ls = s + mDays(y, m) * DAY;
      if (ts >= ls && ts < e) return { y, m, d: Math.floor((ts - ls) / DAY) + 1, leap: true };
    }
  }
  return { y, m: 1, d: 1, leap: false };
}

const LUNAR_M = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const LUNAR_D = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                 "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                 "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
const lunarText = l => (l.leap ? "闰" : "") + LUNAR_M[l.m - 1] + "月" + LUNAR_D[l.d - 1];

const TERM_NAMES = ["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满",
                    "芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降",
                    "立冬","小雪","大雪","冬至"];
function termsOfYear(y) {
  const row = TD[y - 1900];
  if (!row) return [];
  return row.split(",").map((v, i) => {
    const n = +v;
    return { name: TERM_NAMES[i], ts: Date.UTC(y, (n >> 5) - 1, n & 31), kind: "节气" };
  });
}

const SOLAR_FES = [["元旦",1,1],["情人节",2,14],["妇女节",3,8],["劳动节",5,1],
                   ["儿童节",6,1],["教师节",9,10],["国庆节",10,1],
                   ["平安夜",12,24],["圣诞节",12,25]];
const LUNAR_FES = [["春节",1,1],["元宵节",1,15],["龙抬头",2,2],["端午节",5,5],
                   ["七夕",7,7],["中元节",7,15],["中秋节",8,15],["重阳节",9,9],
                   ["腊八节",12,8],["小年",12,23]];

const now = new Date();
const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
const fmt = ts => { const d = new Date(ts); const p = n => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`; };
const wk = ts => WEEK[new Date(ts).getUTCDay()];
const pct = (from, to) => Math.max(0, Math.min(100, Math.round((today - from) / (to - from) * 100)));

const tl = solarToLunar(today);
document.getElementById("tDate").textContent = fmt(today);
document.getElementById("tWeek").textContent = `${wk(today)} · 农历${lunarText(tl)}`;

/* 纪念日 */
const JOIN = Date.UTC(2023, 7, 22);
(function () {
  const addM = (ts, n) => { const d = new Date(ts); const day = d.getUTCDate();
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
    const dim = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    return Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), Math.min(day, dim)); };
  let years = 0;
  while (addM(JOIN, (years + 1) * 12) <= today) years++;
  let mm = 0;
  while (addM(addM(JOIN, years * 12), mm + 1) <= today) mm++;
  const base = addM(addM(JOIN, years * 12), mm);
  const dd = Math.floor((today - base) / DAY);
  const next = addM(JOIN, (years + 1) * 12), prev = addM(JOIN, years * 12);
  document.getElementById("aDays").textContent = Math.round((next - today) / DAY);
  document.getElementById("aTitle").textContent = `第 ${years + 1} 周年`;
  document.getElementById("aMeta").innerHTML =
    `已度过 <b>${years} 年 ${mm} 个月 ${dd} 天</b>（共 <b>${Math.round((today - JOIN) / DAY)}</b> 天）<br>起点 ${fmt(JOIN)}（${wk(JOIN)}）`;
  document.getElementById("aBar").style.width = pct(prev, next) + "%";
  document.getElementById("aFrom").textContent = fmt(prev);
  document.getElementById("aTo").textContent = fmt(next);
})();

/* 农历生日 */
function nextLunar(month, day) {
  for (let k = 0, y = tl.y; k < 4; k++, y++) {
    const ts = monthStart(y, month) + (Math.min(day, mDays(y, month)) - 1) * DAY;
    if (ts >= today) return ts;
  }
  return null;
}
function prevLunar(month, day) {
  let y = tl.y;
  let ts = monthStart(y, month) + (Math.min(day, mDays(y, month)) - 1) * DAY;
  if (ts <= today) return ts;
  y -= 1;
  return monthStart(y, month) + (Math.min(day, mDays(y, month)) - 1) * DAY;
}
function ageOn(birth, ts) {
  const b = new Date(birth), t = new Date(ts);
  let a = t.getUTCFullYear() - b.getUTCFullYear();
  const m = t.getUTCMonth() - b.getUTCMonth();
  if (m < 0 || (m === 0 && t.getUTCDate() < b.getUTCDate())) a--;
  return a;
}
function renderLunar(prefix, month, day, birth, who) {
  const el = id => document.getElementById(id);
  const next = nextLunar(month, day);
  if (!next) { el(prefix + "Days").textContent = "—"; el(prefix + "Title").textContent = "数据超出范围"; return; }
  const prev = prevLunar(month, day);
  el(prefix + "Days").textContent = Math.round((next - today) / DAY);
  el(prefix + "Title").textContent = `${fmt(next)}（${wk(next)}）· ${ageOn(birth, next)} 岁`;
  el(prefix + "Meta").innerHTML =
    `${who} · 出生 <b>${fmt(birth)}</b>（${wk(birth)}）<br>本轮已过 <b>${Math.round((today - prev) / DAY)}</b> 天`;
  el(prefix + "Bar").style.width = pct(prev, next) + "%";
  el(prefix + "From").textContent = fmt(prev);
  el(prefix + "To").textContent = fmt(next);
}
renderLunar("h", 9, 26, Date.UTC(2000, 9, 23), "农历九月廿六");
renderLunar("m", 12, 8, Date.UTC(1998, 0, 6), "农历腊月初八");

/* 工作 · 薪酬概览 */
(function () {
  const PROFILE = { hireDate: "2024-04-08", baseTotal: 34.82, baseMonths: 31, updatedAt: "2026-11" };
  const ENTRIES = [];
  const p = PROFILE.hireDate.split("-");
  const from = new Date(+p[0], +p[1] - 1, +p[2]);
  const nowD = new Date();
  let m = (nowD.getFullYear() - from.getFullYear()) * 12 + (nowD.getMonth() - from.getMonth());
  if (nowD.getDate() < from.getDate()) m -= 1;
  const tenure = Math.max(0, m) / 12;
  const extra = ENTRIES.reduce((s, e) => s + (Number(e.net) || 0), 0) / 10000;
  const total = PROFILE.baseTotal + extra;
  const months = PROFILE.baseMonths + ENTRIES.length;
  const avg = months > 0 ? total / months : 0;
  const money = v => v.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const ym = s => { const a = s.split("-"); return `${a[0]} 年 ${+a[1]} 月`; };
  document.getElementById("tenure").textContent = tenure.toFixed(2);
  document.getElementById("total").textContent = money(total);
  document.getElementById("avg").textContent = money(avg);
  const last = ENTRIES.length ? ENTRIES[ENTRIES.length - 1].month : PROFILE.updatedAt;
  document.getElementById("payMeta").innerHTML =
    `入职 ${PROFILE.hireDate} · 含 <b>${months}</b> 个月实发<br>数据截至 ${ym(last)}`;
})();

/* 节假日：节气 + 公历节日 + 农历节日，取未来最近 4 个 */
(function () {
  const y0 = new Date(today).getUTCFullYear();
  const all = [];
  for (let y = y0; y <= y0 + 2; y++) {
    termsOfYear(y).forEach(t => all.push(t));
    SOLAR_FES.forEach(f => all.push({ name: f[0], ts: Date.UTC(y, f[1] - 1, f[2]), kind: "公历" }));
    LUNAR_FES.forEach(f => all.push({
      name: f[0], ts: monthStart(y, f[1]) + (Math.min(f[2], mDays(y, f[1])) - 1) * DAY, kind: "农历" }));
    all.push({ name: "除夕", ts: monthStart(y, 12) + (mDays(y, 12) - 1) * DAY, kind: "农历" });
  }
  const seen = new Set();
  const next4 = all.filter(o => o.ts >= today)
    .filter(o => { const k = o.name + fmt(o.ts); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => a.ts - b.ts).slice(0, 4);
  document.getElementById("fesList").innerHTML = next4.map(o => {
    const left = Math.round((o.ts - today) / DAY);
    const cd = left === 0 ? "<em>今天</em>" : `<b>${left}</b><i>天后</i>`;
    return `<li><div><div class="nm">${o.name}<span class="kd">${o.kind}</span></div>`
      + `<div class="dt">${fmt(o.ts)} ${wk(o.ts)}</div></div><div class="cd">${cd}</div></li>`;
  }).join("");
})();

<script>
/* 主题切换：与其他合集页共用 hd-theme 设置 */
document.getElementById('thmBtn').addEventListener('click',function(){
  var d=document.documentElement,dark=d.getAttribute('data-theme')!=='dark';
  if(dark)d.setAttribute('data-theme','dark');else d.removeAttribute('data-theme');
  try{localStorage.setItem('hd-theme',dark?'dark':'light');}catch(e){}
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?'#101216':'#faf8f3';
});
</script>
</body>
</html>
