<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倒数日</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --text:#1b2330; --sub:#6b7684; --line:#e6ebf2;
    --c1:#2f7cf6; --c2:#e8558a; --c3:#1fae72; --c4:#f0932b; --c5:#7c5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1100px 520px at 50% -12%, #e6efff 0%, var(--bg) 58%);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text); padding:34px 20px 46px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:24px;font-weight:700;letter-spacing:1px}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:8px;letter-spacing:1.5px}
  .today{text-align:right;font-size:12px;color:var(--sub);line-height:1.7}
  .today b{display:block;font-size:22px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    grid-template-areas:"a b d" "c e d";
    gap:18px;align-items:stretch;
  }
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px 20px 18px;box-shadow:0 10px 26px rgba(27,35,48,.06);overflow:hidden;
    display:flex;flex-direction:column;min-width:0;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .card.a{grid-area:a}.card.b{grid-area:b}.card.c{grid-area:c}
  .card.d{grid-area:d}.card.e{grid-area:e}
  .tag{font-size:12px;color:var(--sub);letter-spacing:.6px;display:flex;align-items:center;gap:6px}
  .tag i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
  .big{display:flex;align-items:baseline;gap:6px;margin:14px 0 4px}
  .big span{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1.5px;color:var(--accent);font-variant-numeric:tabular-nums}
  .big em{font-style:normal;font-size:13px;color:var(--sub)}
  .title{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.5}
  .meta{font-size:12.5px;color:var(--sub);line-height:1.95}
  .meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .bar{margin-top:auto;padding-top:16px}
  .track{height:6px;border-radius:99px;background:#eef2f7;overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .7s ease}
  .cap{display:flex;justify-content:space-between;font-size:11px;color:#9aa4b1;margin-top:7px;font-variant-numeric:tabular-nums}
  .rows{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0;padding-bottom:0}
  .row .k{font-size:12.5px;color:var(--sub);white-space:nowrap}
  .row .val{display:flex;align-items:baseline;gap:3px}
  .row .val b{font-size:21px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .row .val i{font-style:normal;font-size:11px;color:var(--sub)}
  .list{list-style:none;margin-top:6px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
  .list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .list li:last-child{border-bottom:0;padding-bottom:0}
  .list .nm{font-size:13.5px;font-weight:600}
  .list .kd{font-size:11px;color:#9aa4b1;margin-left:7px;font-weight:400}
  .list .dt{font-size:12px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
  .list .cd{text-align:right;white-space:nowrap}
  .list .cd b{font-size:20px;color:var(--c4);font-variant-numeric:tabular-nums}
  .list .cd i{font-style:normal;font-size:11px;color:var(--sub);margin-left:2px}
  .list .cd em{font-style:normal;font-size:13px;color:var(--c4);font-weight:600}
  footer{margin-top:22px;text-align:center;font-size:12px;color:#9aa4b1;letter-spacing:.5px}
  @media(max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);grid-template-areas:"a b" "c e" "d d"}
  }
  @media(max-width:700px){
    body{padding:22px 14px 36px}
    h1{font-size:20px}
    .today{text-align:left}
    .grid{grid-template-columns:1fr;grid-template-areas:"a" "b" "e" "c" "d";gap:14px}
    .big span{font-size:38px}
  }
</style>
</head>

<div class="wrap">
  <header>
    <h1>倒数日<small>纪念日 · 生日 · 工作 · 节假日</small></h1>
    <div class="today"><b id="tDate">--</b><span id="tWeek"></span></div>
  </header>

  <div class="grid">
    <section class="card a" style="--accent:#2f7cf6">
      <div class="tag"><i></i>纪念日</div>
      <div class="big"><span id="aDays">--</span><em>天后</em></div>
      <div class="title" id="aTitle">--</div>
      <div class="meta" id="aMeta"></div>
      <div class="bar">
        <div class="track"><div class="fill" id="aBar"></div></div>
        <div class="cap"><span id="aFrom"></span><span id="aTo"></span></div>
      </div>
    </section>

    <section class="card b" style="--accent:#e8558a">

      <div class="title" id="hTitle">--</div>

        <div class="track"><div class="fill" id="hBar"></div></div>
        <div class="cap"><span id="hFrom"></span><span id="hTo"></span></div>
      </div>
    </section>

    <section class="card c" style="--accent:#7c5cff">

      <div class="rows">

      </div>
      <div class="bar"><div class="meta" id="payMeta"></div></div>
    </section>

    <section class="card e" style="--accent:#1fae72">
      <div class="tag"><i></i>生日 · 我</div>
      <div class="big"><span id="mDays">--</span><em>天后</em></div>
      <div class="title" id="mTitle">--</div>
      <div class="meta" id="mMeta"></div>
      <div class="bar">
        <div class="track"><div class="fill" id="mBar"></div></div>
        <div class="cap"><span id="mFrom"></span><span id="mTo"></span></div>
      </div>
    </section>

    <section class="card d" style="--accent:#f0932b">
      <div class="tag"><i></i>节假日 · 最近四个</div>
      <ul class="list" id="fesList"></ul>
    </section>
  </div>

  <footer>农历与节气数据内嵌（1900–2100），按当天日期实时计算</footer>
</div>

const BASE = Date.UTC(1900, 0, 31);
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

const leapMonth = y => LI[y - 1900] & 0xf;
const leapDays  = y => (LI[y - 1900] & 0x10000) ? 30 : 29;
const mDays     = (y, m) => (LI[y - 1900] & (0x10000 >> m)) ? 30 : 29;

function monthStart(y, m) {
  let off = ZY[y - 1900];
  const lm = leapMonth(y);
  for (let i = 1; i < m; i++) {
    off += mDays(y, i);
    if (lm === i) off += leapDays(y);
  }
  return BASE + off * DAY;
}

function solarToLunar(ts) {
  let y = new Date(ts).getUTCFullYear();
  if (ts < monthStart(y, 1)) y -= 1;
  const lm = leapMonth(y);
  for (let m = 1; m <= 12; m++) {
    const s = monthStart(y, m);
    const e = (m === 12) ? monthStart(y + 1, 1) : monthStart(y, m + 1);
    if (ts >= s && ts < e) return { y, m, d: Math.floor((ts - s) / DAY) + 1, leap: false };
    if (lm === m) {
      const ls = s + mDays(y, m) * DAY;
      if (ts >= ls && ts < e) return { y, m, d: Math.floor((ts - ls) / DAY) + 1, leap: true };
    }
  }
  return { y, m: 1, d: 1, leap: false };
}

const LUNAR_M = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const LUNAR_D = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                 "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                 "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
const lunarText = l => (l.leap ? "闰" : "") + LUNAR_M[l.m - 1] + "月" + LUNAR_D[l.d - 1];

const TERM_NAMES = ["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满",
                    "芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降",
                    "立冬","小雪","大雪","冬至"];
function termsOfYear(y) {
  const row = TD[y - 1900];
  if (!row) return [];
  return row.split(",").map((v, i) => {
    const n = +v;
    return { name: TERM_NAMES[i], ts: Date.UTC(y, (n >> 5) - 1, n & 31), kind: "节气" };
  });
}

const SOLAR_FES = [["元旦",1,1],["情人节",2,14],["妇女节",3,8],["劳动节",5,1],
                   ["儿童节",6,1],["教师节",9,10],["国庆节",10,1],
                   ["平安夜",12,24],["圣诞节",12,25]];
const LUNAR_FES = [["春节",1,1],["元宵节",1,15],["龙抬头",2,2],["端午节",5,5],
                   ["七夕",7,7],["中元节",7,15],["中秋节",8,15],["重阳节",9,9],
                   ["腊八节",12,8],["小年",12,23]];

const now = new Date();
const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
const fmt = ts => { const d = new Date(ts); const p = n => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`; };
const wk = ts => WEEK[new Date(ts).getUTCDay()];
const pct = (from, to) => Math.max(0, Math.min(100, Math.round((today - from) / (to - from) * 100)));

const tl = solarToLunar(today);
document.getElementById("tDate").textContent = fmt(today);
document.getElementById("tWeek").textContent = `${wk(today)} · 农历${lunarText(tl)}`;

/* 纪念日 */
const JOIN = Date.UTC(2023, 7, 22);
(function () {
  const addM = (ts, n) => { const d = new Date(ts); const day = d.getUTCDate();
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
    const dim = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    return Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), Math.min(day, dim)); };
  let years = 0;
  while (addM(JOIN, (years + 1) * 12) <= today) years++;
  let mm = 0;
  while (addM(addM(JOIN, years * 12), mm + 1) <= today) mm++;
  const base = addM(addM(JOIN, years * 12), mm);
  const dd = Math.floor((today - base) / DAY);
  const next = addM(JOIN, (years + 1) * 12), prev = addM(JOIN, years * 12);
  document.getElementById("aDays").textContent = Math.round((next - today) / DAY);
  document.getElementById("aTitle").textContent = `第 ${years + 1} 周年`;
  document.getElementById("aMeta").innerHTML =
    `已度过 <b>${years} 年 ${mm} 个月 ${dd} 天</b>（共 <b>${Math.round((today - JOIN) / DAY)}</b> 天）<br>起点 ${fmt(JOIN)}（${wk(JOIN)}）`;
  document.getElementById("aBar").style.width = pct(prev, next) + "%";
  document.getElementById("aFrom").textContent = fmt(prev);
  document.getElementById("aTo").textContent = fmt(next);
})();

/* 农历生日 */
function nextLunar(month, day) {
  for (let k = 0, y = tl.y; k < 4; k++, y++) {
    const ts = monthStart(y, month) + (Math.min(day, mDays(y, month)) - 1) * DAY;
    if (ts >= today) return ts;
  }
  return null;
}
function prevLunar(month, day) {
  let y = tl.y;
  let ts = monthStart(y, month) + (Math.min(day, mDays(y, month)) - 1) * DAY;
  if (ts <= today) return ts;
  y -= 1;
  return monthStart(y, month) + (Math.min(day, mDays(y, month)) - 1) * DAY;
}
function ageOn(birth, ts) {
  const b = new Date(birth), t = new Date(ts);
  let a = t.getUTCFullYear() - b.getUTCFullYear();
  const m = t.getUTCMonth() - b.getUTCMonth();
  if (m < 0 || (m === 0 && t.getUTCDate() < b.getUTCDate())) a--;
  return a;
}
function renderLunar(prefix, month, day, birth, who) {
  const el = id => document.getElementById(id);
  const next = nextLunar(month, day);
  if (!next) { el(prefix + "Days").textContent = "—"; el(prefix + "Title").textContent = "数据超出范围"; return; }
  const prev = prevLunar(month, day);
  el(prefix + "Days").textContent = Math.round((next - today) / DAY);
  el(prefix + "Title").textContent = `${fmt(next)}（${wk(next)}）· ${ageOn(birth, next)} 岁`;
  el(prefix + "Meta").innerHTML =
    `${who} · 出生 <b>${fmt(birth)}</b>（${wk(birth)}）<br>本轮已过 <b>${Math.round((today - prev) / DAY)}</b> 天`;
  el(prefix + "Bar").style.width = pct(prev, next) + "%";
  el(prefix + "From").textContent = fmt(prev);
  el(prefix + "To").textContent = fmt(next);
}
renderLunar("h", 9, 26, Date.UTC(2000, 9, 23), "农历九月廿六");
renderLunar("m", 12, 8, Date.UTC(1998, 0, 6), "农历腊月初八");

/* 工作 · 薪酬概览 */
(function () {
  const PROFILE = { hireDate: "2024-04-08", baseTotal: 34.82, baseMonths: 31, updatedAt: "2026-11" };
  const ENTRIES = [];
  const p = PROFILE.hireDate.split("-");
  const from = new Date(+p[0], +p[1] - 1, +p[2]);
  const nowD = new Date();
  let m = (nowD.getFullYear() - from.getFullYear()) * 12 + (nowD.getMonth() - from.getMonth());
  if (nowD.getDate() < from.getDate()) m -= 1;
  const tenure = Math.max(0, m) / 12;
  const extra = ENTRIES.reduce((s, e) => s + (Number(e.net) || 0), 0) / 10000;
  const total = PROFILE.baseTotal + extra;
  const months = PROFILE.baseMonths + ENTRIES.length;
  const avg = months > 0 ? total / months : 0;
  const money = v => v.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const ym = s => { const a = s.split("-"); return `${a[0]} 年 ${+a[1]} 月`; };
  document.getElementById("tenure").textContent = tenure.toFixed(2);
  document.getElementById("total").textContent = money(total);
  document.getElementById("avg").textContent = money(avg);
  const last = ENTRIES.length ? ENTRIES[ENTRIES.length - 1].month : PROFILE.updatedAt;
  document.getElementById("payMeta").innerHTML =
    `入职 ${PROFILE.hireDate} · 含 <b>${months}</b> 个月实发<br>数据截至 ${ym(last)}`;
})();

/* 节假日：节气 + 公历节日 + 农历节日，取未来最近 4 个 */
(function () {
  const y0 = new Date(today).getUTCFullYear();
  const all = [];
  for (let y = y0; y <= y0 + 2; y++) {
    termsOfYear(y).forEach(t => all.push(t));
    SOLAR_FES.forEach(f => all.push({ name: f[0], ts: Date.UTC(y, f[1] - 1, f[2]), kind: "公历" }));
    LUNAR_FES.forEach(f => all.push({
      name: f[0], ts: monthStart(y, f[1]) + (Math.min(f[2], mDays(y, f[1])) - 1) * DAY, kind: "农历" }));
    all.push({ name: "除夕", ts: monthStart(y, 12) + (mDays(y, 12) - 1) * DAY, kind: "农历" });
  }
  const seen = new Set();
  const next4 = all.filter(o => o.ts >= today)
    .filter(o => { const k = o.name + fmt(o.ts); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => a.ts - b.ts).slice(0, 4);
  document.getElementById("fesList").innerHTML = next4.map(o => {
    const left = Math.round((o.ts - today) / DAY);
    const cd = left === 0 ? "<em>今天</em>" : `<b>${left}</b><i>天后</i>`;
    return `<li><div><div class="nm">${o.name}<span class="kd">${o.kind}</span></div>`
      + `<div class="dt">${fmt(o.ts)} ${wk(o.ts)}</div></div><div class="cd">${cd}</div></li>`;
  }).join("");
})();
