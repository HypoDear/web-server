<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="模型桥与账号状态">
<meta name="theme-color" content="#faf8f3">
<meta name="color-scheme" content="light">
<title>模型桥状态</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23faf8f3'/><circle cx='16' cy='16' r='7' fill='none' stroke='%231b6b85' stroke-width='2.4'/><circle cx='16' cy='16' r='2.6' fill='%231b6b85'/></svg>">
<style>
:root{
  --bg:#faf8f3; --card:#fff; --line:#e7e1d5; --line2:#d2c9b8;
  --ink:#241f19; --ink2:#6a6257; --ink3:#9b9387;
  --ok:#2e9e68; --warn:#b0623e; --bad:#b2402f; --idle:#9b9387;
  --shadow:0 1px 2px rgba(60,50,35,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;
  -webkit-font-smoothing:antialiased;padding:max(40px,env(safe-area-inset-top)) 22px max(44px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;
  background-image:radial-gradient(880px 460px at 16% -10%,rgba(31,111,139,.07),transparent 64%),
    radial-gradient(700px 400px at 97% 2%,rgba(176,98,62,.055),transparent 62%);
  background-attachment:fixed;
}
.wrap{width:100%;max-width:900px}
a{color:inherit;text-decoration:none}
header{margin:0 0 22px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between}
h1{margin:0;font-size:clamp(24px,5vw,34px);font-weight:650;letter-spacing:-.018em;line-height:1.14}
h1 em{font-style:normal;color:var(--ink3);font-weight:500}
.meta{color:var(--ink3);font-size:12px;text-align:right;line-height:1.7}
.meta b{color:var(--ink2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--idle);opacity:.85}
.card[data-state=ok]::after{background:var(--ok)}
.card[data-state=degraded]::after,.card[data-state=cooling]::after{background:var(--warn)}
.card[data-state=down]::after{background:var(--bad)}
.card[data-state=login]::after{background:var(--ink3)}
.card.wide{grid-column:span 2}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--ink2);white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.card[data-state=ok] .badge i{background:var(--ok)}
.card[data-state=degraded] .badge i,.card[data-state=cooling] .badge i{background:var(--warn)}
.card[data-state=down] .badge i{background:var(--bad)}
.bar{height:7px;border-radius:99px;background:#efe9dc;margin:14px 0 8px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1b6b85,#2e9e68);transition:width .5s ease}
.bar.low>i{background:linear-gradient(90deg,#b0623e,#c9803f)}
.bar.out>i{background:var(--bad)}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.kv b{font-weight:650;color:var(--ink)}
.foot{margin-top:9px;font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;gap:10px}
.acct{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acct .a{flex:1 1 180px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fbf9f4}
.acct .a .an{font-size:13px;font-weight:600}
.acct .a .ad{font-size:11px;color:var(--ink3)}
.acct .a .av{font-size:12px;color:var(--ink2);margin-top:3px}
.empty{font-size:12px;color:var(--ink3);margin-top:10px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.card.wide{grid-column:span 1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>模型桥<em>状态</em></h1>
    <div class="meta">
      <div>更新于 <b id="at">—</b></div>
      <div id="up">—</div>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<script>
const LABEL = { ok:'可用', degraded:'降级', cooling:'冷却中', down:'不可用', login:'未登录', unknown:'未知' };
const fmt = (n) => (typeof n === 'number' ? String(Math.round(n)) : '—');

// 昵称优先；没有昵称的厂商退到尾号，都没有就不显示这一段
function accountLine(a){
  if (!a || a.loggedIn === false) return '未登录';
  const who = a.nickname || (a.tag ? `尾号 ${a.tag}` : '');
  const left = typeof a.daysLeft === 'number' ? `${a.daysLeft} 天后到期` : '';
  return [who, left].filter(Boolean).join(' · ') || '已登录';
}

function card(p){
  const q = p.quota;
  // 只报余额本身：套餐上限（分母）各家口径不一样，也不代表"还能用多少"。
  const quota = q
    ? `<div class="kv"><span>剩余 <b>${fmt(q.remaining)}</b></span></div>`
    : `<div class="kv"><span>${p.noCredits ? '无额度接口' : '余额不可读'}</span><span>—</span></div>`;
  const foot = [p.detail, p.latencyMs !== undefined ? `${p.latencyMs}ms` : ''].filter(Boolean).join(' · ');
  return `<div class="card" data-state="${p.state}">
    <div class="row">
      <div>
        <div class="nm">${p.label}</div>
        <div class="sub">${accountLine(p.account)}</div>
      </div>
      <span class="badge"><i></i>${LABEL[p.state] || p.state}</span>
    </div>
    ${quota}
    <div class="foot"><span>${foot}</span></div>
  </div>`;
}

// WorkBuddy：积分按账号铺开，多账号就多一张内嵌小卡
function buddyCard(b){
  const cr = b.credits || {};
  const list = cr.ok === true ? (cr.accounts || []) : [];
  const remain = typeof cr.remaining === 'number' ? cr.remaining : null;

  let body;
  if (cr.ok !== true) {
    body = `<div class="empty">${cr.error === 'not-logged-in' ? '未登录' : '读取失败'}</div>`;
  } else if (list.length === 0) {
    body = `<div class="empty">无账号</div>`;
  } else {
    body = `<div class="acct">${list.map((a) => `
      <div class="a">
        <div class="an">${a.nickname || (a.id ? `账号 ${a.id}` : '账号')}</div>
        <div class="ad">${a.daysLeft !== undefined ? `${a.daysLeft} 天后到期` : '到期未知'}</div>
        <div class="av">${a.error ? '读取失败' : `剩余 <b>${fmt(a.remaining)}</b>`}</div>
      </div>`).join('')}</div>`;
  }

  const consume = b.ok === true
    ? `<div class="kv" style="margin-top:10px"><span>今日 ${fmt(b.today)} · 近 7 日 ${fmt(b.week)}</span><span>${b.requests} 次</span></div>`
    : '';

  return `<div class="card wide" data-state="${cr.ok === true ? 'ok' : 'login'}">
    <div class="row">
      <div>
        <div class="nm">WorkBuddy</div>
        <div class="sub">账号积分</div>
      </div>
      <span class="badge"><i></i>${cr.ok === true ? '已登录' : '未登录'}</span>
    </div>
    <div class="kv"><span>剩余 <b>${fmt(remain)}</b></span></div>
    ${body}
    ${consume}
  </div>`;
}

async function load(){
  try {
    const res = await fetch(`status.json?v=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const doc = await res.json();
    const cards = (doc.providers || []).map(card).join('');
    document.getElementById('grid').innerHTML = cards + (doc.buddy ? buddyCard(doc.buddy) : '');
    document.getElementById('at').textContent = new Date(doc.updatedAt).toLocaleString('zh-CN', { hour12: false });
    const b = doc.bridge || {};
    document.getElementById('up').textContent = b.reachable && b.uptimeMs
      ? `运行 ${Math.floor(b.uptimeMs / 3600000)} 小时 ${Math.floor(b.uptimeMs % 3600000 / 60000)} 分`
      : (b.reachable ? '在线' : '离线');
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<div class="card wide" data-state="unknown"><div class="row"><div class="nm">读不到状态</div></div>
       <div class="foot"><span>status.json 未生成或桥没跑</span></div></div>`;
    document.getElementById('at').textContent = '—';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
