<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="中国象棋，双人对战与三档 AI 对手，含残局闯关，单文件零依赖">
<meta name="theme-color" content="#f4efe4">
<title>中国象棋</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><rect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23e3c88f%27/><circle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27%23f7f1e4%27 stroke=%27%238f7040%27 stroke-width=%271.8%27/><circle cx=%2716%27 cy=%2716%27 r=%278.8%27 fill=%27none%27 stroke=%27%23b03a2e%27 stroke-width=%271.2%27/></svg>">
<script>
/* 主题引导：首帧前恢复上次手动选择的深夜模式；默认保持白天 */
(function(){try{
  if(localStorage.getItem('hd-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();
</script>
<style>
:root{
  --paper:#f4efe4; --paper2:#fbf8f1; --ink:#2f2a24; --ink-soft:#8c8275;
  --line:#d8cfbe; --wood:#e3c88f; --wood2:#d9b978;
  --red:#b03a2e; --blk:#2b2724; --accent:#1f6f8b; --bad:#c0463c;
  --good:#2e7d5b; --radius:10px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15171c; --paper2:#1c1f26; --ink:#e8e4dc; --ink-soft:#9aa0ab;
  --line:#2e333d; --accent:#5fb3d0; --bad:#e0796e; --good:#5ec08c;
  --wood:#3b3027; --wood2:#2f261f; --red:#d9604f; --blk:#14161a;
}
/* 棋盘压暗；棋子面保持浅色圆盘（棋子是认读主体，不能跟着变暗） */
[data-theme="dark"] .tools button:active{background:#262b33}
[data-theme="dark"] .tools button.snd .sndTr{background:#343a44}
[data-theme="dark"] .tools button.snd .sndTr::after{background:#e8e4dc;box-shadow:0 1px 2px rgba(0,0,0,.5)}
[data-theme="dark"] .mask{background:rgba(21,23,28,.95)}
[data-theme="dark"] .thinking span{box-shadow:0 2px 8px rgba(0,0,0,.5)}

/* ===== 主题切换开关 ===== */
.thm{position:relative;display:inline-flex;align-items:center;justify-content:center;
  flex:none;width:30px;height:30px;padding:0;cursor:pointer;
  border:1px solid var(--thm-line,var(--line));border-radius:999px;
  background:var(--thm-bg,var(--paper2));color:var(--thm-fg,var(--ink-soft,var(--ink)));
  -webkit-tap-highlight-color:transparent;
  transition:background .2s,border-color .2s,color .2s}
.thm:hover{color:var(--thm-fg-on,var(--accent));border-color:var(--thm-line-on,var(--accent))}
.thm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thm svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.thm .sun{transition:opacity .22s,transform .32s cubic-bezier(.3,.8,.3,1)}
.thm .moon{position:absolute;transition:opacity .22s,transform .32s cubic-bezier(.3,.8,.3,1)}
/* 浅色：显示月亮（点击去深色）；深色：显示太阳（点击回浅色） */
.thm .sun{opacity:0;transform:rotate(-70deg) scale(.6)}
.thm .moon{opacity:1;transform:none}
[data-theme="dark"] .thm .sun{opacity:1;transform:none}
[data-theme="dark"] .thm .moon{opacity:0;transform:rotate(70deg) scale(.6)}
@media(prefers-reduced-motion:reduce){.thm,.thm svg,.thm .sun,.thm .moon{transition-duration:.01ms!important}}
.tools button.thm{flex:0 0 auto;width:29px;min-width:29px;height:29px;padding:0;
  background:var(--paper2);color:var(--ink-soft);border-color:var(--line);
  display:inline-flex;align-items:center;justify-content:center}
.tools button.thm:hover{color:var(--ink);border-color:var(--line)}
.tools button.thm:active{background:var(--paper2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
  overscroll-behavior:none; touch-action:manipulation;
}
.wrap{width:100%;max-width:470px;display:flex;flex-direction:column;gap:7px;min-height:0;flex:none}
@media (orientation:landscape) and (max-height:560px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--bmax,60vh);
    grid-template-rows:none;gap:7px 12px;align-content:center;align-items:center;
    width:100%;max-width:none}
  .wrap>*{grid-column:1;min-width:0}
  .board-box,.frame{grid-column:2;grid-row:1/span 20}
}
.seg{display:flex;background:var(--paper2);border:1px solid var(--line);
  border-radius:var(--radius);padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:7px;
  padding:7px 2px;cursor:pointer;color:var(--ink-soft);font-family:inherit;
  font-size:13px;font-weight:600;letter-spacing:.5px;
  white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg[hidden]{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12px;color:var(--ink-soft);min-height:29px}
.turn{display:flex;align-items:center;gap:5px;white-space:nowrap;flex:none}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.dot.r{background:radial-gradient(circle at 34% 30%,#d9645a,var(--red) 72%)}
.dot.k{background:radial-gradient(circle at 34% 30%,#6d6763,var(--blk) 72%)}
.tools{display:flex;gap:5px;justify-content:space-between}
.tools button{flex:1;border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  border-radius:999px;padding:5px 2px;height:29px;font-family:inherit;font-size:12.5px;
  cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.tools button:active{background:#ece3d2}
.tools button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.snd{position:relative;width:88px;height:29px;padding:0 4px 0 11px;flex:none;
  border:1px solid var(--line);background:var(--paper2);border-radius:999px;
  font-family:inherit;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
button.snd:active{background:#ece3d2}
button.snd:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.snd .sndTx{letter-spacing:1px;color:var(--ink-soft);transition:color .18s}
button.snd .sndTr{position:relative;flex:none;width:30px;height:16px;border-radius:999px;
  background:#d8cfbe;box-shadow:inset 0 1px 2px rgba(47,42,36,.22);transition:background .18s}
button.snd .sndTr::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9e4da 80%);
  box-shadow:0 1px 2px rgba(47,42,36,.4);transition:transform .18s}
button.snd[aria-checked="true"] .sndTx{color:var(--ink)}
button.snd[aria-checked="true"] .sndTr{background:var(--good);
  box-shadow:inset 0 1px 2px rgba(20,60,42,.3)}
button.snd[aria-checked="true"] .sndTr::after{transform:translateX(14px)}
.thinking{display:none;align-items:center;justify-content:center;flex:none;
  font-size:11.5px;color:var(--ink);letter-spacing:2px;pointer-events:none;white-space:nowrap}
.thinking.show{display:flex}
.thinking span{background:var(--paper2);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;box-shadow:0 2px 8px rgba(47,42,36,.1);
  animation:thinkPulse 1s ease-in-out infinite}
@keyframes thinkPulse{0%,100%{opacity:1}50%{opacity:.6}}
.board-box{width:min(100%,calc(min(var(--bmax,64vh),540px)*584/640));flex:none;
  aspect-ratio:584/640;margin:0 auto;
  position:relative;border-radius:9px;overflow:hidden;
  background:
    repeating-linear-gradient(93deg,rgba(146,108,54,.06) 0 1px,rgba(255,255,255,0) 1px 5px),
    repeating-linear-gradient(91deg,rgba(120,88,42,.045) 0 2px,rgba(255,255,255,0) 2px 13px),
    repeating-linear-gradient(1deg,rgba(128,94,46,.04) 0 2px,rgba(255,255,255,0) 2px 9px),
    radial-gradient(140% 105% at 24% 10%,rgba(255,246,218,.9),rgba(255,246,218,0) 56%),
    radial-gradient(130% 115% at 84% 96%,rgba(112,80,38,.26),rgba(112,80,38,0) 58%),
    linear-gradient(158deg,#ebd39c,#d4ae6b);
  border:1px solid rgba(118,88,46,.7);
  box-shadow:
    inset 0 2px 0 rgba(255,250,232,.75),
    inset 0 -3px 0 rgba(108,78,38,.35),
    inset 2px 0 0 rgba(255,250,232,.4),
    inset -2px 0 0 rgba(108,78,38,.18),
    inset 0 7px 16px rgba(255,248,226,.3),
    inset 0 -10px 22px rgba(104,74,36,.26),
    inset 0 0 50px rgba(104,74,36,.1),
    0 4px 7px rgba(47,38,24,.22),
    0 10px 22px rgba(47,38,24,.2),
    0 20px 40px rgba(47,38,24,.12);
  cursor:pointer;touch-action:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.mask{position:fixed;inset:0;background:rgba(244,239,228,.95);display:none;
  align-items:center;justify-content:center;z-index:9;padding:22px;text-align:center;overflow-y:auto}
.mask.show{display:flex}
#maskBody{display:flex;flex-direction:column;align-items:center;gap:13px;max-width:100%}
.mask h2{margin:0;font-size:24px;letter-spacing:4px}
.mask h2.win{color:var(--good)}
.mask h2.lose{color:var(--bad)}
.mask p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.9;max-width:330px}
.mask .mbtn{border:none;background:var(--ink);color:var(--paper);
  border-radius:var(--radius);padding:11px 28px;font-family:inherit;font-size:13px;
  cursor:pointer;letter-spacing:2px}
.mask .mbtn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
.mask .opts{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:360px}
.mask .opts button{border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  border-radius:var(--radius);padding:9px 14px;font-family:inherit;font-size:12.5px;
  cursor:pointer;letter-spacing:1px;text-align:left;line-height:1.5}
.mask .opts button strong{display:block;font-size:13px;font-weight:600}
.mask .opts button em{font-style:normal;font-size:11px;color:var(--ink-soft)}
.mask .opts button:hover{background:#f2ece0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.confetti i{position:absolute;top:-12px;border-radius:1px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:1}
  100%{transform:translateY(102vh) rotate(720deg);opacity:.85}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);
  padding:9px 18px;border-radius:999px;font-size:12.5px;letter-spacing:1px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:8;white-space:nowrap}
.toast.show{opacity:.94;transform:translateX(-50%) translateY(0)}
.tgt,.tgtcap{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.tgt{z-index:1;width:3.4%;aspect-ratio:1;
  background:radial-gradient(circle at 42% 38%,rgba(72,158,118,.95),rgba(38,110,80,.85) 70%);
  box-shadow:0 0 0 3px rgba(46,125,91,.15),0 1px 2px rgba(20,50,36,.45)}
.tgtcap{z-index:3;width:11%;aspect-ratio:1;border:2.4px solid rgba(176,58,46,.82);
  box-shadow:0 0 9px rgba(176,58,46,.35)}
.pc{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;
  width:9.2%;aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);
  font-size:calc(var(--pcw,420px)*.052);
  font-weight:700;line-height:1;cursor:pointer;user-select:none;
  text-shadow:0 -.5px .5px rgba(47,42,36,.22);
  background:linear-gradient(158deg,#fffdf6 0%,#f6ecd6 46%,#e6d6b2 74%,#d0ba8d 100%);
  border:1px solid rgba(140,112,66,.55);
  box-shadow:
    inset 0 2.6px 0 rgba(255,255,255,.97),
    inset 0 -3.8px 0 rgba(146,113,62,.42),
    inset 1.8px 0 0 rgba(255,255,255,.62),
    inset -1.8px 0 0 rgba(146,113,62,.22),
    inset 0 -7px 10px rgba(138,105,58,.28),
    inset 0 5px 8px rgba(255,252,240,.55),
    0 2.2px 0 rgba(118,90,48,.55),
    0 3.4px 0 rgba(96,72,38,.35),
    0 5.5px 7px rgba(47,38,24,.28),
    0 10px 18px rgba(47,38,24,.18);
  transition:left .17s cubic-bezier(.34,1.3,.5,1),top .17s cubic-bezier(.34,1.3,.5,1),
    transform .14s cubic-bezier(.34,1.56,.64,1),opacity .2s,box-shadow .16s ease}
.pc::before{content:'';position:absolute;inset:9.5%;border-radius:50%;
  box-shadow:
    inset 0 1.4px 1.4px rgba(255,255,255,.9),
    inset 0 -1.6px 2px rgba(146,113,62,.42),
    inset 0 0 0 1px rgba(255,252,242,.35);
  pointer-events:none}
.pc.red{color:#a8291d}
.pc.red::before{box-shadow:
  inset 0 0 0 1.6px rgba(168,41,29,.78),
  inset 0 1.4px 1.4px rgba(255,255,255,.85),
  inset 0 -1.8px 2.4px rgba(133,52,42,.38)}
.pc.black{color:#23201c}
.pc.black::before{box-shadow:
  inset 0 0 0 1.6px rgba(40,36,32,.82),
  inset 0 1.4px 1.4px rgba(255,255,255,.82),
  inset 0 -1.8px 2.4px rgba(60,54,46,.4)}
.pc.sel{transform:translate(-50%,-50%) translateY(-7%) scale(1.07);z-index:4;
  box-shadow:
    inset 0 2.6px 0 rgba(255,255,255,.97),
    inset 0 -3.8px 0 rgba(146,113,62,.4),
    inset 0 -7px 10px rgba(138,105,58,.24),
    0 0 0 2.8px rgba(31,111,139,.92),
    0 3px 0 rgba(118,90,48,.45),
    0 6px 9px rgba(47,38,24,.3),
    0 12px 20px rgba(47,38,24,.24),
    0 20px 30px rgba(47,38,24,.14)}
.pc.hintpc{animation:hintPulse 1.1s ease-in-out infinite}
@keyframes hintPulse{
  0%,100%{box-shadow:
    inset 0 2.6px 0 rgba(255,255,255,.97),
    inset 0 -3.8px 0 rgba(146,113,62,.42),
    0 2.2px 0 rgba(118,90,48,.55),
    0 3.4px 0 rgba(96,72,38,.35),
    0 5.5px 7px rgba(47,38,24,.28),
    0 10px 18px rgba(47,38,24,.18)}
  50%{box-shadow:
    inset 0 2.6px 0 rgba(255,255,255,.97),
    inset 0 -3.8px 0 rgba(146,113,62,.42),
    0 0 15px 5px rgba(46,125,91,.82),
    0 2.2px 0 rgba(118,90,48,.55),
    0 3.4px 0 rgba(96,72,38,.35),
    0 5.5px 7px rgba(47,38,24,.28)}}
.pc.dying{pointer-events:none;opacity:0;z-index:1;
  transform:translate(-50%,-50%) scale(.42) rotate(28deg)}
.ring{position:absolute;z-index:1;width:11.8%;aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  border:2px dashed rgba(31,111,139,.6);
  animation:lastSpin 7s linear infinite}
@keyframes lastSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="seg" id="modeSeg" role="tablist" aria-label="对局模式"></div>
  <div class="seg" id="lvSeg" role="tablist" aria-label="AI 难度"></div>
  <div class="bar">
    <div class="turn"><span class="dot r" id="turnDot"></span><span id="turnTx">红方走棋</span></div>
    <div class="thinking" id="thinking"><span>思考中</span></div>
    <button class="snd" id="sndBtn" role="switch" aria-label="音效开关" aria-checked="true"><span class="sndTx">音效</span><span class="sndTr"></span></button>
  </div>
  <div class="tools">
    <button id="btnUndo">悔棋</button>
    <button id="btnHint">提示</button>
    <button id="btnPuzzle">残局</button>
    <button id="btnHandicap">让子</button>
    <button id="btnSide">执黑</button>
    <button id="btnNew">重开</button>
  
    <button class="thm" id="thmBtn" type="button" aria-label="切换深色模式" title="切换深色模式">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.3M12 19.1v2.3M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.6 12h2.3M19.1 12h2.3M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/></svg>
    </button>
  </div>
  <div class="board-box" id="boardBox">
    <canvas id="cv" aria-label="中国象棋棋盘"></canvas>
  </div>
</div>
<div class="mask" id="mask" role="dialog" aria-live="polite"><div id="maskBody"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const SFX=(function(){
  const KEY='mg_sound';
  let ctx=null,master=null,nb=null,on=true;
  try{if(localStorage.getItem(KEY)==='0')on=false;}catch(e){}
  function ensure(){
    if(!on)return null;
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.5;master.connect(ctx.destination);
      const n=Math.floor(ctx.sampleRate*0.5);nb=ctx.createBuffer(1,n,ctx.sampleRate);
      const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state!=='running')ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(o){
    const c=ensure();if(!c)return;
    const t=c.currentTime+(o.delay||0),s=c.createOscillator(),g=c.createGain();
    s.type=o.type||'sine';
    s.frequency.setValueAtTime(o.f,t);
    if(o.f2)s.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.dur||.2));
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.g||.1,t+(o.a||.004));
    g.gain.exponentialRampToValueAtTime(.0008,t+(o.dur||.2));
    s.connect(g);g.connect(master);
    s.start(t);s.stop(t+(o.dur||.2)+.06);
  }
  function noise(o){
    const c=ensure();if(!c)return;
    const t=c.currentTime+(o.delay||0),s=c.createBufferSource();
    s.buffer=nb;s.playbackRate.value=o.rate||1;
    const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||2000;if(o.q)f.Q.value=o.q;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.g||.1,t+(o.a||.003));
    g.gain.exponentialRampToValueAtTime(.0008,t+(o.dur||.1));
    s.connect(f);f.connect(g);g.connect(master);
    s.start(t);s.stop(t+(o.dur||.1)+.05);
  }
  document.addEventListener('pointerdown',ensure,{once:true});
  document.addEventListener('keydown',ensure,{once:true});
  return {
    get on(){return on;},
    set(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0');}catch(e){}if(on)ensure();},
    ensure,tone,noise
  };
})();

const SFXG={
  move(){
    SFX.noise({type:'bandpass',f:1500,q:1.2,dur:.045,g:.11});
    SFX.tone({type:'sine',f:430,f2:390,dur:.13,g:.09});
  },
  cap(){
    SFX.noise({type:'bandpass',f:2600,q:.9,dur:.07,g:.16});
    SFX.tone({type:'triangle',f:300,f2:190,dur:.19,g:.14});
    SFX.tone({type:'sine',f:900,dur:.05,g:.05,delay:.005});
  },
  check(){
    [784,988].forEach((f,i)=>SFX.tone({type:'triangle',f,f2:f*1.01,dur:.26,g:.11,delay:i*.09}));
  },
  err(){SFX.tone({type:'triangle',f:210,f2:160,dur:.15,g:.1});},
  win(ok){
    if(ok)[392,523.25,659.25,783.99].forEach((f,i)=>SFX.tone({type:'triangle',f,dur:.5,g:.1,delay:i*.1}));
    else[440,349.23,293.66].forEach((f,i)=>SFX.tone({type:'triangle',f,dur:.45,g:.085,delay:i*.12}));
  }
};

const RED=8,BLACK=16;
const KING=0,ADVISOR=1,BISHOP=2,KNIGHT=3,ROOK=4,CANNON=5,PAWN=6;
const NAME_RED=['帅','仕','相','马','车','炮','兵'];
const NAME_BLACK=['将','士','象','马','车','炮','卒'];
const FEN_LETTER=['k','a','b','n','r','c','p'];
const START_FEN='rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w';

const IN_BOARD=new Uint8Array(256);
for(let y=3;y<=12;y++)for(let x=3;x<=11;x++)IN_BOARD[(y<<4)+x]=1;

const PALACE=new Uint8Array(256);
for(let y=10;y<=12;y++)for(let x=6;x<=8;x++)PALACE[(y<<4)+x]=RED;
for(let y=3;y<=5;y++)for(let x=6;x<=8;x++)PALACE[(y<<4)+x]=BLACK;

const ADVISOR_OK=new Uint8Array(256);
const BISHOP_OK=new Uint8Array(256);
[[10,6],[10,8],[11,7],[12,6],[12,8]].forEach(p=>{ADVISOR_OK[(p[0]<<4)+p[1]]|=RED;});
[[3,6],[3,8],[4,7],[5,6],[5,8]].forEach(p=>{ADVISOR_OK[(p[0]<<4)+p[1]]|=BLACK;});
[[12,5],[12,9],[10,3],[10,7],[10,11],[8,5],[8,9]].forEach(p=>{BISHOP_OK[(p[0]<<4)+p[1]]|=RED;});
[[3,5],[3,9],[5,3],[5,7],[5,11],[7,5],[7,9]].forEach(p=>{BISHOP_OK[(p[0]<<4)+p[1]]|=BLACK;});

const KING_DELTA=[-16,16,-1,1];
const ADVISOR_DELTA=[-17,-15,15,17];
const BISHOP_DELTA=[-34,-30,30,34];
const BISHOP_EYE=[-17,-15,15,17];
const KNIGHT_DELTA=[-33,-31,31,33,-18,-14,14,18];
const KNIGHT_LEG=[-16,-16,16,16,-1,1,-1,1];
const KNIGHT_ATTACK_FROM=[-33,-31,31,33,-18,-14,14,18];
const KNIGHT_ATTACK_LEG=[-17,-15,15,17,-17,-15,15,17];

const rankOf=sq=>sq>>4;
const fileOf=sq=>sq&15;
const sqOf=(y,x)=>(y<<4)+x;
const colOf=sq=>(sq&15)-3;
const rowOf=sq=>(sq>>4)-3;
const sideOf=p=>p&24;
const typeOf=p=>p&7;
const opponent=s=>s===RED?BLACK:RED;
const ownHalf=(sq,side)=>side===RED?rankOf(sq)>=8:rankOf(sq)<=7;
const mvSrc=mv=>mv&255;
const mvDst=mv=>(mv>>8)&255;
const mkMove=(src,dst)=>src|(dst<<8);

function rand32(){return((Math.random()*0x10000|0)<<16)^(Math.random()*0x10000|0);}
const ZOB_PIECE=[];
for(let i=0;i<24;i++){
  const a=new Int32Array(256);
  for(let j=0;j<256;j++)a[j]=rand32();
  ZOB_PIECE.push(a);
}
const ZOB_SIDE=rand32();

const POS={
  squares:new Uint8Array(256),
  side:RED,
  key:0,
  undoStack:[],
  keyHistory:[],
  idleCount:0
};

function clearBoard(){
  POS.squares.fill(0);
  POS.side=RED;
  POS.key=0;
  POS.undoStack.length=0;
  POS.keyHistory.length=0;
  POS.idleCount=0;
}

function addPiece(sq,p){
  POS.squares[sq]=p;
  POS.key=(POS.key^ZOB_PIECE[p][sq])>>>0;
}

function removePiece(sq){
  const p=POS.squares[sq];
  if(!p)return 0;
  POS.squares[sq]=0;
  POS.key=(POS.key^ZOB_PIECE[p][sq])>>>0;
  return p;
}

function loadFen(fen){
  clearBoard();
  const parts=fen.trim().split(/\s+/);
  const rows=parts[0].split('/');
  for(let r=0;r<rows.length&&r<10;r++){
    let x=3;
    for(const ch of rows[r]){
      if(/\d/.test(ch)){x+=parseInt(ch,10);continue;}
      const low=ch.toLowerCase();
      const t=FEN_LETTER.indexOf(low);
      if(t<0){x++;continue;}
      if(x>=3&&x<=11)addPiece(sqOf(r+3,x),(ch===low?BLACK:RED)|t);
      x++;
    }
  }
  POS.side=(parts[1]==='b')?BLACK:RED;
  if(POS.side===BLACK)POS.key=(POS.key^ZOB_SIDE)>>>0;
  POS.keyHistory.push(POS.key);
}

function exportFen(){
  const rows=[];
  for(let y=3;y<=12;y++){
    let s='',gap=0;
    for(let x=3;x<=11;x++){
      const p=POS.squares[sqOf(y,x)];
      if(!p){gap++;continue;}
      if(gap){s+=gap;gap=0;}
      const ch=FEN_LETTER[typeOf(p)];
      s+=sideOf(p)===RED?ch.toUpperCase():ch;
    }
    if(gap)s+=gap;
    rows.push(s||'9');
  }
  return rows.join('/')+' '+(POS.side===RED?'w':'b');
}

function iccsToSq(s){
  const x=3+(s.charCodeAt(0)-97);
  const y=12-(s.charCodeAt(1)-48);
  return sqOf(y,x);
}

function iccsToMove(s){return mkMove(iccsToSq(s.slice(0,2)),iccsToSq(s.slice(2,4)));}

function kingSquare(side){
  for(let y=side===RED?10:3,end=y+2;y<=end;y++)
    for(let x=6;x<=8;x++){
      const sq=sqOf(y,x),p=POS.squares[sq];
      if(p&&typeOf(p)===KING&&sideOf(p)===side)return sq;
    }
  return -1;
}

function isAttacked(sq,bySide){
  const sq2=POS.squares;
  for(let i=0;i<8;i++){
    const from=sq+KNIGHT_ATTACK_FROM[i];
    if(!IN_BOARD[from])continue;
    const p=sq2[from];
    if(p&&sideOf(p)===bySide&&typeOf(p)===KNIGHT&&!sq2[sq+KNIGHT_ATTACK_LEG[i]])return true;
  }
  for(let i=0;i<4;i++){
    const d=KING_DELTA[i];
    let cur=sq+d;
    while(IN_BOARD[cur]&&!sq2[cur])cur+=d;
    if(IN_BOARD[cur]){
      const p=sq2[cur];
      if(sideOf(p)===bySide){
        const t=typeOf(p);
        if(t===ROOK)return true;
        if(t===KING&&(cur===sq+d||d===-16||d===16))return true;
      }
      cur+=d;
      while(IN_BOARD[cur]&&!sq2[cur])cur+=d;
      if(IN_BOARD[cur]){
        const q=sq2[cur];
        if(sideOf(q)===bySide&&typeOf(q)===CANNON)return true;
      }
    }
  }
  const pawnDir=bySide===RED?16:-16;
  const pf=sq+pawnDir;
  if(IN_BOARD[pf]){
    const p=sq2[pf];
    if(p&&sideOf(p)===bySide&&typeOf(p)===PAWN)return true;
  }
  for(const d of[-1,1]){
    const f=sq+d;
    if(!IN_BOARD[f])continue;
    const p=sq2[f];
    if(p&&sideOf(p)===bySide&&typeOf(p)===PAWN&&!ownHalf(f,bySide))return true;
  }
  return false;
}

function inCheck(side){
  const k=kingSquare(side);
  if(k<0)return false;
  return isAttacked(k,opponent(side));
}

function genPseudoMoves(side,capturesOnly){
  const out=[],sq2=POS.squares;
  for(let y=3;y<=12;y++)for(let x=3;x<=11;x++){
    const src=sqOf(y,x),p=sq2[src];
    if(!p||sideOf(p)!==side)continue;
    const t=typeOf(p);
    if(t===KING){
      for(const d of KING_DELTA){
        const dst=src+d;
        if(PALACE[dst]!==side)continue;
        const q=sq2[dst];
        if(q&&sideOf(q)===side)continue;
        if(capturesOnly&&!q)continue;
        out.push(mkMove(src,dst));
      }
    }else if(t===ADVISOR){
      for(const d of ADVISOR_DELTA){
        const dst=src+d;
        if(!(ADVISOR_OK[dst]&side))continue;
        const q=sq2[dst];
        if(q&&sideOf(q)===side)continue;
        if(capturesOnly&&!q)continue;
        out.push(mkMove(src,dst));
      }
    }else if(t===BISHOP){
      for(let i=0;i<4;i++){
        const dst=src+BISHOP_DELTA[i];
        if(!(BISHOP_OK[dst]&side))continue;
        if(sq2[src+BISHOP_EYE[i]])continue;
        const q=sq2[dst];
        if(q&&sideOf(q)===side)continue;
        if(capturesOnly&&!q)continue;
        out.push(mkMove(src,dst));
      }
    }else if(t===KNIGHT){
      for(let i=0;i<8;i++){
        const dst=src+KNIGHT_DELTA[i];
        if(!IN_BOARD[dst])continue;
        if(sq2[src+KNIGHT_LEG[i]])continue;
        const q=sq2[dst];
        if(q&&sideOf(q)===side)continue;
        if(capturesOnly&&!q)continue;
        out.push(mkMove(src,dst));
      }
    }else if(t===ROOK){
      for(const d of KING_DELTA){
        let dst=src+d;
        while(IN_BOARD[dst]&&!sq2[dst]){
          if(!capturesOnly)out.push(mkMove(src,dst));
          dst+=d;
        }
        if(IN_BOARD[dst]&&sideOf(sq2[dst])!==side)out.push(mkMove(src,dst));
      }
    }else if(t===CANNON){
      for(const d of KING_DELTA){
        let dst=src+d;
        while(IN_BOARD[dst]&&!sq2[dst]){
          if(!capturesOnly)out.push(mkMove(src,dst));
          dst+=d;
        }
        if(!IN_BOARD[dst])continue;
        dst+=d;
        while(IN_BOARD[dst]&&!sq2[dst])dst+=d;
        if(IN_BOARD[dst]&&sideOf(sq2[dst])!==side)out.push(mkMove(src,dst));
      }
    }else{
      const fwd=side===RED?-16:16;
      const cand=[src+fwd];
      if(!ownHalf(src,side)){cand.push(src-1);cand.push(src+1);}
      for(const dst of cand){
        if(!IN_BOARD[dst])continue;
        const q=sq2[dst];
        if(q&&sideOf(q)===side)continue;
        if(capturesOnly&&!q)continue;
        out.push(mkMove(src,dst));
      }
    }
  }
  return out;
}

function makeMove(mv){
  const src=mvSrc(mv),dst=mvDst(mv);
  const captured=POS.squares[dst];
  const moved=POS.squares[src];
  if(captured)removePiece(dst);
  removePiece(src);
  addPiece(dst,moved);
  POS.side=opponent(POS.side);
  POS.key=(POS.key^ZOB_SIDE)>>>0;
  POS.undoStack.push({mv:mv,captured:captured,idle:POS.idleCount,mover:sideOf(moved),gaveCheck:false});
  POS.idleCount=captured?0:POS.idleCount+1;
  POS.keyHistory.push(POS.key);
  return captured;
}

function unmakeMove(){
  const rec=POS.undoStack.pop();
  if(!rec)return null;
  POS.keyHistory.pop();
  const src=mvSrc(rec.mv),dst=mvDst(rec.mv);
  const moved=removePiece(dst);
  addPiece(src,moved);
  if(rec.captured)addPiece(dst,rec.captured);
  POS.side=opponent(POS.side);
  POS.key=(POS.key^ZOB_SIDE)>>>0;
  POS.idleCount=rec.idle;
  return rec;
}

function tryMove(mv){
  const side=POS.side;
  makeMove(mv);
  if(inCheck(side)){unmakeMove();return false;}
  return true;
}

function genLegalMoves(side){
  const res=[];
  for(const mv of genPseudoMoves(side===undefined?POS.side:side,false)){
    const s=POS.side;
    makeMove(mv);
    if(!inCheck(s))res.push(mv);
    unmakeMove();
  }
  return res;
}

function hasLegalMove(side){
  for(const mv of genPseudoMoves(side,false)){
    makeMove(mv);
    const bad=inCheck(side);
    unmakeMove();
    if(!bad)return true;
  }
  return false;
}

function repetitionCount(){
  const key=POS.key;
  let n=0;
  for(let i=POS.keyHistory.length-2;i>=0;i--)if(POS.keyHistory[i]===key)n++;
  return n;
}

function checkStreakFor(side){
  const st=POS.undoStack;
  let i=st.length-1,n=0;
  if(i>=0&&st[i].mover!==side)i--;
  for(;i>=0;i-=2){
    if(st[i].mover!==side||!st[i].gaveCheck)break;
    n++;
  }
  return n;
}

function perpetualChecker(){
  const h=POS.keyHistory,key=h[h.length-1];
  let seen=0,first=-1;
  for(let i=h.length-2;i>=0;i--)if(h[i]===key&&++seen===2){first=i;break;}
  if(first<0)return 0;
  const need=(h.length-1-first)/2;
  const mover=opponent(POS.side);
  const a=checkStreakFor(mover)>=need,b=checkStreakFor(POS.side)>=need;
  if(a&&!b)return mover;
  if(b&&!a)return POS.side;
  return 0;
}

const MATE_SCORE=90000;
const KNIGHT_ENDGAME_BONUS=50;
const CANNON_ENDGAME_PENALTY=50;
const ENDGAME_PIECE_LIMIT=12;

const PHASE={endgame:false,redKnight:0,redCannon:0,blackKnight:0,blackCannon:0,total:0};

function scanPhase(){
  let n=0,kr=0,cr=0,kb=0,cb=0;
  for(let y=3;y<=12;y++)for(let x=3;x<=11;x++){
    const p=POS.squares[sqOf(y,x)];
    if(!p)continue;
    const t=typeOf(p);
    if(t===KING)continue;
    n++;
    if(t===KNIGHT){if(sideOf(p)===RED)kr++;else kb++;}
    else if(t===CANNON){if(sideOf(p)===RED)cr++;else cb++;}
  }
  PHASE.total=n;
  PHASE.endgame=n<=ENDGAME_PIECE_LIMIT;
  PHASE.redKnight=kr;PHASE.redCannon=cr;
  PHASE.blackKnight=kb;PHASE.blackCannon=cb;
}

function evaluate(){
  let red=0,blk=0;
  for(let y=3;y<=12;y++)for(let x=3;x<=11;x++){
    const sq=sqOf(y,x),p=POS.squares[sq];
    if(!p)continue;
    const t=typeOf(p),isRed=sideOf(p)===RED;
    let v=PIECE_VALUE[t]+(USE_POSITION?POS_SCORE[t][isRed?0:1][sq]:0);
    if(t===KNIGHT)v+=PHASE.endgame?KNIGHT_ENDGAME_BONUS:0;
    else if(t===CANNON)v-=PHASE.endgame?CANNON_ENDGAME_PENALTY:0;
    if(isRed)red+=v;else blk+=v;
  }
  const diff=red-blk;
  return POS.side===RED?diff:-diff;
}

function evaluateForRed(){return POS.side===RED?evaluate():-evaluate();}

const MATE_INF=1000000;
const TT_MAX=600000;
const TT=new Map();
const HISTORY=new Int32Array(24*256);
const KILLER=[];
for(let i=0;i<64;i++)KILLER.push([0,0]);
let NODES=0,TIMEUP=false,USE_POSITION=true;

function isRepetition(){
  const h=POS.keyHistory,n=h.length,key=h[n-1];
  const lo=Math.max(0,n-2-32);
  for(let i=n-2;i>=lo;i--)if(h[i]===key)return true;
  return false;
}

function drawByRule(){
  if(POS.idleCount>=120)return true;
  return isRepetition();
}

function quiesce(alpha,beta,ply,deadline){
  NODES++;
  if((NODES&2047)===0&&Date.now()>deadline){TIMEUP=true;return alpha;}
  const stand=evaluate();
  if(stand>=beta)return stand;
  if(stand>alpha)alpha=stand;
  if(ply>=40)return alpha;
  const caps=genPseudoMoves(POS.side,true);
  caps.sort((a,b)=>captureScore(b)-captureScore(a));
  for(const mv of caps){
    const side=POS.side;
    makeMove(mv);
    if(inCheck(side)){unmakeMove();continue;}
    const sc=-quiesce(-beta,-alpha,ply+1,deadline);
    unmakeMove();
    if(TIMEUP)return alpha;
    if(sc>=beta)return sc;
    if(sc>alpha)alpha=sc;
  }
  return alpha;
}

function captureScore(mv){
  const victim=POS.squares[mvDst(mv)];
  const attacker=POS.squares[mvSrc(mv)];
  if(!victim)return 0;
  return PIECE_VALUE[typeOf(victim)]*16-PIECE_VALUE[typeOf(attacker)];
}

function orderedMoves(ply,ttMove){
  const list=genPseudoMoves(POS.side,false);
  const killers=KILLER[ply&63];
  const scored=list.map(mv=>{
    let s=0;
    const victim=POS.squares[mvDst(mv)];
    if(victim)s=1000000+captureScore(mv);
    else if(mv===ttMove)s=900000;
    else if(mv===killers[0]||mv===killers[1])s=800000;
    else{
      const p=POS.squares[mvSrc(mv)];
      s=HISTORY[p*256+mvDst(mv)];
    }
    return {mv:mv,s:s};
  });
  scored.sort((a,b)=>b.s-a.s);
  return scored;
}

function negamax(depth,alpha,beta,ply,deadline,allowNull){
  NODES++;

  if(ply>=60)return evaluate();

  if(depth<=0)return quiesce(alpha,beta,ply,deadline);
  const inChk=inCheck(POS.side);
  if(inChk)depth++;

  let ttMove=0;
  if(hit){
    ttMove=hit.move;
    if(hit.depth>=depth&&ply>0){
      if(hit.flag===0)return hit.score;
      if(hit.flag===1&&hit.score>=beta)return hit.score;
      if(hit.flag===2&&hit.score<=alpha)return hit.score;
    }
  }
  const moves=orderedMoves(ply,ttMove);
  let best=-MATE_INF,bestMove=0,legal=0,flag=2;
  for(const item of moves){
    const mv=item.mv,side=POS.side,victim=POS.squares[mvDst(mv)];
    makeMove(mv);
    if(inCheck(side)){unmakeMove();continue;}
    legal++;
    let sc;
    if(legal===1)sc=-negamax(depth-1,-beta,-alpha,ply+1,deadline,true);
    else{
      sc=-negamax(depth-1,-alpha-1,-alpha,ply+1,deadline,true);
      if(!TIMEUP&&sc>alpha&&sc<beta)sc=-negamax(depth-1,-beta,-alpha,ply+1,deadline,true);
    }
    unmakeMove();
    if(TIMEUP)return 0;
    if(sc>best){
      best=sc;bestMove=mv;
      if(sc>alpha){
        alpha=sc;flag=0;
        if(alpha>=beta){
          flag=1;
          if(!victim){
            const killers=KILLER[ply&63];
            if(killers[0]!==mv){killers[1]=killers[0];killers[0]=mv;}
            const p=POS.squares[mvSrc(mv)];
            HISTORY[p*256+mvDst(mv)]+=depth*depth;
          }
          break;
        }
      }
    }
  }
  if(legal===0)return -MATE_INF+ply;
  if(TT.size<TT_MAX&&!TIMEUP)TT.set(key,{depth:depth,score:best,flag:flag,move:bestMove});
  return best;
}

function searchRootOnce(depth,deadline,level,moves,prevBest){
  let alpha=-MATE_INF,localBest=0,localScore=-MATE_INF;
  const ordered=moves.slice();
  if(prevBest){
    const i=ordered.indexOf(prevBest);
    if(i>0){ordered.splice(i,1);ordered.unshift(prevBest);}
  }
  const rootScores=[];
  let first=true;
  for(const mv of ordered){
    const side=POS.side;
    makeMove(mv);
    if(inCheck(side)){unmakeMove();continue;}
    let sc;
    if(first)sc=-negamax(depth-1,-MATE_INF,-alpha,1,deadline,true);
    else{
      sc=-negamax(depth-1,-alpha-1,-alpha,1,deadline,true);
      if(!TIMEUP&&sc>alpha)sc=-negamax(depth-1,-MATE_INF,-alpha,1,deadline,true);
    }
    unmakeMove();
    if(TIMEUP)break;
    first=false;
    rootScores.push({mv:mv,sc:sc});
    if(sc>localScore){localScore=sc;localBest=mv;}
    if(sc>alpha)alpha=sc;
  }
  return {move:localBest,score:localScore,scores:rootScores,timeout:TIMEUP};
}

function pickSoftMove(rootScores,bestScore,bestMove){
  if(!rootScores||rootScores.length<2)return bestMove;
  const pool=rootScores.filter(x=>x.sc>=bestScore-90);
  if(!pool.length)return bestMove;
  return pool[(Math.random()*pool.length)|0].mv;
}

function searchBestMove(maxDepth,timeBudget,level){
  TIMEUP=false;NODES=0;
  const deadline=Date.now()+timeBudget;
  const moves=genLegalMoves(POS.side);
  if(!moves.length)return {move:-1,score:-MATE_INF,depth:0,empty:true};
  if(moves.length===1)return {move:moves[0],score:0,depth:0,empty:false};
  let best=moves[0],bestScore=-MATE_INF,reachedDepth=0,scores=null;
  for(let d=2;d<=maxDepth;d+=2){
    const r=searchRootOnce(d,deadline,level,moves,reachedDepth?best:0);
    if(TIMEUP&&!r.move)break;
    if(r.move){best=r.move;bestScore=r.score;reachedDepth=d;scores=r.scores;}
    if(TIMEUP)break;
    if(bestScore>MATE_INF-1000)break;
    if(Date.now()>deadline)break;
  }
  if(level===1)best=pickSoftMove(scores,bestScore,best);
  return {move:best,score:bestScore,depth:reachedDepth,empty:false};
}

let SEARCH_GEN=0;

function searchAsync(maxDepth,timeBudget,level,onDone){
  const gen=SEARCH_GEN;
  TIMEUP=false;NODES=0;
  const deadline=Date.now()+timeBudget;
  const moves=genLegalMoves(POS.side);
  if(!moves.length){onDone({move:-1,score:-MATE_INF,depth:0,empty:true});return;}
  if(moves.length===1){onDone({move:moves[0],score:0,depth:0,empty:false});return;}
  let best=moves[0],bestScore=-MATE_INF,reachedDepth=0,scores=null,depth=2;
  const step=()=>{
    if(gen!==SEARCH_GEN)return;
    TIMEUP=false;
    const r=searchRootOnce(depth,deadline,level,moves,reachedDepth?best:0);
    if(r.move){best=r.move;bestScore=r.score;reachedDepth=depth;scores=r.scores;}
    const stop=TIMEUP||bestScore>MATE_INF-1000||Date.now()>deadline||depth>=maxDepth;
    if(stop){
      if(level===1)best=pickSoftMove(scores,bestScore,best);
      onDone({move:best,score:bestScore,depth:reachedDepth,empty:false});
      return;
    }
    depth+=2;
    setTimeout(step,0);
  };
  setTimeout(step,0);
}

const CN_NUM_RED=['一','二','三','四','五','六','七','八','九'];
const CN_NUM_BLK=['1','2','3','4','5','6','7','8','9'];

function fileLabel(sq,side){
  const x=fileOf(sq);
  if(side===RED)return CN_NUM_RED[11-x];
  return CN_NUM_BLK[x-3];
}

function sameFilePieces(sq,side){
  const t=typeOf(POS.squares[sq]);
  const x=fileOf(sq);
  const list=[];
  for(let y=3;y<=12;y++){
    const s=sqOf(y,x),p=POS.squares[s];
    if(p&&sideOf(p)===side&&typeOf(p)===t)list.push(s);
  }
  return list;
}

function moveToChinese(mv){
  const src=mvSrc(mv),dst=mvDst(mv);
  const p=POS.squares[src];
  const side=sideOf(p),t=typeOf(p);
  const name=side===RED?NAME_RED[t]:NAME_BLACK[t];
  const num=side===RED?CN_NUM_RED:CN_NUM_BLK;
  const same=sameFilePieces(src,side);
  let prefix='';
  if(same.length>1){
    same.sort((a,b)=>side===RED?a-b:b-a);
    const i=same.indexOf(src);
    if(same.length===2)prefix=i===0?'前':'后';
    else if(same.length===3)prefix=['前','中','后'][i];
    else prefix=num[same.length-i-1];
  }
  const dy=rankOf(dst)-rankOf(src);
  const dx=fileOf(dst)-fileOf(src);
  const forward=side===RED?dy<0:dy>0;
  const head=prefix+name+fileLabel(src,side);
  if(dx===0){
    const step=Math.abs(dy);
    return head+(forward?'进':'退')+num[step-1];
  }
  if(dy===0)return head+'平'+fileLabel(dst,side);
  const act=forward?'进':'退';
  if(t===KNIGHT||t===BISHOP||t===ADVISOR)return head+act+fileLabel(dst,side);
  return head+act+num[Math.abs(dy)-1];
}

function moveToIccs(mv){
  const src=mvSrc(mv),dst=mvDst(mv);
  const f=s=>String.fromCharCode(97+fileOf(s)-3)+String(12-rankOf(s));
  return f(src)+f(dst);
}


const CELL=58.4;
const PAD_X=58.4;
const PAD_Y=57.2;
const BOARD_W=584;
const BOARD_H=640;

const cv=document.getElementById('cv');
const ctx=(function(){try{return cv.getContext('2d');}catch(e){return null;}})();

const colX=i=>PAD_X+i*CELL;
const rowY=j=>PAD_Y+j*CELL;

function layoutSquare(sq){
  let x=fileOf(sq)-3,y=rankOf(sq)-3;
  if(VIEW.flip){x=8-x;y=9-y;}
  return {x:colX(x),y:rowY(y)};
}

function piecePercent(sq){
  const p=layoutSquare(sq);
  return {left:p.x/BOARD_W*100,top:p.y/BOARD_H*100};
}

function drawBoard(){
  /* 主题取样：深色下棋盘压暗，线色需反向提亮，否则深棕线在深木底上不可见 */
  const DK=document.documentElement.getAttribute('data-theme')==='dark';
  const CL={
    hi:      DK?'rgba(0,0,0,.42)':'rgba(255,247,226,.5)',
    line:    DK?'rgba(228,208,172,.5)':'rgba(88,66,36,.82)',
    hi2:     DK?'rgba(0,0,0,.36)':'rgba(255,247,226,.4)',
    border:  DK?'rgba(232,214,178,.62)':'rgba(84,62,32,.9)',
    border2: DK?'rgba(232,214,178,.4)':'rgba(84,62,32,.55)',
    starHi:  DK?'rgba(0,0,0,.34)':'rgba(255,247,226,.42)',
    star:    DK?'rgba(230,210,174,.6)':'rgba(92,70,38,.78)',
    labelHi: DK?'rgba(0,0,0,.3)':'rgba(255,247,226,.46)',
    label:   DK?'rgba(230,210,174,.52)':'rgba(96,72,38,.56)'
  };

  if(!ctx)return;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(BOARD_W*dpr);
  cv.height=Math.round(BOARD_H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,BOARD_W,BOARD_H);

  const L=colX(0),R=colX(8),T=rowY(0),B=rowY(9);
  const RT=rowY(4),RB=rowY(5);

  const gridPath=()=>{
    ctx.beginPath();
    for(let j=0;j<10;j++){ctx.moveTo(L,rowY(j));ctx.lineTo(R,rowY(j));}
    for(let i=0;i<9;i++){
      if(i===0||i===8){ctx.moveTo(colX(i),T);ctx.lineTo(colX(i),B);}
      else{
        ctx.moveTo(colX(i),T);ctx.lineTo(colX(i),RT);
        ctx.moveTo(colX(i),RB);ctx.lineTo(colX(i),B);
      }
    }
    ctx.moveTo(colX(3),T);ctx.lineTo(colX(5),rowY(2));
    ctx.moveTo(colX(5),T);ctx.lineTo(colX(3),rowY(2));
    ctx.moveTo(colX(3),rowY(7));ctx.lineTo(colX(5),B);
    ctx.moveTo(colX(5),rowY(7));ctx.lineTo(colX(3),B);
  };

  ctx.lineCap='round';
  ctx.strokeStyle=CL.hi;
  ctx.lineWidth=2.2;
  ctx.translate(0,.9);
  gridPath();ctx.stroke();
  ctx.translate(0,-.9);

  ctx.strokeStyle=CL.line;
  ctx.lineWidth=1.15;
  gridPath();ctx.stroke();

  ctx.strokeStyle=CL.hi2;
  ctx.lineWidth=2.6;
  ctx.strokeRect(L-.9,T-.1,R-L,B-T);
  ctx.strokeStyle=CL.border;
  ctx.lineWidth=2.6;
  ctx.strokeRect(L,T,R-L,B-T);
  ctx.strokeStyle=CL.border2;
  ctx.lineWidth=1.1;
  const g=7.5;
  ctx.strokeRect(L-g,T-g,R-L+g*2,B-T+g*2);

  const arm=CELL*0.25,off=CELL*0.135;
  const corner=(cx,cy,sx,sy)=>{
    ctx.beginPath();
    ctx.moveTo(cx+sx*off,cy+sy*(off+arm));
    ctx.lineTo(cx+sx*off,cy+sy*off);
    ctx.lineTo(cx+sx*(off+arm),cy+sy*off);
    ctx.stroke();
  };
  const star=(i,j,style,w,dy)=>{
    ctx.strokeStyle=style;ctx.lineWidth=w;
    const cx=colX(i),cy=rowY(j)+dy;
    if(i>0){corner(cx,cy,-1,-1);corner(cx,cy,-1,1);}
    if(i<8){corner(cx,cy,1,-1);corner(cx,cy,1,1);}
  };
  const marks=[[1,2],[7,2],[1,7],[7,7]];
  for(const i of [0,2,4,6,8]){marks.push([i,3]);marks.push([i,6]);}
  for(const [i,j] of marks)star(i,j,CL.starHi,1.8,.9);
  for(const [i,j] of marks)star(i,j,CL.star,1.2,0);

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='600 27px "Kaiti SC","STKaiti",KaiTi,"Songti SC",Georgia,serif';
  const midY=(RT+RB)/2;
  const label=(txt,i,rot)=>{
    ctx.save();
    ctx.translate(colX(i),midY);
    if(rot)ctx.rotate(Math.PI);
    ctx.fillStyle=CL.labelHi;
    ctx.fillText(txt,0,1.2);
    ctx.fillStyle=CL.label;
    ctx.fillText(txt,0,0);
    ctx.restore();
  };
  label('楚 河',1.75,false);
  label('汉 界',6.25,true);
}

function legalTargetsOf(sq){
  const set=new Set();
  const side=POS.side;
  for(const mv of genPseudoMoves(side,false)){
    if(mvSrc(mv)!==sq)continue;
    makeMove(mv);
    const bad=inCheck(side);
    unmakeMove();
    if(!bad)set.add(mvDst(mv));
  }
  return set;
}

function squareAt(cx,cy,r){
  const sx=(cx-r.left)/r.width*BOARD_W;
  const sy=(cy-r.top)/r.height*BOARD_H;
  let i=Math.round((sx-PAD_X)/CELL),j=Math.round((sy-PAD_Y)/CELL);
  if(i<0||i>8||j<0||j>9)return -1;
  if(Math.hypot(sx-(PAD_X+i*CELL),sy-(PAD_Y+j*CELL))>CELL*0.52)return -1;
  if(VIEW.flip){i=8-i;j=9-j;}
  return sqOf(j+3,i+3);
}

function jitter(sq){
  const el=PCS.get(sq);
  if(!el)return;
  el.style.transform='translate(-50%,-50%) scale(.92)';
  setTimeout(()=>{el.style.transform='';},140);
}

function onSquare(sq){
  const p=POS.squares[sq];
  if(S.sel>0&&PCS.has(S.sel)){
    if(p&&sideOf(p)===POS.side){
      S.sel=sq;
      S.targets=legalTargetsOf(sq);
      renderTargets();
      markSelected();
      SFX.ensure();
      return;
    }
    if(S.targets&&S.targets.has(sq)){
      const src=S.sel;
      S.sel=-1;
      S.targets=new Set();
      markSelected();
      clearHintMark();
      const mv=mkMove(src,sq);
      doMove(mv);
      afterHumanMove();
      return;
    }
    jitter(sq);
    SFXG.err();
    S.sel=-1;
    S.targets=new Set();
    markSelected();
    renderTargets();
    return;
  }
  if(p&&sideOf(p)===POS.side){
    S.sel=sq;
    S.targets=legalTargetsOf(sq);
    markSelected();
    renderTargets();
    SFX.ensure();
  }
}

function doMove(mv){
  const side=POS.side;
  const cn=moveToChinese(mv);
  const iccs=moveToIccs(mv);
  const captured=POS.squares[mvDst(mv)];
  makeMove(mv);
  applyMoveToPieces(mv,captured);
  const rec=POS.undoStack[POS.undoStack.length-1];
  rec.cn=cn;rec.iccs=iccs;
  rec.gaveCheck=inCheck(POS.side);
  scanPhase();
  S.hist.push({iccs:iccs,cn:cn,side:side,mv:mv});
  S.last=mv;
  clearHintMark();
  render();
  if(rec.gaveCheck)SFXG.check();
  else if(captured)SFXG.cap();
  else SFXG.move();
  return checkEnd();
}

function checkEnd(){
  if(S.done)return true;
  const side=POS.side;
  if(!hasLegalMove(side)){
    finish(opponent(side),inCheck(side)?'将死':'困毙');
    return true;
  }
  if(repetitionCount()>=2){
    const loser=perpetualChecker();
    if(loser)finish(opponent(loser),'长将判负');
    else finish(0,'三次重复局面');
    return true;
  }
  if(POS.idleCount>=120){finish(0,'60 回合无吃子');return true;}
  return false;
}

function finish(winner,reason){
  S.done=true;
  S.sel=-1;
  clearHintMark();
  markSelected();
  updateTurn();
  const human=S.mode==='pve'?S.humanSide:0;
  let title,cls,desc='';
  if(winner===0){title='和棋';cls='';desc=reason;}
  else{
    const who=(winner===RED?'红方':'黑方')+'胜';
    title=who;
    cls=(S.mode==='pve')?(winner===human?'win':'lose'):'';
    desc=reason;
  }
  SFXG.win(S.mode!=='pve'||winner===0||winner===S.humanSide);
  if(cls==='win')confetti(70);
  showMask('<h2 class="'+cls+'">'+title+'</h2><p>'+desc+'</p>'+
    '<button class="mbtn" id="againBtn">再来一局</button>');
  document.getElementById('againBtn').onclick=()=>{hideMask();newGame();};
  save();
}

function confetti(n){
  const box=document.createElement('div');
  box.className='confetti';
  const colors=['#b03a2e','#e3c88f','#2e7d5b','#1f6f8b','#c8564a','#8f7040'];
  for(let i=0;i<n;i++){
    const s=document.createElement('i');
    s.style.left=Math.random()*100+'%';
    s.style.width=(4+Math.random()*5)+'px';
    s.style.height=(6+Math.random()*7)+'px';
    s.style.background=colors[(Math.random()*colors.length)|0];
    s.style.animationDuration=(1.7+Math.random()*1.5)+'s';
    s.style.animationDelay=(Math.random()*.5)+'s';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),4200);
}

function humanEval(){
  const keep=USE_POSITION;
  USE_POSITION=true;
  scanPhase();
  const red=evaluateForRed();
  USE_POSITION=keep;
  return S.humanSide===RED?red:-red;
}

function cancelAI(){
  SEARCH_GEN++;
  clearTimeout(S.aiTimer);
  S.busy=false;
  thinkingEl.classList.remove('show');
}

function scheduleAI(delay){
  if(S.done||S.mode!=='pve'||POS.side===S.humanSide)return;
  clearTimeout(S.aiTimer);
  S.busy=true;
  thinkingEl.classList.add('show');
  updateTurn();
  const gen=SEARCH_GEN;
  S.aiTimer=setTimeout(()=>{if(gen===SEARCH_GEN)runAI(gen);},delay);
}

function runAI(gen){
  if(S.done||S.mode!=='pve'||POS.side===S.humanSide){cancelAI();return;}
  const side=POS.side;
  S.sel=-1;
  S.targets=new Set();
  renderTargets();
  markSelected();
  const finishTurn=mv=>{
    if(gen!==SEARCH_GEN)return;
    thinkingEl.classList.remove('show');
    S.busy=false;
    if(POS.side!==side||S.done)return;
    if(mv<0||!POS.squares[mvSrc(mv)]||sideOf(POS.squares[mvSrc(mv)])!==side){
      const ms=genLegalMoves(side);
      if(!ms.length){checkEnd();return;}
      mv=ms[0];
    }
    doMove(mv);
    if(S.done)return;
    const now=humanEval();
    if(S.evalBase!==null&&now-S.evalBase<=-150)toast('提示：上一手损失较大');
    S.evalBase=now;
    save();
  };
  const bookMove=(!S.puzzle&&S.hist.length<10&&BOOK.has(POS.key))?iccsToMove(BOOK.get(POS.key).iccs):0;
  if(bookMove&&genLegalMoves(side).indexOf(bookMove)>=0){
    setTimeout(()=>finishTurn(bookMove),220);
    return;
  }
  USE_POSITION=S.level>1;
  scanPhase();
  const lv=LEVELS.find(x=>x.id===S.level)||LEVELS[0];
  setTimeout(()=>{
    if(gen!==SEARCH_GEN)return;
    searchAsync(lv.depth,lv.budget,S.level,res=>finishTurn(res.move));
  },30);
}

function afterHumanMove(){
  if(S.done)return;
  scheduleAI(150);
  save();
}

function hint(){
  if(S.done||S.busy)return;
  if(S.mode==='pve'&&POS.side!==S.humanSide){toast('请等待对方走棋');return;}
  S.busy=true;
  thinkingEl.classList.add('show');
  USE_POSITION=true;
  scanPhase();
  const lv=LEVELS.find(x=>x.id===Math.max(2,S.level))||LEVELS[1];
  const gen=SEARCH_GEN;
  setTimeout(()=>{
    if(gen!==SEARCH_GEN)return;
    searchAsync(lv.depth,Math.min(lv.budget,1200),3,res=>{
      if(gen!==SEARCH_GEN)return;
      thinkingEl.classList.remove('show');
      S.busy=false;
      if(res.move<0){toast('无合适着法');return;}
      const src=mvSrc(res.move);
      S.sel=src;
      S.targets=legalTargetsOf(src);
      markSelected();
      renderTargets();
      const el=PCS.get(src);
      if(el)el.classList.add('hintpc');
      toast('建议：'+moveToChinese(res.move));
    });
  },30);
}

function undo(){
  if(S.busy){toast('请等待对方走棋');return;}
  if(!S.hist.length){toast('已是开局');return;}
  if(S.done){S.done=false;hideMask();}
  const popOne=()=>{unmakeMove();S.hist.pop();};
  popOne();
  if(S.mode==='pve'){
    while(S.hist.length&&POS.side!==S.humanSide)popOne();
  }
  if(POS.keyHistory.length===0)POS.keyHistory.push(POS.key);
  scanPhase();
  S.last=S.hist.length?S.hist[S.hist.length-1].mv:0;
  S.sel=-1;
  S.targets=new Set();
  clearHintMark();
  rebuildPieces();
  render();
  save();
  S.evalBase=humanEval();
  scheduleAI(160);
}

function setMode(id){
  if(id===S.mode)return;
  if(!confirmDiscard('切换对战模式将结束当前对局，确定继续？'))
    {refreshSegs();return;}
  S.mode=id;
  S.puzzle='';
  S.startFen=S.handicap==='none'?START_FEN:S.startFen;
  if(id==='pvp')S.humanSide=RED;
  VIEW.flip=false;
  refreshSegs();
  newGame();
}

function setLevel(id){
  if(id===S.level)return;
  // 人机模式下切难度会重开；双人模式只是存设置，无需确认
  if(S.mode==='pve'&&!confirmDiscard('切换难度将结束当前对局，确定继续？'))
    {refreshSegs();return;}
  S.level=id;
  refreshSegs();
  if(S.mode==='pve')newGame();
  else save();
}

/* 返回是否真的切换了：调用方只在成功时关弹窗 + 提示，
   取消或点到当前项都保持弹窗打开，不再假装已生效 */
function setHandicap(id){
  if(id===S.handicap)return false;
  if(!confirmDiscard('切换让子将结束当前对局，确定继续？'))return false;
  S.handicap=id;
  S.puzzle='';
  applyHandicap(id);
  S.startFen=exportFen();
  newGame();          // 内部已 hideMask()
  syncToolState();
  return true;
}

function openHandicap(){
  let html='<h2>让子设置</h2><div class="opts">';
  HANDICAPS.forEach(h=>{
    html+='<button data-id="'+h.id+'"><strong>'+h.name+'</strong><em>'+h.desc+'</em></button>';
  });
  html+='</div><button class="mbtn ghost" id="maskCancel">取消</button>';
  showMask(html);
  maskBody.querySelectorAll('.opts button').forEach(b=>{
    b.onclick=()=>{
      if(setHandicap(b.dataset.id))toast(b.querySelector('strong').textContent);
    };
  });
  document.getElementById('maskCancel').onclick=hideMask;
}

function openPuzzles(){
  let html='<h2>残局闯关</h2><div class="opts">';
  PUZZLES.forEach((p,i)=>{
    html+='<button data-i="'+i+'"><strong>'+p.name+'</strong><em>'+p.goal+'</em></button>';
  });
  html+='</div><button class="mbtn ghost" id="maskCancel">取消</button>';
  showMask(html);
  maskBody.querySelectorAll('.opts button').forEach(b=>{
    b.onclick=()=>startPuzzle(+b.dataset.i);
  });
  document.getElementById('maskCancel').onclick=hideMask;
}

function startPuzzle(i){
  const p=PUZZLES[i];
  S.puzzle=p.name;
  S.mode='pve';
  S.humanSide=RED;
  S.handicap='none';
  S.startFen=p.fen;
  VIEW.flip=false;
  hideMask();
  refreshSegs();
  newGame();
  syncToolState();
  toast('残局：'+p.name);
}

function toggleSide(){
  if(S.mode!=='pve'){toast('仅人机对战可切换执子');return;}
  S.humanSide=S.humanSide===RED?BLACK:RED;
  VIEW.flip=S.humanSide===BLACK;
  newGame();
  syncToolState();
}

function newGame(){
  cancelAI();
  loadFen(S.startFen||START_FEN);
  scanPhase();
  POS.undoStack.length=0;
  POS.keyHistory=[POS.key];
  POS.idleCount=0;
  S.hist=[];
  S.done=false;
  S.sel=-1;
  S.targets=new Set();
  S.last=0;
  clearHintMark();
  TT.clear();
  HISTORY.fill(0);
  for(const k of KILLER){k[0]=0;k[1]=0;}
  hideMask();
  try{drawBoard();}catch(e){}
  rebuildPieces();
  render();
  syncPieceFont();
  placePieces();
  S.evalBase=humanEval();
  syncToolState();
  scheduleAI(300);
}

function refreshSegs(){
  const ms=document.getElementById('modeSeg');
  ms.innerHTML=MODES.map(m=>'<button data-id="'+m.id+'" class="'+(S.mode===m.id?'on':'')+'">'+m.name+'</button>').join('');
  ms.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.id));
  const ls=document.getElementById('lvSeg');
  ls.hidden=S.mode==='pvp';
  ls.innerHTML=LEVELS.map(l=>'<button data-id="'+l.id+'" class="'+(S.level===l.id?'on':'')+'">'+l.name+'</button>').join('');
  ls.querySelectorAll('button').forEach(b=>b.onclick=()=>setLevel(+b.dataset.id));
}

function save(){
  try{
    localStorage.setItem(KEY_SAVE,JSON.stringify({
      startFen:S.startFen,moves:S.hist.map(h=>h.iccs),
      mode:S.mode,level:S.level,handicap:S.handicap,
      humanSide:S.humanSide,flip:VIEW.flip,puzzle:S.puzzle
    }));
  }catch(e){}
}

function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY_SAVE);}catch(e){return false;}
  if(!raw)return false;
  try{
    const d=JSON.parse(raw);
    if(!d||!d.startFen||!Array.isArray(d.moves))return false;
    S.mode=MODES.some(m=>m.id===d.mode)?d.mode:'pvp';
    S.level=LEVELS.some(l=>l.id===d.level)?d.level:1;
    S.handicap=d.handicap||'none';
    S.humanSide=d.humanSide===BLACK?BLACK:RED;
    VIEW.flip=!!d.flip;
    S.startFen=d.startFen;
    loadFen(d.startFen);
    scanPhase();
    S.hist=[];
    S.done=false;
    S.sel=-1;
    S.targets=new Set();
    S.last=0;
    S.puzzle=PUZZLES.some(p=>p.name===d.puzzle)?d.puzzle:'';
    for(const iccs of d.moves){
      const mv=iccsToMove(iccs);
      if(!mv)break;
      const side=POS.side,cn=moveToChinese(mv);
      if(!genLegalMoves(side).some(x=>x===mv))break;
      makeMove(mv);
      const rec=POS.undoStack[POS.undoStack.length-1];
      rec.cn=cn;rec.iccs=iccs;rec.gaveCheck=inCheck(POS.side);
      S.hist.push({iccs:iccs,cn:cn,side:side,mv:mv});
      S.last=mv;
    }
    return true;
  }catch(e){return false;}
}

/* 统一的「会丢失当前对局」确认：无子力变动或已终局则直接放行 */
function confirmDiscard(msg){
  if(S.hist.length===0||S.done)return true;
  return confirm(msg||'当前对局将结束，确定继续？');
}
function askNew(){
  if(S.hist.length===0||S.done||confirm('当前对局将结束，确定重新开始？')){
    const keep=S.puzzle;
    newGame();
    S.puzzle=keep;
    updateTurn();
  }
}

function bindUI(){
  boardBox.addEventListener('click',ev=>{
    if(S.busy||S.done)return;
    if(S.mode==='pve'&&POS.side!==S.humanSide)return;
    const rc=boardBox.getBoundingClientRect();
    const sq=squareAt(ev.clientX,ev.clientY,rc);
    if(sq<0)return;
    onSquare(sq);
  });
  document.getElementById('btnUndo').onclick=undo;
  document.getElementById('btnHint').onclick=hint;
  document.getElementById('btnPuzzle').onclick=openPuzzles;
  document.getElementById('btnHandicap').onclick=openHandicap;
  document.getElementById('btnSide').onclick=toggleSide;
  document.getElementById('btnNew').onclick=askNew;
  const snd=document.getElementById('sndBtn');
  snd.setAttribute('aria-checked',SFX.on?'true':'false');
  snd.onclick=()=>{
    SFX.set(!SFX.on);
    snd.setAttribute('aria-checked',SFX.on?'true':'false');
  };
  window.addEventListener('resize',()=>{
    syncPieceFont();
    placePieces();
  });
  if(window.ResizeObserver){
    let raf=0;
    new ResizeObserver(()=>{
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{syncPieceFont();placePieces();});
    }).observe(boardBox);
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){S.sel=-1;S.targets=new Set();markSelected();renderTargets();}
    else if(e.key==='u'||e.key==='U')undo();
    else if(e.key==='h'||e.key==='H')hint();
  });
}

function boot(){
  buildBook();
  const restored=load();
  if(!restored){
    S.startFen=START_FEN;
    loadFen(START_FEN);
    scanPhase();
    POS.keyHistory=[POS.key];
  }
  refreshSegs();
  syncToolState();
  hideMask();
  try{drawBoard();}catch(e){}
  rebuildPieces();
  render();
  syncPieceFont();
  placePieces();
  fitBoardSoon();
  bindUI();
  S.evalBase=humanEval();
  if(restored)checkEnd();
  scheduleAI(400);
}

const LAND='(orientation:landscape) and (max-height:560px)';
function fitBoard(){
  const w=document.querySelector('.wrap');if(!w)return;
  const b=w.querySelector('.board-box,.frame');if(!b)return;
  const cs=getComputedStyle(document.body);
  const avail=document.documentElement.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let h=avail;
  if(!window.matchMedia(LAND).matches){
    const ws=getComputedStyle(w);
    let chrome=0;
    for(const el of w.children){
      if(el===b||el.contains(b))continue;
      chrome+=el.getBoundingClientRect().height;
    }
    chrome+=(parseFloat(ws.rowGap)||0)*(w.children.length-1);
    h=avail-chrome;
  }
  document.documentElement.style.setProperty('--bmax',Math.max(140,h)+'px');
}
function fitBoardSoon(){
  let n=0;
  (function step(){fitBoard();if(++n<6)requestAnimationFrame(step);})();
  setTimeout(fitBoard,260);
}
window.addEventListener('resize',fitBoardSoon);
window.addEventListener('orientationchange',()=>setTimeout(fitBoardSoon,120));

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
<script>
/* 主题切换：仅在点击开关时切换，并记住选择 */
(function(){
  var k='hd-theme',root=document.documentElement,btn=document.getElementById('thmBtn');
  var meta=document.querySelector('meta[name="theme-color"]');
  var C={light:'#f4efe4',dark:'#15171c'};
  function paint(v){
    if(v==='dark')root.setAttribute('data-theme','dark');else root.removeAttribute('data-theme');
    if(meta)meta.setAttribute('content',C[v]);
    if(btn){
      btn.setAttribute('aria-label',v==='dark'?'切换浅色模式':'切换深色模式');
      btn.setAttribute('title',btn.getAttribute('aria-label'));
    }
  }
  paint(root.getAttribute('data-theme')==='dark'?'dark':'light');
  if(btn)btn.addEventListener('click',function(){
    var v=root.getAttribute('data-theme')==='dark'?'light':'dark';
    try{localStorage.setItem(k,v)}catch(e){}
    paint(v);
    try{document.dispatchEvent(new Event('hd-theme'))}catch(e){}
  });
})();
</script>

<script>
/* 主题切换后重绘棋盘：棋盘线由脚本绘制，样式表管不到 */
document.addEventListener('hd-theme',function(){requestAnimationFrame(function(){drawBoard()});});
</script>
