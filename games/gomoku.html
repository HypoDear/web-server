<script>
/* 主题引导：首帧前恢复上次手动选择的深夜模式；默认保持白天 */
(function(){try{
  if(localStorage.getItem('hd-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');

</script>
<style>
:root{
  --paper:#f4efe4; --paper2:#fbf8f1; --ink:#2f2a24; --ink-soft:#8c8275;
  --line:#d8cfbe; --wood:#e3c88f; --wood2:#d9b978;
  --black:#2b2724; --white:#fbfaf7; --accent:#1f6f8b; --bad:#c0463c;
  --good:#2e7d5b; --radius:10px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15171c; --paper2:#1c1f26; --ink:#e8e4dc; --ink-soft:#9aa0ab;
  --line:#2e333d; --accent:#5fb3d0; --bad:#e0796e; --good:#5ec08c;
  --wood:#3b3027; --wood2:#2f261f; --black:#15171a; --white:#dcd8d0;
}
/* 棋盘木纹：夜间压暗为深胡桃色，棋子对比度保留 */
[data-theme="dark"] .dot{border-color:rgba(255,255,255,.14)}
[data-theme="dark"] .dot.b{background:radial-gradient(circle at 34% 30%,#4a4642,var(--black) 70%)}
[data-theme="dark"] .dot.w{background:radial-gradient(circle at 34% 30%,#f2eee6,#b8b4ac 75%)}
[data-theme="dark"] .tools button:active{background:#262b33}
[data-theme="dark"] .tools button.snd .sndTr{background:#343a44}
[data-theme="dark"] .tools button.snd .sndTr::after{background:#e8e4dc;box-shadow:0 1px 2px rgba(0,0,0,.5)}
[data-theme="dark"] .mask{background:rgba(21,23,28,.95)}
[data-theme="dark"] .thinking span{box-shadow:0 2px 8px rgba(0,0,0,.5)}

/* ===== 主题切换开关 ===== */
.thm{position:relative;display:inline-flex;align-items:center;justify-content:center;
  flex:none;width:30px;height:30px;padding:0;cursor:pointer;
  border:1px solid var(--thm-line,var(--line));border-radius:999px;
  background:var(--thm-bg,var(--paper2));color:var(--thm-fg,var(--ink-soft,var(--ink)));
  -webkit-tap-highlight-color:transparent;
  transition:background .2s,border-color .2s,color .2s}
.thm:hover{color:var(--thm-fg-on,var(--accent));border-color:var(--thm-line-on,var(--accent))}
.thm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thm svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.thm .sun{transition:opacity .22s,transform .32s cubic-bezier(.3,.8,.3,1)}
.thm .moon{position:absolute;transition:opacity .22s,transform .32s cubic-bezier(.3,.8,.3,1)}
/* 浅色：显示月亮（点击去深色）；深色：显示太阳（点击回浅色） */
.thm .sun{opacity:0;transform:rotate(-70deg) scale(.6)}
.thm .moon{opacity:1;transform:none}
[data-theme="dark"] .thm .sun{opacity:1;transform:none}
[data-theme="dark"] .thm .moon{opacity:0;transform:rotate(70deg) scale(.6)}
@media(prefers-reduced-motion:reduce){.thm,.thm svg,.thm .sun,.thm .moon{transition-duration:.01ms!important}}
.tools button.thm{flex:0 0 auto;width:29px;min-width:29px;height:29px;padding:0;
  background:var(--paper2);color:var(--ink-soft);border-color:var(--line);
  display:inline-flex;align-items:center;justify-content:center}
.tools button.thm:hover{color:var(--ink);border-color:var(--line)}
.tools button.thm:active{background:var(--paper2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  overscroll-behavior:none; touch-action:manipulation;
}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:9px;min-height:0;flex:none}
@media (orientation:landscape) and (max-height:560px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--bmax,60vh);
    grid-template-rows:none;gap:7px 12px;align-content:center;align-items:center;

  .wrap>*{grid-column:1;min-width:0}

.seg{display:flex;background:var(--paper2);border:1px solid var(--line);

  white-space:nowrap;transition:background .15s,color .15s}

.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}

.dot.w{background:radial-gradient(circle at 34% 30%,#fff,#d9d5cc 75%)}

  border-radius:999px;padding:5px 11px;height:29px;font-family:inherit;cursor:pointer}
.tools button:active{background:#ece3d2}

.tools button.snd{position:relative;width:88px;height:29px;padding:0 4px 0 11px;flex:none;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
.tools button.snd .sndTx{letter-spacing:1px;color:var(--ink-soft);transition:color .18s}
.tools button.snd .sndTr{position:relative;flex:none;width:30px;height:16px;border-radius:999px;
  background:#d8cfbe;transition:background .18s}
.tools button.snd .sndTr::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
  border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(47,42,36,.35);transition:transform .18s}
.tools button.snd[aria-checked="true"] .sndTx{color:var(--ink)}
.tools button.snd[aria-checked="true"] .sndTr{background:var(--good)}
.tools button.snd[aria-checked="true"] .sndTr::after{transform:translateX(14px)}
.board-box{position:relative;width:min(100%,var(--bmax,100vh));aspect-ratio:1;flex:none;
  margin:0 auto;border-radius:6px;background:linear-gradient(160deg,var(--wood),var(--wood2));
  box-shadow:0 2px 10px rgba(47,42,36,.14);padding:3.4%;cursor:pointer;touch-action:none}
#cv{width:100%;height:100%;display:block}
.mask{position:fixed;inset:0;background:rgba(244,239,228,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
  z-index:9;padding:24px;text-align:center}
.mask.show{display:flex}
.mask h2{margin:0;font-size:25px;letter-spacing:4px}
.mask h2.win{color:var(--good)}
.mask h2.lose{color:var(--bad)}
.mask p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.9}
.mask .mbtn{border:none;background:var(--ink);color:var(--paper);
  border-radius:var(--radius);padding:12px 32px;font-family:inherit;
  cursor:pointer;letter-spacing:2px}
.thinking{display:none;align-items:center;justify-content:center;margin:0 auto;flex:none;
  font-size:11.5px;color:var(--ink);letter-spacing:2px;
  pointer-events:none;white-space:nowrap}
.thinking.show{display:flex}
.thinking span{background:var(--paper2);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;box-shadow:0 2px 8px rgba(47,42,36,.1);
  animation:thinkPulse 1s ease-in-out infinite}
@keyframes thinkPulse{0%,100%{opacity:1}50%{opacity:.6}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.confetti i{position:absolute;top:-12px;border-radius:1px;animation:fall linear forwards}
@keyframes fall{
  0%{transform:translateY(-10px) rotate(0);opacity:1}
  100%{transform:translateY(102vh) rotate(720deg);opacity:.85}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

<div class="wrap">
  <div class="seg" id="modeSeg" role="tablist" aria-label="对局模式"></div>
  <div class="seg" id="lvSeg" role="tablist" aria-label="AI 难度"></div>
  <div class="bar">
    <div class="turn"><span class="dot b" id="turnDot"></span><span id="turnTx">黑棋落子</span></div>
    <div class="thinking" id="thinking"><span>思考中</span></div>
    <div class="tools">
      <button id="btnForbid">禁手</button>
      <button id="btnNew">重开</button>
      <button class="snd" id="sndBtn" role="switch" aria-label="音效开关" aria-checked="true"><span class="sndTx">音效</span><span class="sndTr"></span></button>
    
    <button class="thm" id="thmBtn" type="button" aria-label="切换深色模式" title="切换深色模式">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.3M12 19.1v2.3M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.6 12h2.3M19.1 12h2.3M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/></svg>
    </button>
  </div>
  </div>
  <div class="board-box" id="boardBox">
    <canvas id="cv" width="640" height="640" aria-label="五子棋棋盘"></canvas>
  </div>
</div>
<div class="mask" id="mask" role="dialog" aria-live="polite"><div id="maskBody"></div></div>

<script>
'use strict';
const SFX=(function(){
  const KEY='mg_sound';
  let ctx=null,master=null,nb=null,on=true;
  try{if(localStorage.getItem(KEY)==='0')on=false;}catch(e){}
  function ensure(){
    if(!on)return null;
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.5;master.connect(ctx.destination);
      const n=Math.floor(ctx.sampleRate*0.5);nb=ctx.createBuffer(1,n,ctx.sampleRate);
      const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state!=='running')ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(o){
    const c=ensure();if(!c)return;
    const t=c.currentTime+(o.delay||0),s=c.createOscillator(),g=c.createGain();
    s.type=o.type||'sine';
    s.frequency.setValueAtTime(o.f,t);
    if(o.f2)s.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.dur||.2));
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.g||.1,t+(o.a||.004));
    g.gain.exponentialRampToValueAtTime(.0008,t+(o.dur||.2));
    s.connect(g);g.connect(master);
    s.start(t);s.stop(t+(o.dur||.2)+.06);
  }
  function noise(o){
    const c=ensure();if(!c)return;
    const t=c.currentTime+(o.delay||0),s=c.createBufferSource();
    s.buffer=nb;s.playbackRate.value=o.rate||1;
    const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||2000;if(o.q)f.Q.value=o.q;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.g||.1,t+(o.a||.003));
    g.gain.exponentialRampToValueAtTime(.0008,t+(o.dur||.1));
    s.connect(f);f.connect(g);g.connect(master);
    s.start(t);s.stop(t+(o.dur||.1)+.05);
  }
  document.addEventListener('pointerdown',ensure,{once:true});
  document.addEventListener('keydown',ensure,{once:true});
  return {
    get on(){return on;},
    set(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0');}catch(e){}if(on)ensure();},
    ensure,tone,noise
  };
})();

const SFXG={
  stone(w){
    if(w===B){
      SFX.noise({type:'bandpass',f:2400,q:1.1,dur:.05,g:.13});
      SFX.tone({f:520,f2:470,dur:.16,g:.15});
      SFX.tone({f:1040,dur:.06,g:.045,delay:.004});
    }else{
      SFX.noise({type:'bandpass',f:3100,q:1.1,dur:.05,g:.13});
      SFX.tone({f:760,f2:690,dur:.16,g:.14});
      SFX.tone({f:1520,dur:.07,g:.045,delay:.004});
    }
  },
  err(){SFX.tone({type:'triangle',f:200,f2:155,dur:.15,g:.11});},
  occ(){SFX.tone({f:300,dur:.06,g:.06});},
  win(ok){
    if(ok)[392,523.25,659.25,783.99].forEach((f,i)=>SFX.tone({type:'triangle',f,dur:.5,g:.1,delay:i*.1}));
    else[440,349.23,293.66].forEach((f,i)=>SFX.tone({type:'triangle',f,dur:.45,g:.085,delay:i*.12}));
  }
};
const N=15, SZ=N*N;
const E=0,B=1,W=2;
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];

const WIN=10000000;
const SC={FIVE:10000000,FOUR:100000,FOUR_B:10000,THREE:8000,THREE_B:800,TWO:600,TWO_B:60,ONE:10};

const idx=(r,c)=>r*N+c;
const inB=(r,c)=>r>=0&&r<N&&c>=0&&c<N;

function lineInfo(bd,r,c,dr,dc,me){
  let cnt=1, b1=0, b2=0;
  let gap1=0,gap2=0;
  let i=1, gapUsed=false, ext=0;
  for(;;i++){
    const nr=r+dr*i, nc=c+dc*i;
    if(!inB(nr,nc)){b1=1;break;}
    const v=bd[idx(nr,nc)];
    if(v===me){ if(gapUsed)gap1++; else cnt++; }
    else if(v===E){
      if(gapUsed||ext){break;}
      gapUsed=true; ext=1;
    } else {b1=1;break;}
  }
  let gapUsed2=false, ext2=0;
  for(i=1;;i++){
    const nr=r-dr*i, nc=c-dc*i;
    if(!inB(nr,nc)){b2=1;break;}
    const v=bd[idx(nr,nc)];
    if(v===me){ if(gapUsed2)gap2++; else cnt++; }
    else if(v===E){
      if(gapUsed2||ext2){break;}
      gapUsed2=true; ext2=1;
    } else {b2=1;break;}
  }
  return {cnt,b1,b2,gap1,gap2};
}

function runLen(bd,r,c,dr,dc,me){
  let n=1;
  for(let i=1;;i++){const nr=r+dr*i,nc=c+dc*i;
    if(!inB(nr,nc)||bd[idx(nr,nc)]!==me)break;n++;}
  for(let i=1;;i++){const nr=r-dr*i,nc=c-dc*i;
    if(!inB(nr,nc)||bd[idx(nr,nc)]!==me)break;n++;}
  return n;
}
function isWinMove(bd,p,me){
  const r=(p/N)|0,c=p%N;
  for(const[dr,dc]of DIRS)if(runLen(bd,r,c,dr,dc,me)>=5)return true;
  return false;
}
function winLine(bd,p,me){
  const r=(p/N)|0,c=p%N;
  for(const[dr,dc]of DIRS){
    if(runLen(bd,r,c,dr,dc,me)<5)continue;
    const cells=[p];
    for(let i=1;;i++){const nr=r+dr*i,nc=c+dc*i;
      if(!inB(nr,nc)||bd[idx(nr,nc)]!==me)break;cells.push(idx(nr,nc));}
    for(let i=1;;i++){const nr=r-dr*i,nc=c-dc*i;
      if(!inB(nr,nc)||bd[idx(nr,nc)]!==me)break;cells.unshift(idx(nr,nc));}
    return cells;
  }
  return null;
}

function dirScore(bd,r,c,dr,dc,me){
  const L=lineInfo(bd,r,c,dr,dc,me);
  const total=L.cnt+L.gap1+L.gap2;
  const open=2-L.b1-L.b2;
  if(L.cnt>=5)return SC.FIVE;
  if(total>=5&&(L.gap1||L.gap2))return SC.FOUR_B*2;
  if(L.cnt===4)return open===2?SC.FOUR:(open===1?SC.FOUR_B:0);
  if(L.cnt===3){
    if(total>=4&&open>=1)return SC.FOUR_B;
    return open===2?SC.THREE:(open===1?SC.THREE_B:0);
  }
  if(L.cnt===2){
    if(total>=3&&open===2)return SC.THREE_B;
    return open===2?SC.TWO:(open===1?SC.TWO_B:0);
  }
  if(L.cnt===1)return open===2?SC.ONE:0;
  return 0;
}
function pointScore(bd,p,me){
  const r=(p/N)|0,c=p%N;let s=0;
  for(const[dr,dc]of DIRS)s+=dirScore(bd,r,c,dr,dc,me);
  return s;
}

function moveValue(bd,p,me){
  const op=me===B?W:B;
  bd[p]=me; const a=pointScore(bd,p,me);
  bd[p]=op; const d=pointScore(bd,p,op);
  bd[p]=E;
  return a+d*0.9;
}

function genMoves(bd,me,limit){
  const cand=[];
  const near=new Uint8Array(SZ);
  let any=false;
  for(let p=0;p<SZ;p++){
    if(bd[p]===E)continue;
    any=true;
    const r=(p/N)|0,c=p%N;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
      const nr=r+dr,nc=c+dc;
      if(inB(nr,nc)&&bd[idx(nr,nc)]===E)near[idx(nr,nc)]=1;
    }
  }
  if(!any)return [idx(7,7)];
  for(let p=0;p<SZ;p++)if(near[p])cand.push({p,v:moveValue(bd,p,me)});
  cand.sort((x,y)=>y.v-x.v);
  return cand.slice(0,limit||16).map(x=>x.p);
}

function evaluate(bd,me){
  const op=me===B?W:B;
  let s=0;
  for(let p=0;p<SZ;p++){
    if(bd[p]===me)s+=pointScore(bd,p,me);
    else if(bd[p]===op)s-=pointScore(bd,p,op)*1.05;
  }
  return s;
}

const ZOB=[];
(function(){let seed=20261009;
 const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return seed>>>0;};
 for(let p=0;p<SZ;p++)ZOB.push([0,rnd()*65536+rnd(),rnd()*65536+rnd()]);})();
function hashOf(bd){let h=0;for(let p=0;p<SZ;p++)if(bd[p])h=(h^ZOB[p][bd[p]])>>>0;return h;}

function countShapes(bd,p,me){
  const r=(p/N)|0,c=p%N;
  let open3=0,four=0,longRun=false;
  for(const[dr,dc]of DIRS){
    if(runLen(bd,r,c,dr,dc,me)>=6)longRun=true;
    const L=lineInfo(bd,r,c,dr,dc,me);
    const total=L.cnt+L.gap1+L.gap2;
    const open=2-L.b1-L.b2;
    if(L.cnt===4||(total>=4&&(L.gap1||L.gap2)&&L.cnt>=3&&open>=1))four++;
    else if(L.cnt===3&&open===2)open3++;
    else if(total>=3&&(L.gap1||L.gap2)&&open===2&&L.cnt>=2)open3++;
  }
  return {open3,four,longRun};
}
function isForbidden(bd,p,me,enabled){
  if(!enabled||me!==B||bd[p]!==E)return false;
  bd[p]=me;
  const r=(p/N)|0,c=p%N;
  let exactFive=false;
  for(const[dr,dc]of DIRS)if(runLen(bd,r,c,dr,dc,me)===5)exactFive=true;
  const s=countShapes(bd,p,me);
  bd[p]=E;
  if(exactFive)return false;
  if(s.longRun)return true;
  if(s.four>=2)return true;
  if(s.open3>=2)return true;
  return false;
}

function killerMoves(bd,me){
  const out=[];
  const near=new Uint8Array(SZ);
  for(let p=0;p<SZ;p++){
    if(bd[p]===E)continue;
    const r=(p/N)|0,c=p%N;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
      const nr=r+dr,nc=c+dc;
      if(inB(nr,nc)&&bd[idx(nr,nc)]===E)near[idx(nr,nc)]=1;
    }
  }
  for(let p=0;p<SZ;p++){
    if(!near[p])continue;
    bd[p]=me;const s=pointScore(bd,p,me);bd[p]=E;
    if(s>=SC.THREE)out.push({p,v:s});
  }
  out.sort((a,b)=>b.v-a.v);
  return out.slice(0,10).map(x=>x.p);
}
function vcf(bd,me,depth,forbid){
  if(depth<=0)return null;
  const op=me===B?W:B;
  for(const p of killerMoves(bd,me)){
    if(isForbidden(bd,p,me,forbid))continue;
    bd[p]=me;
    if(isWinMove(bd,p,me)){bd[p]=E;return p;}
    const defs=killerMoves(bd,op).concat(genMoves(bd,op,6));
    let allLose=defs.length>0;
    const seen=new Set();
    for(const d of defs){
      if(seen.has(d)||bd[d]!==E)continue;seen.add(d);
      if(isForbidden(bd,d,op,forbid))continue;
      bd[d]=op;
      if(isWinMove(bd,d,op)){bd[d]=E;allLose=false;break;}
      const nxt=vcf(bd,me,depth-1,forbid);
      bd[d]=E;
      if(nxt===null){allLose=false;break;}
    }
    bd[p]=E;
    if(allLose)return p;
  }
  return null;
}

function search(bd,me,depth,alpha,beta,tt,forbid,deadline){
  if(Date.now()>deadline)return {score:evaluate(bd,me),move:-1,timeout:true};
  const key=hashOf(bd)+'_'+depth+'_'+me;
  const hit=tt.get(key);
  if(hit!==undefined)return hit;
  if(depth===0)return {score:evaluate(bd,me),move:-1};
  const op=me===B?W:B;
  const moves=genMoves(bd,me,depth>=4?12:16);
  if(!moves.length)return {score:0,move:-1};
  let best=-Infinity,bm=moves[0];
  for(const p of moves){
    if(isForbidden(bd,p,me,forbid))continue;
    bd[p]=me;
    let sc;
    if(isWinMove(bd,p,me))sc=WIN-(10-depth);
    else{
      const r=search(bd,op,depth-1,-beta,-alpha,tt,forbid,deadline);
      if(r.timeout){bd[p]=E;return {score:best===-Infinity?evaluate(bd,me):best,move:bm,timeout:true};}
      sc=-r.score;
    }
    bd[p]=E;
    if(sc>best){best=sc;bm=p;}
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  const res={score:best,move:bm};
  tt.set(key,res);
  return res;
}

function bestMove(bd,me,level,forbid){
  const op=me===B?W:B;
  const empty=bd.filter(v=>v===E).length;
  if(empty===SZ)return idx(7,7);

  for(let p=0;p<SZ;p++){
    if(bd[p]!==E||isForbidden(bd,p,me,forbid))continue;
    bd[p]=me;const w=isWinMove(bd,p,me);bd[p]=E;
    if(w)return p;
  }
  for(let p=0;p<SZ;p++){
    if(bd[p]!==E)continue;
    bd[p]=op;const w=isWinMove(bd,p,op);bd[p]=E;
    if(w&&!isForbidden(bd,p,me,forbid))return p;
  }
  if(level===1){
    const ms=genMoves(bd,me,8);
    return ms[Math.min(ms.length-1,(Math.random()*3)|0)];
  }
  if(level===3){
    const k=vcf(bd,me,5,forbid);
    if(k!==null)return k;
  }
  const tt=new Map();
  const maxD=level===2?2:6;
  const deadline=Date.now()+(level===2?300:1000);
  let bm=-1;
  for(let d=2;d<=maxD;d+=2){
    const r=search(bd,me,d,-Infinity,Infinity,tt,forbid,deadline);
    if(r.move>=0)bm=r.move;
    if(r.timeout)break;
    if(r.score>=WIN-100)break;
  }
  if(bm<0||bd[bm]!==E){
    const ms=genMoves(bd,me,5).filter(p=>!isForbidden(bd,p,me,forbid));
    if(ms.length)bm=ms[0];
    else{
      bm=-1;
      for(let p=0;p<SZ;p++)if(bd[p]===E&&!isForbidden(bd,p,me,forbid)){bm=p;break;}
    }
  }
  return bm;
}

function hasLegalMove(bd,me,forbid){
  for(let p=0;p<SZ;p++)if(bd[p]===E&&!isForbidden(bd,p,me,forbid))return true;
  return false;
}

const MODES=[
  {id:'pve_b',name:'人机',sub:'我执黑'},
  {id:'pve_w',name:'人机',sub:'我执白'},
  {id:'pvp', name:'双人',sub:'同屏对战'},
];
const LVS=[
  {id:1,name:'入门',sub:'轻松'},
  {id:2,name:'进阶',sub:'有来有回'},
  {id:3,name:'高手',sub:'会算杀'},
];
const S={
  bd:new Uint8Array(SZ),
  cur:B, mode:MODES[0], lv:LVS[0], forbid:false,
  last:-1, winCells:null, over:false, busy:false, gen:0, thinkT:null,
};
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const myColor=()=>S.mode.id==='pve_b'?B:(S.mode.id==='pve_w'?W:0);
const isPve=()=>S.mode.id!=='pvp';

function hasProgress(){
  if(S.over)return false;
  for(let p=0;p<SZ;p++) if(S.bd[p]!==E) return true;
  return false;
}
function askReset(){
  return !hasProgress()||confirm('当前对局将结束，确定重新开始？');
}

function buildSeg(el,items,isOn,onPick){
  if(!el.children.length){
    items.forEach(it=>{
      const b=document.createElement('button');
      b.innerHTML='<span>'+it.name+'</span><i>'+it.sub+'</i>';
      b.setAttribute('role','tab');
      b.onclick=()=>onPick(it);
      el.appendChild(b);
    });
  }
  [...el.children].forEach((b,i)=>{
    const on=isOn(items[i]);
    b.classList.toggle('on',on);
    b.setAttribute('aria-selected',on?'true':'false');
  });
}
function refreshSegs(){
  buildSeg($('modeSeg'),MODES,m=>m.id===S.mode.id,m=>{
    if(m.id===S.mode.id)return;
    if(!askReset())return;
    S.mode=m;reset();
  });
  buildSeg($('lvSeg'),LVS,l=>l.id===S.lv.id,l=>{
    if(l.id===S.lv.id)return;
    if(!askReset())return;
    S.lv=l;reset();
  });
  $('lvSeg').style.opacity=isPve()?'1':'.4';
  $('lvSeg').style.pointerEvents=isPve()?'':'none';
  $('btnForbid').classList.toggle('on',S.forbid);
}

const THINK_MS=1000;

const FX={drop:null, ripples:[], winT:0, winStart:0, raf:0};
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOutCubic=t=>1-Math.pow(1-t,3);

function fxActive(){
  return !!FX.drop || FX.ripples.length>0 || (S.winCells && FX.winT<1);
}
function tick(){
  FX.raf=0;
  const now=performance.now();
  if(FX.drop && now-FX.drop.t0>=FX.drop.dur)FX.drop=null;
  FX.ripples=FX.ripples.filter(r=>now-r.t0<r.dur);
  if(S.winCells){
    const el=now-FX.winStart;
    FX.winT=Math.min(1,el/620);
  }
  draw();
  if(fxActive())FX.raf=requestAnimationFrame(tick);
}
function startFx(){
  if(!FX.raf)FX.raf=requestAnimationFrame(tick);
}
function clearFx(){
  if(FX.raf)cancelAnimationFrame(FX.raf);
  FX.raf=0;FX.drop=null;FX.ripples=[];FX.winT=0;FX.winStart=0;
}
const CONFETTI_COLORS=['#c0463c','#2e7d5b','#1f6f8b','#b08422','#8c5a9e','#d98032'];
function confetti(n){
  const box=document.createElement('div');
  box.className='confetti';
  for(let i=0;i<n;i++){
    const p=document.createElement('i');
    const w=5+Math.random()*6;
    p.style.left=Math.random()*100+'vw';
    p.style.width=w+'px';
    p.style.height=(w*1.5)+'px';
    p.style.background=CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0];
    p.style.animationDuration=(2.1+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*0.5)+'s';
    p.style.opacity=0.65+Math.random()*0.35;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),4200);
}

const PAD=22, STEP=(640-PAD*2)/(N-1);
const px=i=>PAD+i*STEP;
function draw(){
  ctx.clearRect(0,0,640,640);
  const DK=document.documentElement.getAttribute('data-theme')==='dark';
  ctx.strokeStyle=DK?'rgba(226,206,168,.34)':'#8a6f45';ctx.lineWidth=1.1;
  ctx.beginPath();
  for(let i=0;i<N;i++){
    ctx.moveTo(px(0),px(i));ctx.lineTo(px(N-1),px(i));
    ctx.moveTo(px(i),px(0));ctx.lineTo(px(i),px(N-1));
  }
  ctx.stroke();
  ctx.lineWidth=2;ctx.strokeRect(px(0),px(0),px(N-1)-px(0),px(N-1)-px(0));
  ctx.fillStyle=DK?'rgba(226,206,168,.26)':'#7a6038';
  for(const [r,c] of [[3,3],[3,11],[11,3],[11,11],[7,7]]){
    ctx.beginPath();ctx.arc(px(c),px(r),3.4,0,7);ctx.fill();
  }
  const R=STEP*0.43;
  const now=performance.now();
  for(const rp of FX.ripples){
    const t=Math.min(1,(now-rp.t0)/rp.dur);
    const rad=R*(0.9+t*2.0);
    ctx.save();
    ctx.globalAlpha=(1-t)*0.4;
    ctx.strokeStyle=rp.dark?'rgba(40,34,28,.9)':'rgba(255,255,255,.95)';
    ctx.lineWidth=2*(1-t)+0.6;
    ctx.beginPath();ctx.arc(px(rp.c),px(rp.r),rad,0,7);ctx.stroke();
    ctx.restore();
  }
  for(let p=0;p<SZ;p++){
    const v=S.bd[p];if(!v)continue;
    const r=(p/N)|0,c=p%N,x=px(c),y=px(r);
    let sc=1;
    if(FX.drop&&FX.drop.p===p){
      const t=Math.min(1,(now-FX.drop.t0)/FX.drop.dur);
      sc=0.55+easeOutBack(t)*0.45;
      if(sc<0.05)sc=0.05;
    }
    const rr=R*sc;
    ctx.beginPath();ctx.arc(x+1,y+2,rr,0,7);
    ctx.fillStyle=DK?'rgba(0,0,0,.3)':'rgba(60,48,30,.2)';ctx.fill();
    const g=ctx.createRadialGradient(x-rr*0.34,y-rr*0.4,rr*0.12,x,y,rr);
    if(v===B){g.addColorStop(0,'#6d6763');g.addColorStop(1,'#2b2724');}
    else{g.addColorStop(0,'#ffffff');g.addColorStop(1,'#d9d5cc');}
    ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=v===B?'rgba(0,0,0,.5)':'rgba(120,110,95,.5)';
    ctx.lineWidth=.8;ctx.stroke();
  }
  if(S.last>=0&&!S.winCells){
    const r=(S.last/N)|0,c=S.last%N;
    ctx.strokeStyle=S.bd[S.last]===B?'#e8d9a8':'#b3553f';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px(c),px(r),R*0.34,0,7);ctx.stroke();
  }
  if(S.winCells){
    const a=S.winCells[0],b=S.winCells[S.winCells.length-1];
    const x1=px(a%N),y1=px((a/N)|0),x2=px(b%N),y2=px((b/N)|0);
    const t=easeOutCubic(FX.winT);
    S.winCells.forEach((p,k)=>{
      const prog=Math.min(1,Math.max(0,t*S.winCells.length-k));
      if(prog<=0)return;
      ctx.save();
      ctx.globalAlpha=0.55*prog;
      ctx.strokeStyle='#c0463c';ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(px(p%N),px((p/N)|0),R*(1.16+0.12*(1-prog)),0,7);
      ctx.stroke();ctx.restore();
    });
    ctx.save();
    ctx.strokeStyle='#c0463c';ctx.lineWidth=3.2;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x1+(x2-x1)*t, y1+(y2-y1)*t);
    ctx.stroke();ctx.restore();
  }
}

$('boardBox').addEventListener('click',e=>{
  if(S.over||S.busy||S.winCells)return;
  if(isPve()&&S.cur!==myColor())return;
  const inner=cv.getBoundingClientRect();
  const x=(e.clientX-inner.left)/inner.width*640;
  const y=(e.clientY-inner.top)/inner.height*640;
  const c=Math.round((x-PAD)/STEP), r=Math.round((y-PAD)/STEP);
  if(!inB(r,c))return;
  const p=idx(r,c);
  if(S.bd[p]!==E){SFXG.occ();return;}
  if(isForbidden(S.bd,p,S.cur,S.forbid)){flashMsg('禁手，此处不可落子');SFXG.err();return;}
  place(p);
});

function place(p){
  const who=S.cur;
  S.bd[p]=who;S.last=p;
  SFXG.stone(who);
  const t0=performance.now();
  FX.drop={p,t0,dur:260};
  FX.ripples.push({r:(p/N)|0,c:p%N,t0,dur:520,dark:who===W});
  if(FX.ripples.length>6)FX.ripples.shift();
  startFx();
  if(isWinMove(S.bd,p,who)){
    S.winCells=winLine(S.bd,p,who);
    SFXG.win(!isPve()||who===myColor());
    FX.winStart=performance.now();FX.winT=0;
    startFx();
    draw();
    setTimeout(()=>finish(who),760);
    return;
  }
  const nxt=who===B?W:B;
  if(!S.bd.some(v=>v===E)){draw();finish(0);return;}
  if(!hasLegalMove(S.bd,nxt,S.forbid)){draw();finish(who,true);return;}
  S.cur=nxt;
  draw();updateTurn();
  if(isPve()&&S.cur!==myColor())aiMove();
}

function aiMove(){
  const my=++S.gen;
  const t0=performance.now();
  S.busy=true;$('thinking').classList.add('show');
  setTimeout(()=>{
    if(my!==S.gen)return;
    let mv=-1;
    try{ mv=bestMove(S.bd,S.cur,S.lv.id,S.forbid); }catch(err){ mv=-1; }
    if(my!==S.gen)return;
    if(mv<0||S.bd[mv]!==E){
      mv=-1;
      for(let p=0;p<SZ;p++)if(S.bd[p]===E&&!isForbidden(S.bd,p,S.cur,S.forbid)){mv=p;break;}
    }
    const wait=Math.max(0,THINK_MS-(performance.now()-t0));
    S.thinkT=setTimeout(()=>{
      if(my!==S.gen)return;
      $('thinking').classList.remove('show');S.busy=false;
      if(mv<0){finish(S.cur===B?W:B,true);return;}
      place(mv);
    },wait);
  },30);
}

let msgT=null;
function flashMsg(txt){
  $('turnTx').textContent=txt;
  clearTimeout(msgT);
  msgT=setTimeout(updateTurn,1500);
}
function updateTurn(){
  $('turnDot').className='dot '+(S.cur===B?'b':'w');
  let t=(S.cur===B?'黑棋':'白棋')+'落子';
  if(isPve())t+=S.cur===myColor()?'（你）':'（AI）';
  $('turnTx').textContent=t;
}

function finish(who,trapped){
  if(S.over)return;
  S.over=true;S.busy=false;
  clearTimeout(S.thinkT);
  $('thinking').classList.remove('show');
  if(who!==0){
    const celebrate=!isPve()||who===myColor();
    if(celebrate)confetti(90);
  }
  let title,cls,sub;
  if(who===0){title='平局';cls='';sub='棋盘已满';}
  else{
    const name=who===B?'黑棋':'白棋';
    const reason=trapped?'对手无合法落子点':null;
    if(isPve()){
      const win=who===myColor();
      title=win?'你赢了':'你输了';cls=win?'win':'lose';
      sub=(reason||name+'获胜')+' · 难度 '+S.lv.name;
    }else{title=name+'获胜';cls='win';sub=reason||'双人对战';}
  }
  $('maskBody').innerHTML=
    '<h2 class="'+cls+'">'+title+'</h2><p>'+sub+'</p>'+
    '<button class="mbtn" id="againBtn">再来一局</button>';
  $('mask').classList.add('show');
  $('againBtn').onclick=()=>{$('mask').classList.remove('show');reset();};
}

function reset(){
  S.gen++;
  clearFx();
  S.bd=new Uint8Array(SZ);
  S.cur=B;S.last=-1;S.winCells=null;S.over=false;S.busy=false;
  clearTimeout(msgT);
  clearTimeout(S.thinkT);
  $('thinking').classList.remove('show');
  $('mask').classList.remove('show');
  refreshSegs();draw();updateTurn();
  if(isPve()&&myColor()===W)aiMove();
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(FX.raf){cancelAnimationFrame(FX.raf);FX.raf=0;}}
  else if(fxActive())startFx();
});

window.addEventListener('beforeunload',e=>{
  if(!hasProgress())return;
  e.preventDefault();
  e.returnValue='';
  return '';
});

$('btnNew').onclick=()=>{ if(askReset())reset(); };
const sndBtn=$('sndBtn');
function syncSnd(){sndBtn.setAttribute('aria-checked',SFX.on?'true':'false');}
sndBtn.onclick=()=>{SFX.set(!SFX.on);syncSnd();if(SFX.on)SFXG.stone(B);};
syncSnd();
$('btnForbid').onclick=()=>{
  S.forbid=!S.forbid;refreshSegs();
  flashMsg(S.forbid?'禁手已开启（限制黑棋）':'禁手已关闭');
};

const LAND='(orientation:landscape) and (max-height:560px)';
function fitBoard(){
  const w=document.querySelector('.wrap');if(!w)return;
  const b=w.querySelector('.board-box,.frame');if(!b)return;
  const cs=getComputedStyle(document.body);
  const avail=document.documentElement.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let h=avail;
  if(!window.matchMedia(LAND).matches){
    const ws=getComputedStyle(w);
    let chrome=0;
    for(const el of w.children){
      if(el===b||el.contains(b))continue;
      chrome+=el.getBoundingClientRect().height;
    }
    chrome+=(parseFloat(ws.rowGap)||0)*(w.children.length-1);
    h=avail-chrome;
  }
  document.documentElement.style.setProperty('--bmax',Math.max(140,h)+'px');
}
function fitBoardSoon(){
  let n=0;
  (function step(){fitBoard();if(++n<6)requestAnimationFrame(step);})();
  setTimeout(fitBoard,260);
}
window.addEventListener('resize',fitBoardSoon);
window.addEventListener('orientationchange',()=>setTimeout(fitBoardSoon,120));

reset();
fitBoardSoon();
</script>
<script>
/* 主题切换：仅在点击开关时切换，并记住选择 */
(function(){
  var k='hd-theme',root=document.documentElement,btn=document.getElementById('thmBtn');
  var meta=document.querySelector('meta[name="theme-color"]');
  var C={light:'#f4efe4',dark:'#15171c'};
  function paint(v){
    if(v==='dark')root.setAttribute('data-theme','dark');else root.removeAttribute('data-theme');
    if(meta)meta.setAttribute('content',C[v]);
    if(btn){
      btn.setAttribute('aria-label',v==='dark'?'切换浅色模式':'切换深色模式');
      btn.setAttribute('title',btn.getAttribute('aria-label'));
    }
  }
  paint(root.getAttribute('data-theme')==='dark'?'dark':'light');
  if(btn)btn.addEventListener('click',function(){
    var v=root.getAttribute('data-theme')==='dark'?'light':'dark';
    try{localStorage.setItem(k,v)}catch(e){}
    paint(v);
    try{document.dispatchEvent(new Event('hd-theme'))}catch(e){}
  });
})();
</script>

<script>
/* 主题切换后重绘棋盘：棋盘线由脚本绘制，样式表管不到 */
document.addEventListener('hd-theme',function(){requestAnimationFrame(function(){draw()});});
</script>
