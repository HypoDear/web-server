<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="description" content="魔方，三/四/五阶随机打乱与逐步复原，单文件零依赖">
<meta name="theme-color" content="#f4efe4">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>魔方</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23fffdf7'/><stop offset='1' stop-color='%23dcc9a2'/></linearGradient><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffffff' stop-opacity='.75'/><stop offset='1' stop-color='%23ffffff' stop-opacity='0'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23g)'/><rect width='32' height='32' rx='7' fill='url(%23s)'/><g stroke='%233b3228' stroke-width='1.7' stroke-linejoin='round' fill='none'><path d='M16 4.5l9.5 5.5v11L16 26.5 6.5 21V10z'/><path d='M16 4.5L16 15.5M16 15.5l9.5-5.5M16 15.5L6.5 10M16 15.5L16 26.5'/><path d='M16 15.5l9.5 5.5M16 15.5l-9.5 5.5' stroke-opacity='.55'/></g><path d='M16 15.5l9.5-5.5v5.5l-9.5 5.5z' fill='%23b33f2b' opacity='.5'/></svg>">
<script>
/* 主题引导：首帧前恢复上次手动选择的深夜模式；默认保持白天 */
(function(){try{
  if(localStorage.getItem('hd-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');
}catch(e){}})();
</script>
<style>
:root{
  --paper:#f4efe4; --paper2:#fbf8f1; --ink:#2f2a24; --ink-soft:#8c8275;
  --line:#d8cfbe; --line-bold:#3d3630; --accent:#1f6f8b; --accent-soft:#dceaf0;
  --bad:#c0463c; --good:#2e7d5b; --sel:#e8dcc2;
  /* 魔方标准六色 */
  --cU:#f7f9fb; --cD:#ffd426; --cF:#17c964; --cB:#2f7bff; --cL:#ff8c1a; --cR:#f3303f;
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15171c; --paper2:#1c1f26; --ink:#e8e4dc; --ink-soft:#9aa0ab;
  --line:#2e333d; --accent:#5fb3d0; --bad:#e0796e; --good:#5ec08c;
  --line-bold:#50586a; --accent-soft:#1b3a47; --sel:#33383f;
}
/* 魔方六色贴纸不改（标准色是功能性的），只压暗环境与内壁 */
[data-theme="dark"] .tools button:active{background:#262b33}
[data-theme="dark"] .tools button.snd .sndTr{background:#343a44}
[data-theme="dark"] .tools button.snd .sndTr::after{background:#e8e4dc;box-shadow:0 1px 2px rgba(0,0,0,.5)}
[data-theme="dark"] .mask{background:rgba(21,23,28,.95)}

/* ===== 主题切换开关 ===== */
.thm{position:relative;display:inline-flex;align-items:center;justify-content:center;
  flex:none;width:30px;height:30px;padding:0;cursor:pointer;
  border:1px solid var(--thm-line,var(--line));border-radius:999px;
  background:var(--thm-bg,var(--paper2));color:var(--thm-fg,var(--ink-soft,var(--ink)));
  -webkit-tap-highlight-color:transparent;
  transition:background .2s,border-color .2s,color .2s}
.thm:hover{color:var(--thm-fg-on,var(--accent));border-color:var(--thm-line-on,var(--accent))}
.thm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thm svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.thm .sun{transition:opacity .22s,transform .32s cubic-bezier(.3,.8,.3,1)}
.thm .moon{position:absolute;transition:opacity .22s,transform .32s cubic-bezier(.3,.8,.3,1)}
/* 浅色：显示月亮（点击去深色）；深色：显示太阳（点击回浅色） */
.thm .sun{opacity:0;transform:rotate(-70deg) scale(.6)}
.thm .moon{opacity:1;transform:none}
[data-theme="dark"] .thm .sun{opacity:1;transform:none}
[data-theme="dark"] .thm .moon{opacity:0;transform:rotate(70deg) scale(.6)}
@media(prefers-reduced-motion:reduce){.thm,.thm svg,.thm .sun,.thm .moon{transition-duration:.01ms!important}}
.tools button.thm{flex:0 0 auto;width:29px;min-width:29px;height:29px;padding:0;
  background:var(--paper2);color:var(--ink-soft);border-color:var(--line);
  display:inline-flex;align-items:center;justify-content:center}
.tools button.thm:hover{color:var(--ink);border-color:var(--line)}
.tools button.thm:active{background:var(--paper2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 锁成单屏：拖拽不会演变成整页滚动 */
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);
  font-family:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
  overscroll-behavior:none}
.wrap{width:100%;max-width:470px;display:flex;flex-direction:column;gap:7px;
  height:100%;min-height:0}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:5px 2px;height:31px;font:inherit;font-size:13px;cursor:pointer;
  color:var(--ink-soft);background:var(--paper2);border:1px solid var(--line);
  border-radius:999px;transition:color .18s,background .18s,border-color .18s}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--paper);background:var(--accent);border-color:var(--accent);font-weight:700}

/* 舞台：--stageMax 由 JS 按实测控件高度写入 */
.stage{position:relative;aspect-ratio:1/1.06;flex:none;border-radius:4px;
  width:min(100%,calc(var(--stageMax,100vh)*0.9434));
  border:2.5px solid var(--line-bold);background:var(--paper2);overflow:hidden;
  margin:0 auto;box-shadow:0 6px 18px -12px rgba(47,42,36,.5);
  touch-action:none;cursor:grab}
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;z-index:0;
  background:
    repeating-linear-gradient(94deg,rgba(140,120,88,.045) 0 1px,rgba(0,0,0,0) 1px 6px),
    radial-gradient(86% 64% at 50% 28%,rgba(255,255,255,.8),rgba(255,255,255,0) 74%)}
/* 阴影置于魔方之下；用渐变代替 filter:blur，后者会让 3D 子树单独栅格化而闪烁 */
.stage::after{content:'';position:absolute;left:50%;bottom:5%;width:58%;height:11%;
  transform:translateX(-50%);pointer-events:none;border-radius:50%;z-index:0;
  background:radial-gradient(ellipse at 50% 50%,
    rgba(120,100,66,.22) 0%,rgba(120,100,66,.15) 38%,
    rgba(120,100,66,.06) 62%,rgba(120,100,66,0) 100%)}
.stage.drag{cursor:grabbing}
.stage.onpiece{cursor:grab}
.vhome{position:absolute;right:7px;top:7px;z-index:4;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--line);border-radius:50%;background:rgba(251,248,241,.86);
  color:var(--ink-soft);font-size:13px;line-height:1;padding:0;font-family:inherit;
  transition:color .16s,border-color .16s,background .16s}
.vhome:hover{color:var(--ink);border-color:#c9bda6;background:var(--paper2)}
.vhome:active{background:#ece3d2}
.vhome:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.scene{position:absolute;inset:0;perspective:1300px;perspective-origin:50% 47%;z-index:1}
.world{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
  will-change:transform}
.piece,.pivot{position:absolute;transform-style:preserve-3d}
.pivot.turning{will-change:transform}   /* 转层动画进合成器线程，主线程零重排 */
/* 跟手拖拽期间只给真正位移的那一层加提升，松手立即撤（避免高阶常驻显存） */
.pivot.gliding{will-change:transform}
/* 转层期间内壁沿各自法向微推 4px：打破「转动贴纸面与内壁的精确共面」
   （GPU 在共面瞬间排序翻转 = 偶发黑块）。4px 远小于缝隙可见深度，
   内壁仍封住缝隙，不会看穿 */
.t3d{--ipush:4px}

/* 方块实体：哑光深色塑料。贴纸是它的 flat 子元素，与面同面绘制，
   不再作为独立 3D 层参与排序 —— 贴纸与自己的实体面永远不可能互相盖错 */
.bodyf{position:absolute;backface-visibility:hidden;
  background:#3b332b;border-radius:9%}

/* 内壁：把所有「朝内」的实体面按层合并成整体面。深色与实体面一致，
   即使与转层中方块的内部面共面相争也看不出变化 */
.inr{position:absolute;backface-visibility:hidden;background:#3b332b}

/* 哑光贴纸：无镜面高光，仅极弱顶部漫反射 + 边缘切割暗线，接近物理贴纸 */
/* --ring 做悬停/转层指示：不用 filter，避免新建合成层 */
.st{--ring:0px;position:absolute;border-radius:12%;
  background-image:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 55%,rgba(0,0,0,.05));
  box-shadow:
    inset 0 0 0 var(--ring) rgba(255,255,255,.4),
    inset 0 0 0 1px rgba(0,0,0,.16),
    0 1px 1px rgba(0,0,0,.28)}

.st.hv{--ring:2.5px}
.turning .st{--ring:2px}
/* C1 整层高亮：锁定转轴后，整层贴纸描边提亮，明确「这一拖会带动哪一层」 */
.pivot.gliding .st{--ring:2.6px}
.pivot.gliding .st{box-shadow:
  inset 0 0 0 var(--ring) rgba(255,255,255,.62),
  inset 0 0 0 1px rgba(0,0,0,.16),
  0 1px 1px rgba(0,0,0,.28)}
/* C2 触摸按下态：手指落在贴纸上立刻给反馈，不必等到触发转层 */
.st.press{--ring:3px;filter:brightness(1.13)}
/* B2 视角回正/预设的缓动（仅回正时挂上，平时不影响跟手） */
.world.vtween{transition:transform .26s cubic-bezier(.22,.61,.36,1)}
/* C3 完成庆祝：整体轻微呼吸 + 各面依次泛光 */
@keyframes winBreath{
  0%{transform:scale(1)}28%{transform:scale(1.055)}
  58%{transform:scale(.988)}100%{transform:scale(1)}}
.world.win{animation:winBreath .72s cubic-bezier(.3,.7,.3,1)}
@keyframes winGlow{
  0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(0,0,0,.16),0 1px 1px rgba(0,0,0,.28)}
  40%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),inset 0 0 0 1px rgba(0,0,0,.1),0 0 12px rgba(255,255,255,.55)}
  100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(0,0,0,.16),0 1px 1px rgba(0,0,0,.28)}}
.st.glow{animation:winGlow .52s ease-out}

/* 操作行：三钮同排等高（对齐象棋 29px） */
.tools{display:flex;gap:6px;align-items:stretch}
.tools button{flex:1;border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  border-radius:999px;padding:5px 2px;height:29px;font:inherit;font-size:12.5px;
  cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.tools button:hover:not(:disabled){background:#f2ebdc;border-color:#c9bda6}
.tools button:active:not(:disabled){background:#ece3d2}
.tools button:disabled{opacity:.42;cursor:default}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#btnScramble{color:var(--paper);background:var(--accent);border-color:var(--accent)}
#btnScramble:hover:not(:disabled){background:#1a6079;border-color:#1a6079}
#btnScramble:active:not(:disabled){background:#155068}

button.snd{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;
  width:88px;height:29px;padding:0 4px 0 11px;flex:none;cursor:pointer;
  border:1px solid var(--line);border-radius:999px;background:var(--paper2)}
button.snd:active{background:#ece3d2}
button.snd:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sndTx{font-size:12px;letter-spacing:1px;color:var(--ink-soft);transition:color .18s}
.sndTr{position:relative;flex:none;width:30px;height:16px;border-radius:999px;
  background:#d8cfbe;transition:background .18s}
.sndTr i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(47,42,36,.35);transition:transform .18s;display:block}
.snd.on .sndTx{color:var(--ink)}
.snd.on .sndTr{background:var(--good)}
.snd.on .sndTr i{transform:translateX(14px)}

.mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(47,42,36,.4);z-index:40;padding:22px}
.mask.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:24px 22px;max-width:320px;width:100%;text-align:center;
  box-shadow:0 18px 40px -20px rgba(47,42,36,.65)}
.card h2{margin:0 0 10px;font-size:20px;letter-spacing:3px;color:var(--ink)}
.card p{margin:0 0 16px;font-size:14px;color:var(--ink-soft);line-height:1.7}
.card .big{font-size:28px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.card button{height:36px;padding:0 22px;font:inherit;font-size:14px;cursor:pointer;
  color:var(--paper);background:var(--accent);border:1px solid var(--accent);border-radius:999px}
.card button:active{background:#155068}

.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(10px);
  background:rgba(47,42,36,.9);color:var(--paper);padding:9px 17px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:.24s;z-index:50;letter-spacing:.5px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-height:700px){
  .stage{aspect-ratio:1/0.96}
}
@media (orientation:landscape) and (max-height:560px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--stageMax,60vh);
    gap:7px 12px;align-content:center;align-items:center;max-width:none}
  .wrap>*{grid-column:1;min-width:0;width:100%;max-width:330px;
    margin-left:auto;margin-right:auto}
  /* 与基础规则同一系数，否则 1.06 的宽高比会把高度撑出可用区 */
  .stage{grid-column:2;grid-row:1/span 2;aspect-ratio:1/1.06;
    width:min(100%,calc(var(--stageMax,60vh)*0.9434));max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="seg" id="kindSeg" role="tablist" aria-label="魔方类型"></div>
  <div class="tools">
    <button id="btnScramble" aria-label="打乱魔方">打乱</button>
    <button id="btnSolve" aria-label="回放复原">复原</button>
    <button class="snd on" id="sndBtn" role="switch" aria-checked="true" aria-label="音效开关">
      <span class="sndTx">音效</span><span class="sndTr"><i></i></span>
    </button>
  
    <button class="thm" id="thmBtn" type="button" aria-label="切换深色模式" title="切换深色模式">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.3M12 19.1v2.3M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.6 12h2.3M19.1 12h2.3M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/></svg>
    </button>
  </div>
  <div class="stage" id="stage" role="application" aria-label="魔方，拖动色块转层，拖动空白转视角，方向键转视角"><div class="scene"><div class="world" id="world"></div></div>
    <button class="vhome" id="vHome" title="回正视角（双击空白处亦可）" aria-label="回正视角">⌂</button>
  </div>
</div>
<div class="mask" id="mask" role="dialog" aria-live="polite" aria-modal="true"><div class="card">
  <h2 id="mkTitle">完成</h2><p id="mkBody"></p>
  <div><button id="mkOk">好</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const KEY_SAVE='cube_save_v1',KEY_SND='mg_sound';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
let AC=null,SND=lsGet(KEY_SND)!=='0';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC}
/* F4 音频解锁：移动端要求用户手势内创建并启动，否则首次转动的咔啦声会哑掉或延迟。
   首个 pointerdown 时建好 AudioContext 并推一帧静音缓冲走通输出链路 */
let AUNLOCK=false;
function unlockAudio(){
  if(AUNLOCK)return;AUNLOCK=true;
  try{
    const a=ac();if(!a)return;
    const b=a.createBuffer(1,1,a.sampleRate);
    const src=a.createBufferSource();src.buffer=b;
    src.connect(a.destination);src.start(0);
  }catch(e){}
}
let NBU=null;
function noiseBuf(a){
  if(NBU&&NBU.sampleRate===a.sampleRate)return NBU;
  const n=Math.floor(a.sampleRate*0.25);
  const b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  NBU=b;return b;
}
function knock(freq,dur,g0,dly,q){
  if(!SND)return;const a=ac();if(!a)return;
  try{
    const t0=a.currentTime+(dly||0);
    const src=a.createBufferSource();src.buffer=noiseBuf(a);
    const bp=a.createBiquadFilter();
    bp.type='bandpass';bp.frequency.setValueAtTime(freq,t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(120,freq*0.42),t0+dur);
    bp.Q.value=q||3.2;
    const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=140;
    const g=a.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(g0||.2,t0+.003);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    const o=a.createOscillator(),og=a.createGain();
    o.type='triangle';o.frequency.setValueAtTime(freq*0.62,t0);
    o.frequency.exponentialRampToValueAtTime(freq*0.34,t0+dur);
    og.gain.setValueAtTime(0,t0);
    og.gain.linearRampToValueAtTime((g0||.2)*0.5,t0+.004);
    og.gain.exponentialRampToValueAtTime(.0001,t0+dur*0.8);
    src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(a.destination);
    o.connect(og);og.connect(a.destination);
    src.start(t0);src.stop(t0+dur+.05);
    o.start(t0);o.stop(t0+dur+.05);
  }catch(e){}
}
/* 滑动声：噪声过带通，频带由低扫高再落回，模拟片层摩擦 */
function slide(freq,dur,g0,dly,q){
  if(!SND)return;const a=ac();if(!a)return;
  try{
    const t0=a.currentTime+(dly||0);
    const src=a.createBufferSource();src.buffer=noiseBuf(a);
    const bp=a.createBiquadFilter();bp.type='bandpass';
    bp.frequency.setValueAtTime(Math.max(160,freq*0.55),t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(240,freq*1.6),t0+dur*0.5);
    bp.frequency.exponentialRampToValueAtTime(Math.max(150,freq*0.6),t0+dur);
    bp.Q.value=q||1.5;
    const g=a.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(g0||.12,t0+dur*0.35);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(bp);bp.connect(g);g.connect(a.destination);
    src.start(t0);src.stop(t0+dur+.05);
  }catch(e){}
}
/* 一次转动的「分量」：三阶格子小、听感略轻 */
function moveWeight(){
  return curKind().N===3?0.9:1;
}

  function fr(now){
    if(isStale(token)){reclaim();return;}
    const t=Math.min(1,(now-t0)/ms);
    /* C4：先快后慢 + 约 2.2% 过冲再回落，贴近真实魔方的「甩到位」手感 */
    const e=t>=1?1:1-Math.pow(2,-9.2*t)*Math.cos(t*10.6);
    pivot.style.transform=axis+'('+(start+(target-start)*e)+'deg)';
    if(t<1)requestAnimationFrame(fr);
    else{
      if(isStale(token)){reclaim();return;}
      settleTurn(m,pivot,sel);
      S.busy=false;
      if(S.pendingFit){S.pendingFit=false;resizeOnly();}
      if(cb)cb();
    }
  }
  requestAnimationFrame(fr);
}
function remapPieces(m){
  const k=curKind();
  const N=k.N,off=(N-1)/2;
  const moved=[];
  for(const p of PIECES){
    const inLayer=(m.ax==='x'&&p.x===m.L)||(m.ax==='y'&&p.y===m.L)||(m.ax==='z'&&p.z===m.L);
    if(!inLayer)continue;
    const a=p.x-off,b=p.y-off,c=p.z-off;
    let na=a,nb=b,nc=c;
    if(m.ax==='x'){ if(m.d===1){nb=-c;nc=b;} else {nb=c;nc=-b;} }
    else if(m.ax==='y'){ if(m.d===1){na=-c;nc=a;} else {na=c;nc=-a;} }
    else { if(m.d===1){na=b;nb=-a;} else {na=-b;nb=a;} }
    p.x=Math.round(na+off);p.y=Math.round(nb+off);p.z=Math.round(nc+off);
    p.el.style.transform='translate3d('+((p.x-off)*CELL)+'px,'+((p.y-off)*CELL)+'px,'+((p.z-off)*CELL)+'px)';
    moved.push(p);
  }
  for(const p of moved)syncFaces(p);   // 落位补偿：补齐/裁掉朝外面
  // 只重排动过的方块；否则每次转层都要 remove+重建全部贴纸，整盘会闪
  rebuildStickers(moved);
}
function rebuildStickers(list){
  const k=curKind();
  const N=k.N;
  for(const p of (list||PIECES)){
    for(const s2 of p.stks)s2.el.remove();
    p.stks.length=0;
    const sg=stickerGeo(CELL);
    const mk=(face,cellIdx)=>{
      const d=document.createElement('div');
      d.className='st';
      d.style.width=sg.S+'px';d.style.height=sg.S+'px';
      d.style.marginLeft=sg.m+'px';d.style.marginTop=sg.m+'px';
      d.dataset.f=face;d.dataset.i=cellIdx;
      p.bf[face].appendChild(d);p.stks.push({el:d,face,idx:cellIdx});
    };
    const {x,y,z}=p;
    if(y===0)   mk(U,x+z*N);
    if(y===N-1) mk(D,x+(N-1-z)*N);
    if(z===N-1) mk(F,x+y*N);
    if(z===0)   mk(B,(N-1-x)+y*N);
    if(x===0)   mk(L,z+y*N);
    if(x===N-1) mk(R,(N-1-z)+y*N);
  }
  paint();
}
function winCheck(){

/* C3：整体呼吸一次，同时六个面按 U D F B L R 依次泛光（纯 CSS 动画，零依赖） */

function showMask(t,b){

function randMove(){
  const k=curKind();
  const axs=['x','y','z'];
  return {ax:axs[(Math.random()*3)|0],L:(Math.random()*k.N)|0,d:Math.random()<.5?1:-1};
}
/* 与其余游戏一致的「会丢失当前进度」确认：
   没动过或已复原则直接放行，不打扰 */
function hasProgress(){
  if(S.done)return false;
  return S.moves>0;
}
function confirmDiscard(msg){
  if(!hasProgress())return true;
  return confirm(msg||'当前进度将丢失，确定继续？');
}
function scramble(){
  if(S.busy&&!S.solving)return;
  if(!confirmDiscard('重新打乱将丢失当前进度，确定继续？'))return;
  abortAnim();
  const k=curKind();
  const n=k.N===3?25:k.N===4?35:45;
  const seq=[];let st=S.state,last=null;
  for(let i=0;i<n;i++){
    let m,guard=0;
    do{m=randMove();guard++;}
    while(guard<20&&last&&m.ax===last.ax&&m.L===last.L);
    last=m;seq.push(m);st=applyMove(st,m);
  }
  S.state=st;S.undo=[];S.scr=seq.slice();S.moves=0;S.done=false;hideMask();
  rebuildStickers();paint();setBtns();
  SFX.scramble();toast('已打乱 '+n+' 步');save();
}
function solveBack(){
  const base=S.undo.length?S.undo:S.scr;
  if(S.busy||S.solving||!base.length)return;
  const token=++S.gen;
  S.solving=true;S.busy=true;setBtns();
  const seq=base.slice().reverse().map(invMove);
  const SPEED=Math.max(85,Math.min(240,Math.round(3200/seq.length)));
  let i=0;
  const step=()=>{
    if(isStale(token))return;
    if(i>=seq.length){
      S.solving=false;S.busy=false;S.undo=[];S.scr=[];S.done=false;
      rebuildStickers();paint();setBtns();
      SFX.solved();
      showMask('已复原',S.moves>0?'本局你走了 <span class="big">'+S.moves+'</span> 步'
        :'已回放打乱过程 <span class="big">'+seq.length+'</span> 步');
      save();return;
    }
    const m=seq[i++];
    SFX.turn(i,moveWeight(),0.65);   // 连打回放调轻，避免连续咔啦叠成噪音
    /* F3：用 rAF 对齐帧时序，后台标签页自动节流，不会跑飞 */
    animTurn(m,SPEED,()=>{if(isStale(token))return;S.busy=true;requestAnimationFrame(step);},token);
  };
  step();
}
function setBtns(){
  document.getElementById('btnSolve').disabled=S.busy||(!S.undo.length&&!S.scr.length);
  document.getElementById('btnScramble').disabled=S.busy&&!S.solving;
}
function save(){
  lsSet(KEY_SAVE,JSON.stringify({
    kind:S.kind,moves:S.moves,rx:S.rx,ry:S.ry,
    state:S.state.map(a=>Array.from(a)),
    undo:S.undo,scr:S.scr
  }));
}
function validState(st,k){
  if(!Array.isArray(st))return false;
  const faces=6,cells=k.N*k.N;
  if(st.length!==faces)return false;
  for(const f of st){
    if(!Array.isArray(f)||f.length!==cells)return false;
    for(const v of f)if(typeof v!=='number'||!isFinite(v)||v<0||v>=faces)return false;
  }
  return true;
}
function validUndo(u,k){
  if(!Array.isArray(u))return [];
  return u.filter(m=>{
    if(!m||typeof m!=='object')return false;
    if(typeof m.d!=='number'||(m.d!==1&&m.d!==-1))return false;
    return ['x','y','z'].indexOf(m.ax)>=0&&typeof m.L==='number'&&m.L>=0&&m.L<k.N;
  });
}
function load(){
  try{
    const raw=lsGet(KEY_SAVE);
    if(!raw)return false;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object')return false;
    const k=KINDS.find(x=>x.id===d.kind);
    if(!k)return false;
    if(!validState(d.state,k))return false;
    S.kind=d.kind;
    S.moves=(typeof d.moves==='number'&&isFinite(d.moves)&&d.moves>=0)?Math.floor(d.moves):0;
    S.rx=(typeof d.rx==='number'&&isFinite(d.rx))?Math.max(-TUNE.rxLimit,Math.min(TUNE.rxLimit,d.rx)):k.rx;
    S.ry=(typeof d.ry==='number'&&isFinite(d.ry))?d.ry:k.ry;
    S.state=d.state.map(a=>Int8Array.from(a));
    S.undo=validUndo(d.undo,k);S.scr=validUndo(d.scr,k);
    return true;
  }catch(e){return false;}
}
let drag=null;
function pt(e){const t=e.touches?e.touches[0]:e;return {x:t.clientX,y:t.clientY};}
function hitAt(x,y){
  const cls='st';
  // 用原生命中测试：遵循 3D 遮挡与 clip-path，不会选到背面或被挡住的贴纸
  const hits=document.elementsFromPoint(x,y);
  for(const el of hits){
    if(el.classList&&el.classList.contains(cls)&&world.contains(el))return el;
  }
  return null;
}
const FACE_N={0:[0,-1,0],1:[0,1,0],2:[0,0,1],3:[0,0,-1],4:[-1,0,0],5:[1,0,0]};
function rotV(v,rx,ry){
  const rad=d=>d*Math.PI/180;
  const [x,y,z]=v;
  const cy=Math.cos(rad(ry)),sy=Math.sin(rad(ry));
  const x1=x*cy+z*sy, z1=-x*sy+z*cy;
  const cx=Math.cos(rad(rx)),sx=Math.sin(rad(rx));
  const y2=y*cx-z1*sx;
  return [x1,y2,y*sx+z1*cx];
}
function pickTurn(stk,dx,dy){
  const face=+stk.dataset.f;
  const piece=PIECES.find(p=>p.stks&&p.stks.some(s2=>s2.el===stk));
  if(!piece)return null;
  const cands=[];
  for(const ax of ['x','y','z']){
    const n=FACE_N[face],axv=AXV[ax];
    if(Math.abs(n[0]*axv[0]+n[1]*axv[1]+n[2]*axv[2])>0.5)continue;
    const Lv=ax==='x'?piece.x:ax==='y'?piece.y:piece.z;
    const tangent=[
      axv[1]*n[2]-axv[2]*n[1],
      axv[2]*n[0]-axv[0]*n[2],
      axv[0]*n[1]-axv[1]*n[0]
    ];
    const sv=rotV(tangent,S.rx,S.ry);
    const len=Math.hypot(sv[0],sv[1])||1e-6;
    let score=(dx*sv[0]+dy*sv[1])/len;
    if(ax!=='x')score=-score;
    /* A1：len 是该切向在屏幕上的投影长度（单位向量→像素比例），
       用它把「手指位移」换算成「转层角度」，跟手才会线性贴合 */
    const unit=len*(S.fit&&S.fit.sc?S.fit.sc:1)*CELL;
    cands.push({ax,L:Lv,score,abs:Math.abs(score),unit});
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>b.abs-a.abs);
  const best=cands[0];
  /* A4：不再用固定像素阈值否决，改判前两名的分离度。
     两个候选打分接近 = 拖动方向介于两轴之间、意图不明确，
     此时返回 null 让调用方继续等几个像素，避免「赌错转轴」 */
  if(cands.length>1&&cands[1].abs>0&&best.abs<cands[1].abs*TUNE.sep)return null;
  if(best.abs<1e-3)return null;
  return {ax:best.ax,L:best.L,d:best.score>0?1:-1,
    unit:best.unit,raw:best.score};
}
let HOV=null;
function setHover(el){
  if(HOV===el)return;
  if(HOV)HOV.classList.remove('hv');
  HOV=el;
  if(HOV)HOV.classList.add('hv');
  stage.classList.toggle('onpiece',!!el);
}
function onHover(e){
  if(drag||S.busy){return;}
  if(e.pointerType==='touch'){setHover(null);return;}
  setHover(hitAt(e.clientX,e.clientY));
}

/* ===== A1 跟手拖拽转层 =====
   GL 为一次「跟手会话」：锁定转轴后，层已挂在 pivot 上，
   角度由手指位移实时驱动；松手按角度决定吸附到 90° 或回弹到 0° */
let GL=null;
function beginGlide(m,stk){
  const sel=layerPieces(m);
  const pivot=document.createElement('div');
  pivot.className='pivot';
  world.appendChild(pivot);
  for(const p of sel)pivot.appendChild(p.el);
  /* t3d 内壁外推必须保留：跟手期间转层面与内壁长时间共面，
     不推开会触发 GPU 排序翻转的黑块。will-change 只给这一层，松手即撤 */
  world.classList.add('t3d');
  pivot.classList.add('gliding');   // C1 整层高亮 + 按需 will-change
  setHover(null);
  GL={m,pivot,sel,ang:0,unit:m.unit||40,axis:axisOf(m),sign:signOf(m),last:0};
  S.busy=true;
  return GL;
}
function glideTo(deg){
  if(!GL)return;
  const lim=90;
  GL.ang=Math.max(-lim,Math.min(lim,deg));
  GL.pivot.style.transform=GL.axis+'('+(GL.ang*GL.sign)+'deg)';
  /* 每跨过一格给一次轻咔哒，强化「正在拧」的触感 */
  const step=Math.round(GL.ang/30);
  if(step!==GL.last){GL.last=step;SFX.grab();}
}
function endGlide(){
  if(!GL)return;
  const g=GL;GL=null;
  const cur=g.ang*g.sign;                 // 当前实际视觉角度
  const commit=Math.abs(g.ang)>=TUNE.commit;
  g.pivot.classList.remove('gliding');    // 先撤提升，避免常驻显存
  if(commit){
    const d=g.ang>0?1:-1;
    const m={ax:g.m.ax,L:g.m.L,d:d};
    const rest=Math.abs(90-Math.abs(g.ang))/90;
    const ms=Math.max(70,Math.round(TUNE.snapMs*rest));
    SFX.turn(S.moves,moveWeight());
    S.busy=true;
    animTurn(m,ms,()=>{
      S.undo.push(m);S.scr=[];S.moves++;setBtns();
      if(isSolvedState()&&S.moves>0)winCheck();
      save();
    },undefined,cur,g.pivot,g.sel);
  }else{
    /* 回弹到 0°：不改状态，把方块原样还回 world */
    const token=S.gen;
    const t0=performance.now();
    const ms=Math.max(60,Math.round(TUNE.snapMs*Math.abs(g.ang)/90));
    S.busy=true;
    const back=now=>{
      if(isStale(token)){
        while(g.pivot.firstChild)world.appendChild(g.pivot.firstChild);
        g.pivot.remove();world.classList.remove('t3d');S.busy=false;return;
      }
      const t=Math.min(1,(now-t0)/ms);
      const e=1-Math.pow(1-t,2.4);
      g.pivot.style.transform=g.axis+'('+(cur*(1-e))+'deg)';
      if(t<1)requestAnimationFrame(back);
      else{
        while(g.pivot.firstChild)world.appendChild(g.pivot.firstChild);
        g.pivot.remove();world.classList.remove('t3d');
        S.busy=false;
        if(S.pendingFit){S.pendingFit=false;resizeOnly();}
      }
    };
    requestAnimationFrame(back);
  }
}

/* B2 视角回正 / 预设（带缓动，不参与跟手） */
function viewTo(rx,ry){
  VEL.vx=0;VEL.vy=0;
  world.classList.add('vtween');
  S.rx=Math.max(-TUNE.rxLimit,Math.min(TUNE.rxLimit,rx));S.ry=ry;
  applyView();
  clearTimeout(viewTo._t);
  viewTo._t=setTimeout(()=>{world.classList.remove('vtween');save();},300);
}
function viewHome(){const k=curKind();viewTo(k.rx,k.ry);SFX.click();}

/* B3 视角惯性 */
const VEL={vx:0,vy:0,raf:0,t:0};
function stopInertia(){if(VEL.raf){cancelAnimationFrame(VEL.raf);VEL.raf=0;}VEL.vx=0;VEL.vy=0;}
function startInertia(){
  if(Math.abs(VEL.vx)<TUNE.inertiaMin&&Math.abs(VEL.vy)<TUNE.inertiaMin)return;
  const stepFn=()=>{
    VEL.vx*=TUNE.inertiaDecay;VEL.vy*=TUNE.inertiaDecay;
    S.ry+=VEL.vx;
    S.rx=Math.max(-TUNE.rxLimit,Math.min(TUNE.rxLimit,S.rx+VEL.vy));
    applyView();
    if(Math.abs(VEL.vx)<TUNE.inertiaMin&&Math.abs(VEL.vy)<TUNE.inertiaMin){
      VEL.raf=0;save();return;
    }
    VEL.raf=requestAnimationFrame(stepFn);
  };
  VEL.raf=requestAnimationFrame(stepFn);
}

function lockThreshold(touch){
  return Math.max(touch?TUNE.lockMinTouch:TUNE.lockMinMouse,
    CELL*(S.fit&&S.fit.sc?S.fit.sc:1)*(touch?TUNE.lockRatioTouch:TUNE.lockRatioMouse));
}
function onDown(e){
  unlockAudio();              // F4
  stopInertia();
  /* A2：动画进行中按下，先把在途的那一步立即落位，不吞输入 */
  if(S.busy&&!S.solving){abortAnim();}
  if(S.solving)return;
  const p=pt(e);
  const stk=hitAt(p.x,p.y);
  drag={x0:p.x,y0:p.y,stk:stk,rx0:S.rx,ry0:S.ry,turned:false,moved:false,
    touch:e.pointerType==='touch',px:p.x,py:p.y,pt0:performance.now()};
  if(stk)stk.classList.add('press');   // C2 触摸/鼠标按下态
  setHover(null);
  stage.classList.add('drag');
  if(e.cancelable)e.preventDefault();
}
function onMove(e){
  if(!drag)return;
  const p=pt(e);
  const dx=p.x-drag.x0, dy=p.y-drag.y0;
  if(Math.abs(dx)>3||Math.abs(dy)>3)drag.moved=true;

  if(GL){
    /* 已锁定转轴：位移投影 / 格子像素 × 90°，线性跟手 */
    const m=GL.m;
    const n=FACE_N[+drag.stk.dataset.f],axv=AXV[m.ax];
    const tangent=[axv[1]*n[2]-axv[2]*n[1],axv[2]*n[0]-axv[0]*n[2],axv[0]*n[1]-axv[1]*n[0]];
    const sv=rotV(tangent,S.rx,S.ry);
    const len=Math.hypot(sv[0],sv[1])||1e-6;
    let proj=(dx*sv[0]+dy*sv[1])/len;
    if(m.ax!=='x')proj=-proj;
    glideTo(proj/(GL.unit||40)*90);
  }else if(drag.stk&&!drag.turned){
    if(Math.hypot(dx,dy)>lockThreshold(drag.touch)){
      const m=pickTurn(drag.stk,dx,dy);
      if(m){   // A4 不明确时 pickTurn 返回 null，这里会继续等下一帧
        drag.turned=true;
        drag.stk.classList.remove('press');
        beginGlide(m,drag.stk);
        const g=GL;
        if(g)glideTo(Math.abs(m.raw||0)/(g.unit||40)*90*((m.raw||0)>0?1:-1));
      }
    }
  }else if(!drag.stk){
    const now=performance.now(), dt=Math.max(1,now-drag.pt0);
    VEL.vx=(p.x-drag.px)*TUNE.viewSens*(16/dt);   // B3 记录松手前速度
    VEL.vy=-(p.y-drag.py)*TUNE.viewSens*(16/dt);
    drag.px=p.x;drag.py=p.y;drag.pt0=now;
    S.ry=drag.ry0+dx*TUNE.viewSens;
    S.rx=Math.max(-TUNE.rxLimit,Math.min(TUNE.rxLimit,drag.rx0-dy*TUNE.viewSens));  // B4
    applyView();
  }
  if(e.cancelable)e.preventDefault();
}
function onUp(){
  if(!drag)return;
  if(drag.stk)drag.stk.classList.remove('press');
  if(GL){endGlide();}
  else{
    if(!drag.moved&&drag.stk)SFX.grab();
    if(!drag.stk){startInertia();save();}
  }
  drag=null;stage.classList.remove('drag');stage.classList.remove('onpiece');
}
function buildSeg(){
  const seg=document.getElementById('kindSeg');
  seg.innerHTML='';
  for(const k of KINDS){
    const b=document.createElement('button');
    b.textContent=k.name;b.dataset.id=k.id;

    const on=(k.id===S.kind);
    // 与其余游戏一致：选中/未选中都显式写出，读屏器才能正确播报
    b.setAttribute('aria-selected',on?'true':'false');
    if(on)b.classList.add('on');
    b.onclick=()=>{
      if(S.kind===k.id&&!S.solving)return;
      if(!confirmDiscard('切换阶数将丢失当前进度，确定继续？')){buildSeg();return;}
      abortAnim();
      S.kind=k.id;S.state=freshState();S.undo=[];S.scr=[];S.moves=0;S.done=false;
      S.rx=k.rx;S.ry=k.ry;

}
function setSnd(on){
  SND=on;lsSet(KEY_SND,on?'1':'0');
  const b=document.getElementById('sndBtn');
  b.classList.toggle('on',on);b.setAttribute('aria-checked',on?'true':'false');

function boot(){
  const restored=load();
  if(!restored){
    S.state=freshState();
    const k0=curKind();S.rx=k0.rx;S.ry=k0.ry;
    S.moves=0;S.undo=[];S.scr=[];
    lsDel(KEY_SAVE);
  }
  buildSeg();
  try{rebuild();}catch(e){}
  setBtns();
  setSnd(SND);
  stage.addEventListener('pointerdown',onDown);
  stage.addEventListener('pointermove',onHover,{passive:true});
  stage.addEventListener('pointerleave',()=>setHover(null));
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
  /* B2：双击空白处回正视角（双击贴纸不触发，避免误伤转层） */
  stage.addEventListener('dblclick',e=>{
    if(!hitAt(e.clientX,e.clientY))viewHome();
  });
  document.getElementById('vHome').addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
  });
  document.getElementById('vHome').onclick=e=>{e.stopPropagation();viewHome();};
  /* B1：方向键转视角，桌面端零成本 */
  window.addEventListener('keydown',e=>{
    const tag=(document.activeElement&&document.activeElement.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA')return;
    const STEP=e.shiftKey?18:7;
    let hit=true;
    switch(e.key){
      case 'ArrowLeft':  stopInertia();S.ry-=STEP;break;
      case 'ArrowRight': stopInertia();S.ry+=STEP;break;
      case 'ArrowUp':    stopInertia();S.rx=Math.max(-TUNE.rxLimit,S.rx-STEP);break;
      case 'ArrowDown':  stopInertia();S.rx=Math.min(TUNE.rxLimit,S.rx+STEP);break;
      case 'Home': case 'h': case 'H': viewHome();hit=true;break;
      default: hit=false;
    }
    if(hit){if(e.key!=='Home'&&e.key!=='h'&&e.key!=='H'){applyView();save();}e.preventDefault();}
  });
  document.getElementById('btnScramble').onclick=scramble;
  document.getElementById('btnSolve').onclick=solveBack;
  document.getElementById('sndBtn').onclick=()=>{setSnd(!SND);if(SND)SFX.click();};
  document.getElementById('mkOk').onclick=hideMask;
  let raf=0;
  // 定标与视角无关，resize 直接重建即可
  window.addEventListener('resize',()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      if(!S.busy)resizeOnly();   // F2：只重排，不重建 DOM
      else S.pendingFit=true;    // 转动中先挂起，结束后补偿
    });
  });
  window.addEventListener('orientationchange',()=>{
    setTimeout(()=>{if(!S.busy)resizeOnly();else S.pendingFit=true;},120);
  });
  if(restored&&isSolvedState()&&S.moves>0)S.done=true;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
<script>
/* 主题切换：仅在点击开关时切换，并记住选择 */
(function(){
  var k='hd-theme',root=document.documentElement,btn=document.getElementById('thmBtn');
  var meta=document.querySelector('meta[name="theme-color"]');
  var C={light:'#f4efe4',dark:'#15171c'};
  function paint(v){
    if(v==='dark')root.setAttribute('data-theme','dark');else root.removeAttribute('data-theme');
    if(meta)meta.setAttribute('content',C[v]);
    if(btn){
      btn.setAttribute('aria-label',v==='dark'?'切换浅色模式':'切换深色模式');
      btn.setAttribute('title',btn.getAttribute('aria-label'));
    }
  }
  paint(root.getAttribute('data-theme')==='dark'?'dark':'light');
  if(btn)btn.addEventListener('click',function(){
    var v=root.getAttribute('data-theme')==='dark'?'light':'dark';
    try{localStorage.setItem(k,v)}catch(e){}
    paint(v);
    try{document.dispatchEvent(new Event('hd-theme'))}catch(e){}
  });
})();
</script>
</body>
