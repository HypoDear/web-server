:root{--paper:#f4efe4;--paper2:#fbf8f1;--ink:#2f2a24;--ink-soft:#8c8275;--line:#d8cfbe;--accent:#1f6f8b;--good:#2e7d5b;--bad:#c0463c;--gold:#b08422;--radius:10px;

[data-theme="dark"]{color-scheme:dark;--paper:#15171c;--paper2:#1c1f26;--ink:#e8e4dc;--ink-soft:#9aa0ab;--line:#2e333d;--accent:#5fb3d0;--good:#5ec08c;--bad:#e0796e;--gold:#d8a94a;--body:#0d0e11}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",Georgia,serif;

.wrap{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.seg{display:flex;border-radius:var(--radius);padding:3px;gap:3px;border:1px solid var(--line);background:var(--paper2);flex:none}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 0 5px;cursor:pointer;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button span{font-size:14px;font-weight:600;letter-spacing:1px}
.seg button i{font-style:normal;font-size:10px;opacity:.75;letter-spacing:.5px}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:disabled{cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:none}
.stat{border-radius:var(--radius);padding:5px 4px 4px;text-align:center;border:1px solid var(--hd-edge,var(--line));

.stat i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-soft);letter-spacing:2px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1.25}
.stat.run b{color:var(--accent)}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.tools button{flex:1;height:33px;border-radius:999px;border:1px solid var(--line);background:var(--paper2);font-size:13.5px;letter-spacing:1px;cursor:pointer;white-space:nowrap;padding:0 4px}
.tools button:disabled{opacity:.42;cursor:default}
.ico{flex:none!important;width:33px;min-width:33px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;border-radius:50%!important;
 border:1px solid var(--line);background:var(--paper2);color:var(--ink-soft);text-decoration:none;height:33px;cursor:pointer}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd[aria-checked="false"] .wv{display:none}.snd[aria-checked="true"] .mt{display:none}
[data-theme="dark"] .thm .moon,html:not([data-theme="dark"]) .thm .sun{display:none}
#btnScr{background:linear-gradient(175deg,#2d83a1,#1f6f8b)!important;color:#fff!important;border-color:#155064!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #124a5d,0 4px 10px rgba(18,74,93,.28)!important}
[data-theme="dark"] #btnScr{background:linear-gradient(175deg,#6cc0dc,#4a9fbd)!important;color:#0d1a20!important;border-color:#2e7590!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #1d5a70!important}

[data-theme="dark"] .stage{border-color:rgba(0,0,0,.6);background:radial-gradient(75% 58% at 50% 36%,#2e333d 0%,#1d2027 58%,#131519 100%);

.stage.drag{cursor:grabbing}

.world{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d}

.plate{position:absolute;background:var(--body)}
.st{position:absolute;inset:6%;border-radius:15%;
