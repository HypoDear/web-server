'use strict';
const $=id=>document.getElementById(id);
/* ========== 音效：Web Audio 程序化合成，无音频文件 ========== */
const SFX=(function(){
  const KEY='mg_sound';
  let ctx=null,master=null,nb=null,on=true;
  try{if(localStorage.getItem(KEY)==='0')on=false;}catch(e){}
  function ensure(){
    if(!on)return null;
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);
      const n=Math.floor(ctx.sampleRate*.5);nb=ctx.createBuffer(1,n,ctx.sampleRate);
      const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state!=='running')ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(o){
    const c=ensure();if(!c)return;
    const t=c.currentTime+(o.delay||0),s=c.createOscillator(),g=c.createGain();
    s.type=o.type||'sine';
    s.frequency.setValueAtTime(o.f,t);
    if(o.f2)s.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.dur||.2));
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.g||.1,t+(o.a||.004));
    g.gain.exponentialRampToValueAtTime(.0008,t+(o.dur||.2));
    s.connect(g);g.connect(master);
    s.start(t);s.stop(t+(o.dur||.2)+.06);
  }
  function noise(o){
    const c=ensure();if(!c)return;
    const t=c.currentTime+(o.delay||0),s=c.createBufferSource();
    s.buffer=nb;s.playbackRate.value=o.rate||1;
    const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||2000;if(o.q)f.Q.value=o.q;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.g||.1,t+(o.a||.003));
    g.gain.exponentialRampToValueAtTime(.0008,t+(o.dur||.1));
    s.connect(f);f.connect(g);g.connect(master);
    s.start(t);s.stop(t+(o.dur||.1)+.05);
  }
  return{tone,noise,get on(){return on},
    set(v){on=!!v;try{localStorage.setItem(KEY,on?'1':'0');}catch(e){}if(on)ensure();}};
})();
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1175,1318.5,1568,1760];
const SFXG={
  pick(){SFX.tone({f:880,f2:1180,dur:.07,g:.07});SFX.noise({type:'highpass',f:4200,dur:.02,g:.03});},
  match(i){
    const f=PENTA[Math.min(i,PENTA.length-1)];
    SFX.noise({type:'lowpass',f:1300,dur:.09,g:.18});
    SFX.tone({f:200,f2:72,dur:.12,g:.2});
    SFX.tone({type:'triangle',f:f,dur:.26,g:.13,delay:.02});
    SFX.tone({f:f*2,dur:.1,g:.045,delay:.02});
  },
  item(){SFX.tone({type:'triangle',f:620,f2:980,dur:.16,g:.09});},
  shuffle(){SFX.noise({type:'lowpass',f:800,dur:.34,g:.08,a:.09});},
  warn(){SFX.tone({type:'triangle',f:240,f2:180,dur:.17,g:.1});},
  lose(){[392,330,262].forEach((f,i)=>SFX.tone({type:'triangle',f,dur:.4,g:.11,delay:i*.13}));},
  win(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>SFX.tone({type:'triangle',f,dur:.5,g:.1,delay:i*.09}));}
};

function inShape(s,x,y){ // x,y ∈ [-1,1]

 if(s==='cross')return a<.5||b<.5;if(s==='heart'){const v=-y*1.15+.18,u=x*1.12,q=u*u+v*v-1;return q*q*q-u*u*v*v*v<.12;}
 return true;}
/* 坐标单位：半格；牌占 2×2，左右对称落子 */
function buildTiles(lv,R){
 const W=14,H=16,out=[];const main=lv.n-lv.st*2,seen=new Set();
 const add=(x,y,z)=>{const k=x+','+y+','+z;if(seen.has(k))return false;
  for(const t of out)if(t.z===z&&Math.abs(t.x-x)<2&&Math.abs(t.y-y)<2)return false;seen.add(k);out.push({x,y,z});return true;};
 let left=main;const per=[];let sum=0;for(let z=0;z<lv.z;z++){const w=1-z/(lv.z*1.9);per.push(w);sum+=w;}
 for(let z=0;z<lv.z;z++){
  const want=Math.min(left,z===lv.z-1?left:Math.round(main*per[z]/sum));const pos=[],o=z%2;
  for(let y=o;y<=H-2;y+=2)for(let x=o;x<=W-2;x+=2){const nx=(x+1-W/2)/(W/2),ny=(y+1-H/2)/(H/2);
   if(nx<=0&&inShape(lv.shape,nx,ny))pos.push([x,y,R()*.45+Math.hypot(nx,ny)*(z/lv.z+.25)]);}
  pos.sort((a,b)=>a[2]-b[2]);let c=0;
  for(const p of pos){if(c>=want)break;if(add(p[0],p[1],z))c++;const mx=W-2-p[0];if(c<want&&mx!==p[0]&&add(mx,p[1],z))c++;}
  left-=c;}
 for(let z=0;left>0&&z<40;z++){const o=z%2;for(let y=o;y<=H-2&&left>0;y+=2)for(let x=o;x<=W-2&&left>0;x+=2)if(R()<.5&&add(x,y,z))left--;}
 out.forEach((t,i)=>{t.id=i;t.over=[];t.under=[];});
 for(const a of out)for(const b of out)if(a.z>b.z&&Math.abs(a.x-b.x)<2&&Math.abs(a.y-b.y)<2){a.under.push(b.id);b.over.push(a.id);}
 for(let s=0;s<2;s++){let prev=null;for(let i=0;i<lv.st;i++){const t={id:out.length,z:i,x:s?W-2-i*.36:i*.36,y:H+.7,over:[],under:[],stack:true};
  if(prev){t.under.push(prev.id);prev.over.push(t.id);}out.push(t);prev=t;}}
 return out;}
/* 沿一条真实可行的取牌顺序派图案：半组只留在槽里 cap 张以内，因此必有解 */
function deal(tiles,alive,lv,R,open0){
 const by=new Map(),cov=new Map();for(const t of tiles)if(alive.has(t.id))by.set(t.id,t);
 for(const t of by.values())cov.set(t.id,t.over.filter(i=>by.has(i)).length);
 const front=[...by.values()].filter(t=>!cov.get(t.id)),open=new Map(open0||[]),order=[];
 let need=0;for(const v of open.values())need+=3-v;
 const G=Math.floor((by.size-need)/3);let used=0;const pool=[];
 for(let i=0;i<G;i++)pool.push(ICONS[i%lv.k]);
 for(let i=G-1;i>0;i--){const j=Math.floor(R()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 if(!open0&&G>3)pool[Math.floor(G*.55)]=RAM;
 const load=()=>{let s=0;for(const v of open.values())s+=v;return s;};
 while(front.length){
  let ic=null;const l=load();
  const two=[...open.values()].some(v=>v===2),canNew=used<G&&l<lv.cap-(two?0:1)&&(open.size===0||R()<lv.sp);
  if(canNew){for(let j=used;j<G;j++)if(!open.has(pool[j])){[pool[used],pool[j]]=[pool[j],pool[used]];ic=pool[used++];break;}}
  if(!ic){const es=[...open],two=es.filter(e=>e[1]===2);
   /* 占槽到上限只能补齐对子；差一格且没有对子时只能凑对，保证解法永不爆槽 */
   const c2=l>=lv.cap&&two.length?two:es;if(c2.length)ic=c2[Math.floor(R()*c2.length)][0];}
  if(!ic&&used<G)ic=pool[used++];
  if(!ic)return null;
  const i=Math.floor(R()*front.length),t=front.splice(i,1)[0];t.icon=ic;order.push(t.id);
  const c=(open.get(ic)||0)+1;if(c===3)open.delete(ic);else open.set(ic,c);
  for(const u of t.under)if(by.has(u)){const v=cov.get(u)-1;cov.set(u,v);if(!v)front.push(by.get(u));}
 }
 return open.size?null:order;}
/* ===== 状态 ===== */
const KEY='sheep_v2';let P={un:1,st:{},best:{},daily:0};
try{P=Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const saveP=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}};
const S={lv:LV[0],idx:0,tiles:[],alive:new Set(),slot:[],hold:[],hist:[],items:[0,0,0],over:false,busy:false,score:0,combo:0,lastAt:0,used:0,revived:false,order:[],gen:0};
const lvKey=()=>S.lv.daily?'d':S.idx;
const isFree=t=>S.alive.has(t.id)&&t.over.every(i=>!S.alive.has(i));
function start(idx){
 const lv=idx==='d'?DAILY:LV[idx];S.lv=lv;S.idx=idx;S.gen++;
 const R=lv.daily?rng(today()):Math.random;let o=null,ts;
 for(let a=0;a<50&&!o;a++){ts=buildTiles(lv,R);if(ts.length!==lv.n)continue;o=deal(ts,new Set(ts.map(t=>t.id)),lv,R);}
 Object.assign(S,{tiles:ts,order:o,alive:new Set(ts.map(t=>t.id)),slot:[],hold:[],hist:[],items:lv.it.slice(),over:false,busy:false,score:0,combo:0,lastAt:0,used:0,revived:false});
 $('lvName').textContent=lv.daily?lv.name:'第 '+(idx+1)+' 关 · '+lv.name;
 $('lvSub').textContent=lv.n+' 张 · '+lv.k+' 种图案';
 hide();build(true);}
/* ===== 渲染 ===== */
function tileBtn(t){const b=document.createElement('button');b.className='t'+(t.icon===RAM?' ram':'');b.innerHTML='<i><span class="em">'+t.icon+'</span></i>';return b;}
function size(){
 const f=$('field').getBoundingClientRect(),W=14,H=16+(S.lv.st?2.9:0);
 const u=Math.max(8,Math.min(f.width/W,(f.height-8)/H,29));S.u=u;
 document.documentElement.style.setProperty('--cell',u*2+'px');
 const st=$('stage');st.style.width=u*W+'px';st.style.height=u*H+'px';st.style.left=(f.width-u*W)/2+'px';st.style.top=Math.max(0,(f.height-u*H)/2)+'px';
 const s=$('slots'),w=(s.clientWidth-18-24)/7;s.style.setProperty('--sl',w+'px');$('hold').style.setProperty('--sl',Math.min(44,w)+'px');
 for(const t of S.tiles)if(t.el){t.el.style.left=t.x*u+'px';t.el.style.top=t.y*u+'px';}}
function build(anim){
 const st=$('stage');st.innerHTML='';
 for(const t of S.tiles){if(!S.alive.has(t.id))continue;const b=tileBtn(t);b.style.zIndex=t.z*20+Math.round(t.y);b.onclick=()=>pick(t);t.el=b;
  if(anim){b.classList.add('in');b.style.animationDelay=(t.z*70+t.y*9)+'ms';}st.appendChild(b);}
 refresh();size();}
function refresh(){
 for(const t of S.tiles){if(!t.el||!S.alive.has(t.id))continue;const fr=isFree(t);t.el.classList.toggle('free',fr);t.el.classList.toggle('lock',!fr);t.el.classList.toggle('blind',!!t.stack&&!fr);}
 const sl=$('slots');sl.innerHTML='';
 for(let i=0;i<SLOTS;i++){const d=document.createElement('div'),t=S.slot[i];if(t){const b=tileBtn(t);b.tabIndex=-1;t.se=b;d.appendChild(b);}sl.appendChild(d);}
 const h=$('hold');h.innerHTML='';for(const t of S.hold){const d=document.createElement('div'),b=tileBtn(t);b.title='放回槽位';b.onclick=()=>back(t);d.appendChild(b);h.appendChild(d);}
 sl.classList.toggle('warn',S.slot.length>=SLOTS-1&&!S.over);
 $('left').textContent=S.alive.size+S.hold.length+S.slot.length;$('score').textContent=S.score;
 $('bar').style.width=(100*(1-(S.alive.size+S.hold.length+S.slot.length)/S.lv.n))+'%';
 ['itOut','itUndo','itShuffle'].forEach((id,i)=>{$(id).querySelector('i').textContent=S.items[i];$(id).disabled=S.items[i]<1||S.over||S.busy||(i===1&&!S.hist.length)||(i===0&&!S.slot.length)||(i===2&&S.alive.size<2);});}
function putSlot(t){let k=S.slot.length;for(let i=S.slot.length-1;i>=0;i--)if(S.slot[i].icon===t.icon){k=i+1;break;}S.slot.splice(k,0,t);}
function fly(from,to,t){
 if(!from||!to||!to.width||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const b=tileBtn(t);b.classList.add('fly');b.style.cssText='position:fixed;left:'+from.left+'px;top:'+from.top+'px;--cell:'+from.width+'px';document.body.appendChild(b);
 if(t.se)t.se.style.visibility='hidden';
 const dx=to.left-from.left,dy=to.top-from.top,k=to.width/from.width;
 b.style.transformOrigin='0 0';const g=S.gen,done=()=>{b.remove();if(t.se&&g===S.gen)t.se.style.visibility='';};
 b.animate([{transform:'none'},{transform:'translate('+dx*.5+'px,'+(dy*.5-26)+'px) scale(1.1)',offset:.5},{transform:'translate('+dx+'px,'+dy+'px) scale('+k+')'}],{duration:190,easing:'cubic-bezier(.4,0,.2,1)'}).onfinish=done;
 setTimeout(done,320);}
function pick(t){
 if(S.over||S.busy||!S.alive.has(t.id))return;
 if(!isFree(t)){SFXG.warn();if(t.el){t.el.classList.remove('no');void t.el.offsetWidth;t.el.classList.add('no');}return;}
 if(S.slot.length>=SLOTS)return;
 const r=t.el.getBoundingClientRect();S.alive.delete(t.id);t.el.remove();t.el=null;putSlot(t);S.hist.push(t);
 SFXG.pick();refresh();fly(r,t.se&&t.se.getBoundingClientRect(),t);check();}
function back(t){if(S.over||S.busy||S.slot.length>=SLOTS)return;const i=S.hold.indexOf(t);if(i<0)return;S.hold.splice(i,1);putSlot(t);S.hist=[];SFXG.pick();refresh();size();check();}
function check(){
 const c=new Map();let hit=null;for(const t of S.slot){const n=(c.get(t.icon)||0)+1;c.set(t.icon,n);if(n===3)hit=t.icon;}
 if(!hit){if(S.slot.length>=SLOTS)lose();return;}
 S.busy=true;const g=S.gen,now=Date.now();S.combo=now-S.lastAt<5000?S.combo+1:1;S.lastAt=now;S.score+=100*S.combo;S.hist=[];
 const v=S.slot.filter(t=>t.icon===hit).slice(0,3);
 setTimeout(()=>{if(g!==S.gen)return;for(const t of v)if(t.se){t.se.style.visibility='';t.se.classList.add('pop');const r=t.se.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,hit===RAM?16:9);}
  SFXG.match(S.combo-1);if(S.combo>1)say('连消 ×'+S.combo);
  if(hit===RAM){const i=Math.floor(Math.random()*3);S.items[i]++;say(['移出','撤销','洗牌'][i]+' +1');SFXG.item();}},200);
 setTimeout(()=>{if(g!==S.gen)return;S.slot=S.slot.filter(t=>!v.includes(t));S.busy=false;refresh();
  if(!S.alive.size&&!S.slot.length&&!S.hold.length)win();},430);}
function say(s){const e=$('combo');e.textContent=s;e.classList.remove('go');void e.offsetWidth;e.classList.add('go');}
/* ===== 道具 ===== */
function moveOut(){const a=S.slot.splice(0,3);S.hold.push(...a);S.hist=[];}
$('itOut').onclick=()=>{if(S.over||S.busy||S.items[0]<1||!S.slot.length)return;S.items[0]--;S.used++;moveOut();SFXG.item();refresh();size();};
$('itUndo').onclick=()=>{if(S.over||S.busy||S.items[1]<1||!S.hist.length)return;S.items[1]--;S.used++;const t=S.hist.pop();S.slot.splice(S.slot.indexOf(t),1);S.alive.add(t.id);SFXG.item();build(false);};
$('itShuffle').onclick=()=>{
 if(S.over||S.busy||S.items[2]<1)return;
 const c=new Map();for(const t of S.slot.concat(S.hold))c.set(t.icon,(c.get(t.icon)||0)+1);
 const open=[];for(const[k,v]of c)if(v%3)open.push([k,v%3]);
 const old=S.tiles.map(t=>t.icon);let o=null;for(let i=0;i<40&&!o;i++)o=deal(S.tiles,S.alive,S.lv,Math.random,open);
 if(!o){S.tiles.forEach((t,i)=>{t.icon=old[i];});say('暂不能洗牌');return;}
 S.items[2]--;S.used++;S.hist=[];S.order=o;SFXG.shuffle();build(true);};
/* ===== 粒子 ===== */
const cv=$('fx'),cx=cv.getContext('2d');let ps=[],raf=0;
function fit(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);}
const COL=['#b08422','#f5c344','#2e7d5b','#1f6f8b','#c0463c','#e8dcc2'];
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1.5+Math.random()*4;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,r:2+Math.random()*3,c:COL[i%6]});}if(!raf)raf=requestAnimationFrame(tick);}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);ps=ps.filter(p=>p.l>0);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.l-=.022;cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();}cx.globalAlpha=1;raf=ps.length?requestAnimationFrame(tick):0;}
/* ===== 结算与地图 ===== */
function show(h){$('card').innerHTML=h;$('ov').classList.add('show');}function hide(){$('ov').classList.remove('show');}
function win(){
 S.over=true;const k=lvKey(),st=S.revived||S.used>3?1:S.used>1?2:3;
 P.st[k]=Math.max(P.st[k]||0,st);P.best[k]=Math.max(P.best[k]||0,S.score);
 if(S.lv.daily)P.daily=today();else P.un=Math.max(P.un,Math.min(LV.length,S.idx+2));saveP();refresh();SFXG.win();
 for(let i=0;i<9;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*(.2+Math.random()*.4),26),i*130);
 const g=S.gen;setTimeout(()=>{if(g!==S.gen)return;const nx=!S.lv.daily&&S.idx<LV.length-1;
  show('<span class="em big">🐏</span><h2>通关</h2><div class="stars">'+'★'.repeat(st)+'<s>'+'★'.repeat(3-st)+'</s></div><p>得分 '+S.score+' · 最佳 '+P.best[k]+'<br>使用道具 '+S.used+' 次</p><div class="row"><button class="btn" id="mA">再来一局</button><button class="btn pri" id="mB">'+(nx?'下一关':'关卡地图')+'</button></div>');
  $('mA').onclick=()=>start(S.idx);$('mB').onclick=()=>nx?start(S.idx+1):map();},800);}
function lose(){
 S.over=true;refresh();SFXG.lose();const g=S.gen;
 setTimeout(()=>{if(g!==S.gen)return;show('<span class="em big">🐑</span><h2>槽位满了</h2><p>已完成 '+Math.round(100*(1-(S.alive.size+S.hold.length+S.slot.length)/S.lv.n))+'%'+(S.revived?'':'<br>每局可复活一次，移出三张继续')+'</p>'+(S.revived?'':'<div class="row"><button class="btn pri" id="mR">复活</button></div>')+'<div class="row"><button class="btn" id="mM">关卡地图</button><button class="btn'+(S.revived?' pri':'')+'" id="mA">重新开始</button></div>');
  if($('mR'))$('mR').onclick=()=>{S.revived=true;S.over=false;moveOut();hide();refresh();size();};
  $('mA').onclick=()=>start(S.idx);$('mM').onclick=map;},500);}
const hasProg=()=>!S.over&&S.tiles.length>0&&S.alive.size<S.lv.n;
const ask=f=>{if(!hasProg()||confirm('当前进度会丢失，确定继续？'))f();};
function map(){
 show('<h2>牧场旅程</h2><p>点三张相同图案即可消除，槽位放满七张则失败<br>金色羊牌凑齐奖励一个道具</p><div class="map">'+LV.map((l,i)=>'<button class="nd wood'+(S.idx===i?' cur':'')+'" data-i="'+i+'"'+(i<P.un?'':' disabled')+'><b>'+(i+1)+'</b><span>'+l.name+'</span><em>'+(i<P.un?'★'.repeat(P.st[i]||0)+'☆'.repeat(3-(P.st[i]||0)):'未解锁')+'</em></button>').join('')+'</div><div class="row"><button class="btn" id="mC">返回牌局</button><button class="btn pri" id="mD">每日挑战'+(P.daily===today()?' · 已完成':'')+'</button></div>');
 $('mC').onclick=()=>{if(S.over)start(S.idx);else hide();};$('mD').onclick=()=>ask(()=>start('d'));
 $('card').querySelectorAll('.nd').forEach(b=>{b.onclick=()=>ask(()=>start(+b.dataset.i));});}
$('btnMap').onclick=map;$('btnNew').onclick=()=>ask(()=>start(S.idx));
const syncSnd=()=>$('sndBtn').setAttribute('aria-checked',SFX.on?'true':'false');
$('sndBtn').onclick=()=>{SFX.set(!SFX.on);syncSnd();if(SFX.on)SFXG.pick();};syncSnd();
$('thmBtn').onclick=()=>{const d=document.documentElement,k=d.getAttribute('data-theme')==='dark';if(k)d.removeAttribute('data-theme');else d.setAttribute('data-theme','dark');try{localStorage.setItem('hd-theme',k?'light':'dark');}catch(e){}};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fit();size();},80);});
addEventListener('beforeunload',e=>{if(hasProg()){e.preventDefault();e.returnValue='';}});
window.__game={S,LV,DAILY,SLOTS,isFree,pick,start,buildTiles,deal,rng,today,P};
fit();start(Math.min(P.un,LV.length)-1);
</script>
