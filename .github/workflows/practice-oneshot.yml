name: practice-oneshot-patch
on:
  push:
    paths: ['.github/practice-patch.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用补丁（原文指纹不符会中止）
        run: python3 .github/practice-patch.py
      - name: 提交并清理一次性文件
        run: |
          git rm -q .github/practice-patch.py .github/workflows/practice-oneshot.yml
          git config user.name "HypoDear"
          git config user.email "217755863+HypoDear@users.noreply.github.com"
          git add practice/
          git commit -q -m "practice: 作品页统一补「返回合集」，深圳摩天轮去水印与编辑层"
          git push
