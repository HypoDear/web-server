<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4efe4">
<title>FLAC 歌单</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><rect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23f4efe4%27/><path d=%27M16 6v13.5A4.5 4.5 0 1 0 18.5 24V10h5V6h-7.5z%27 fill=%27%231f6f8b%27/></svg>">
<style>
  :root{
    --paper:#f4efe4; --paper2:#fbf8f1; --paper3:#fffdf8;
    --ink:#2f2a24; --ink-soft:#7d7265; --ink-dim:#a39887;
    --line:#d8cfbe; --line-soft:#e6ddcd;
    --accent:#1f6f8b; --accent-soft:#eaf2f5;
    --top-h:58px; --bar-h:58px;
    --font:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);min-height:100vh;
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;line-height:1.6;
    padding:calc(var(--top-h) + env(safe-area-inset-top) + 14px) 16px calc(var(--bar-h) + env(safe-area-inset-bottom) + 18px);
  }
  .wrap{max-width:700px;margin:0 auto}

  /* 顶部固定工具栏：桌面一行，窄屏两行 */
  .topbar{
    position:fixed;left:0;right:0;top:0;z-index:20;
    min-height:calc(var(--top-h) + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 16px 0;
    background:rgba(244,239,228,.97);border-bottom:1px solid var(--line);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .top-in{
    width:100%;max-width:760px;height:var(--top-h);margin:0 auto;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,270px);padding-right:34px;
    align-items:center;gap:18px;
  }
  .stats{font-size:13px;color:var(--ink-soft);letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-wrap{position:relative;width:100%}
  .search{
    width:100%;height:34px;padding:0 32px 0 13px;border:1px solid var(--line);
    border-radius:9px;background:var(--paper2);color:var(--ink);font-family:var(--font);
    font-size:13px;outline:none;transition:border-color .15s,background .15s;
  }
  .search:focus{border-color:var(--accent);background:var(--paper3)}
  .search::placeholder{color:var(--ink-dim)}
  .search-ico{position:absolute;right:10px;top:8px;width:17px;height:17px;fill:var(--ink-dim);pointer-events:none}

  .list{display:flex;flex-direction:column;gap:8px}
  .tr{
    display:flex;align-items:center;gap:13px;
    background:var(--paper2);border:1px solid var(--line-soft);border-radius:12px;
    padding:12px 14px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .tr:hover{background:var(--paper3);border-color:var(--line);transform:translateY(-1px)}
  .tr.on{border-color:var(--accent);background:var(--accent-soft)}
  .idx{
    flex:0 0 auto;width:26px;text-align:center;font-size:13px;color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .tr.on .idx{color:var(--accent)}
  .bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
  .bars i{width:2px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(1){height:5px;animation-delay:-.2s}
  .bars i:nth-child(2){height:11px;animation-delay:-.5s}
  .bars i:nth-child(3){height:7px;animation-delay:-.8s}
  @keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  .meta{flex:1;min-width:0}
  .t1{font-size:15.5px;font-weight:500;margin-bottom:1px;letter-spacing:.5px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr.on .t1{color:var(--accent)}
  .t2{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dur{flex:0 0 auto;font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums}

  .loading,.err{padding:24px 2px;font-size:14px;color:var(--ink-soft);text-align:center}
  .err{color:#b4472f}

  /* 底部播放条：进度条独立一行内嵌，信息与控制同行的第二行 */
  .bar{
    position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom));
    background:rgba(251,248,241,.97);border-top:1px solid var(--line);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:0 16px env(safe-area-inset-bottom);
    display:flex;align-items:center;z-index:20;
  }
  .bar-in{
    max-width:760px;margin:0 auto;width:100%;height:var(--bar-h);
    display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;
    row-gap:2px;align-content:center;padding:4px 0;
  }
  .prog-row{grid-column:1/-1;display:flex;align-items:center;gap:9px}
  .info-row{
    grid-column:1/-1;
    display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    align-items:center;gap:14px;
  }
  .now{display:flex;align-items:center;gap:10px;min-width:0;margin:0}
  .now-t{flex:1;min-width:0;font-size:13px;color:var(--ink);letter-spacing:.5px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{flex:0 0 auto;font-size:11.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .time.cur{color:var(--ink-soft)}
  .prog{
    flex:1;min-width:0;
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    background:#ddd4c4;outline:none;margin:0;cursor:pointer;
  }
  .prog::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:none;
  }
  .prog::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
  .ctrls{display:flex;align-items:center;justify-content:center;gap:18px;position:static}
  .cb{
    background:none;border:none;color:var(--ink);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;font-family:inherit;
  }
  .cb svg{width:19px;height:19px;fill:currentColor}
  .cb:hover:not(:disabled){color:var(--accent)}
  .cb:disabled{opacity:.3;cursor:not-allowed}
  .cb.play svg{width:24px;height:24px}
  .mode{position:static;display:flex;gap:14px;align-items:center;justify-content:flex-end}
  .mt{background:none;border:none;padding:0;cursor:pointer;color:var(--ink-dim);position:relative;
      display:flex;align-items:center;font-family:inherit}
  .mt svg{width:19px;height:19px;fill:currentColor}
  .mt:hover{color:var(--accent)}
  .mt.on{color:var(--accent)}
  .mt:disabled{opacity:.3;cursor:not-allowed}
  .mt .badge{
    position:absolute;right:-5px;top:-4px;font-size:9px;line-height:1;
    background:var(--accent);color:#fff;border-radius:5px;padding:1px 3px;font-family:var(--font);
  }
  @media(max-width:600px){
    :root{--top-h:88px;--bar-h:66px}
    .top-in{
      height:var(--top-h);grid-template-columns:1fr;grid-template-rows:30px 38px;
      gap:4px;padding:8px 0;
    }
    .stats{align-self:end}
    .search-wrap{align-self:start}
    .search{height:34px}
    .info-row{gap:8px}
    .now{gap:6px}
    .now-t{font-size:12.5px}
    .ctrls{gap:15px}
    .mode{gap:12px}
    .cb svg{width:18px;height:18px}
    .cb.play svg{width:23px;height:23px}
    .mt svg{width:18px;height:18px}
  }
  @media(max-width:360px){
    .info-row{gap:6px}
    .now-t{font-size:11.5px}
    .ctrls{gap:12px}
    .mode{gap:10px}
    .cb svg{width:17px;height:17px}
    .cb.play svg{width:22px;height:22px}
    .mt svg{width:17px;height:17px}
  }
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="top-in">
    <div class="stats" id="pl-stats">正在载入歌单…</div>
    <label class="search-wrap">
      <input class="search" id="search" type="search" placeholder="搜索歌名 / 歌手 / 专辑" autocomplete="off" aria-label="搜索当前歌单">
      <svg class="search-ico" viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 1 0 3.96 11.65L19.81 21 21 19.81l-6.35-6.35A6.5 6.5 0 0 0 9.5 3zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>
    </label>
  </div>
</div>

<div class="wrap">
  <div id="root"><div class="loading">正在载入歌单…</div></div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="prog-row">
      <span class="time cur" id="now-cur">--:--</span>
      <input class="prog" id="prog" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度">
      <span class="time" id="now-total">--:--</span>
    </div>
    <div class="info-row">
      <div class="now">
        <div class="now-t" id="now-t">未播放</div>
      </div>
      <div class="ctrls">
        <button class="cb" id="prev" title="上一首" aria-label="上一首">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="cb play" id="play" title="播放 / 暂停" aria-label="播放或暂停">
          <svg id="play-ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="cb" id="next" title="下一首" aria-label="下一首">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
      <span class="mode">
        <button class="mt" id="shuffle" title="随机播放" aria-label="随机播放">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="mt" id="loop" title="循环模式" aria-label="循环模式">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <span class="badge" id="loop-badge" style="display:none">1</span>
        </button>
        <button class="mt" id="locate" title="定位到当前播放" aria-label="定位到当前播放" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm8.94-3a9 9 0 0 0-7.94-7.94V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
        </button>
      </span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var URL_API    = 'https://mobi.kuwo.cn/mobi.s';
  var APK_SOURCE = 'kwplayercar_ar_6.0.0.9_B_jiakong_vh.apk';
  var FLAC_TAGS  = ['2000kflac', 'flac'];
  var PLAYLIST   = 'playlist.json';
  var LOOP_MODES = ['off', 'all', 'one'];

  var $root = document.getElementById('root');
  var $stats = document.getElementById('pl-stats');
  var $search = document.getElementById('search');
  var $nowT = document.getElementById('now-t');
  var $nowCur = document.getElementById('now-cur');
  var $nowTotal = document.getElementById('now-total');
  var $prog = document.getElementById('prog');
  var $play = document.getElementById('play');
  var $playIco = document.getElementById('play-ico');
  var $prev = document.getElementById('prev');
  var $next = document.getElementById('next');
  var $shuffle = document.getElementById('shuffle');
  var $loop = document.getElementById('loop');
  var $loopBadge = document.getElementById('loop-badge');
  var $locate = document.getElementById('locate');

  var audio = document.createElement('audio');
  audio.preload = 'none';
  audio.volume = 1;
  audio.setAttribute('aria-hidden', 'true');
  audio.style.display = 'none';
  document.body.appendChild(audio);

  var tracks = [];
  var cur = -1;
  var loopMode = 'off';
  var shuffleOn = false;
  var history = [];
  var seq = 0;
  var seeking = false;
  var baseTitle = 'FLAC 歌单';
  var playlistMeta = {};
  var query = '';

  function qs(o) {
    return Object.keys(o).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(o[k]);
    }).join('&');
  }
  function nonce() {
    var r = '';
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(2);
      window.crypto.getRandomValues(a);
      r = String(a[0]) + String(a[1]);
    } else {
      r = String(Math.floor(Math.random() * 1e9));
    }
    return 'C_APK_guanwang_' + Date.now() + '_' + r;
  }
  function fmt(s) {
    s = parseInt(s, 10) || 0;
    if (s <= 0) return '--:--';
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function label(t) {
    if (!t) return '';
    return (t.title || '') + (t.artist ? ' — ' + t.artist : '');
  }
  function setTabTitle(t) {
    document.title = t ? label(t) : baseTitle;
  }
  function candidates(u) {
    if (/^http:\/\//i.test(u)) return [u.replace(/^http:/i, 'https:'), u];
    return [u];
  }
  function freeAudio() {
    try {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
    } catch (e) {}
  }

  function resolveUrl(id) {
    var i = 0;
    function attempt() {
      if (i >= FLAC_TAGS.length) return Promise.reject(new Error('无可用无损音源'));
      var br = FLAC_TAGS[i++];
      var url = URL_API + '?' + qs({
        f: 'web', source: APK_SOURCE, from: 'PC',
        type: 'convert_url_with_sign', br: br, rid: id, user: nonce(), _: Date.now()
      });
      return fetch(url, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
        .then(function (d) {
          var dd = (d && d.data) || {};
          var fmtv = String(dd.format || '').toLowerCase();
          if (!dd.url || dd.url === 'None' || fmtv.indexOf('flac') === -1) {
            if (i < FLAC_TAGS.length) return attempt();
            throw new Error('该曲目无 FLAC 音源');
          }
          return dd.url;
        })
        .catch(function (e) {
          if (i < FLAC_TAGS.length) return attempt();
          throw e;
        });
    }
    return Promise.resolve().then(attempt);
  }

  function matchTrack(t, q) {
    if (!q) return true;
    var hay = [t.title, t.artist, t.album].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function visibleIndices() {
    var out = [];
    for (var i = 0; i < tracks.length; i++) {
      if (matchTrack(tracks[i], query)) out.push(i);
    }
    return out;
  }

  var droppedCount = 0;

  function updateStats(shown) {
    var total = tracks.length;
    var lead = query ? ('找到 ' + shown + ' / 共 ' + total + ' 首') : (total + ' 首');
    $stats.textContent = lead + ' · ' + String(playlistMeta.quality || 'flac').toUpperCase()
      + (playlistMeta.updatedAt ? ' · 更新于 ' + playlistMeta.updatedAt : '')
      + (droppedCount ? ' · 跳过 ' + droppedCount + ' 条无效项' : '');
  }

  function render() {
    $root.innerHTML = '';
    var indices = visibleIndices();
    updateStats(indices.length);
    if (!indices.length) {
      $root.innerHTML = '<div class="loading">没有匹配的歌曲</div>';
      markActive();
      return;
    }
    var list = document.createElement('div');
    list.className = 'list';
    indices.forEach(function (trackIndex) {
      var t = tracks[trackIndex];
      var row = document.createElement('div');
      row.className = 'tr';
      row.dataset.track = String(trackIndex);
      row.dataset.no = String(trackIndex + 1);

      var idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = String(trackIndex + 1);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var t1 = document.createElement('div');
      t1.className = 't1';
      t1.textContent = t.title || '(无标题)';
      var t2 = document.createElement('div');
      t2.className = 't2';
      t2.textContent = (t.artist || '未知歌手') + (t.album ? ' · ' + t.album : '');
      meta.appendChild(t1);
      meta.appendChild(t2);

      var dur = document.createElement('div');
      dur.className = 'dur';
      dur.textContent = fmt(t.duration);

      row.appendChild(idx);
      row.appendChild(meta);
      row.appendChild(dur);
      row.onclick = function () { playIndex(trackIndex, true); };
      list.appendChild(row);
    });
    $root.appendChild(list);
    markActive();
  }

  function markActive() {
    var rows = $root.querySelectorAll('.tr');
    for (var i = 0; i < rows.length; i++) {
      var on = (parseInt(rows[i].dataset.track, 10) === cur);
      rows[i].classList.toggle('on', on);
      var idx = rows[i].querySelector('.idx');
      if (on) idx.innerHTML = '<span class="bars"><i></i><i></i><i></i></span>';
      else idx.textContent = rows[i].dataset.no;
    }
    $locate.disabled = (cur < 0);
  }

  function locate() {
    if (cur < 0) return;
    if (query) {
      query = '';
      $search.value = '';
      render();
    }
    var el = $root.querySelector('.tr[data-track="' + cur + '"]');
    if (!el) return;
    try {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) {
      el.scrollIntoView();
    }
  }

  function setPlayIcon(playing) {
    $playIco.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  function playIndex(i, userPick) {
    if (!tracks.length || i < 0 || i >= tracks.length) return;
    if (userPick) history = [];
    cur = i;
    var t = tracks[i];
    var my = ++seq;

    markActive();
    $nowT.textContent = label(t);
    $nowCur.textContent = '--:--';
    $nowTotal.textContent = fmt(t.duration);
    $prog.value = 0;
    freeAudio();
    setPlayIcon(false);
    $play.disabled = true;

    function fail(msg) {
      if (my !== seq) return;
      $play.disabled = false;
      $nowT.textContent = msg + ' — ' + (t.title || '');
      setTabTitle(null);
    }

    resolveUrl(t.id).then(function (u) {
      if (my !== seq) return;
      var list = candidates(u), k = 0;

      audio.onerror = function () {
        if (my !== seq) return;
        k++;
        tryNext();
      };

      function tryNext() {
        if (my !== seq) return;
        if (k >= list.length) { fail('加载失败'); return; }
        audio.src = list[k];
        var p = audio.play();
        if (!p || !p.then) return;
        p.then(function () {
          if (my !== seq) return;
          $play.disabled = false;
          setPlayIcon(true);
          $nowT.textContent = label(t);
          setTabTitle(t);
          syncMedia(t);
        }).catch(function () {
          if (my !== seq) return;
          if (k + 1 < list.length) { k++; tryNext(); }
          else fail('播放被拦截，请再点一次');
        });
      }
      tryNext();
    }).catch(function (e) {
      fail('取源失败：' + (e.message || ''));
    });
  }

  function onNext(auto) {
    var n = tracks.length;
    if (!n) return;

    if (auto) {
      if (loopMode === 'one') { playIndex(cur, false); return; }
      if (shuffleOn) {
        var r = n === 1 ? 0 : Math.floor(Math.random() * n);
        if (n > 1 && r === cur) r = (r + 1) % n;
        history.push(cur);
        playIndex(r, false);
        return;
      }
      if (loopMode === 'off' && cur === n - 1) {
        freeAudio(); setPlayIcon(false);
        $nowT.textContent = '播放结束'; $prog.value = 0;
        setTabTitle(null);
        return;
      }
      playIndex((cur + 1) % n, false);
      return;
    }

    if (shuffleOn) {
      var r2 = n === 1 ? 0 : Math.floor(Math.random() * n);
      if (n > 1 && r2 === cur) r2 = (r2 + 1) % n;
      history.push(cur);
      playIndex(r2, false);
      return;
    }
    playIndex((cur + 1 + n) % n, false);
  }

  function onPrev() {
    var n = tracks.length;
    if (!n) return;
    if (shuffleOn && history.length) { cur = history.pop(); playIndex(cur, false); return; }
    playIndex((cur - 1 + n) % n, false);
  }

  $play.onclick = function () {
    if (cur < 0) { playIndex(0, true); return; }
    if (!audio.getAttribute('src')) { playIndex(cur, false); return; }
    if (audio.paused) {
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      audio.pause();
    }
  };
  $next.onclick = function () { onNext(false); };
  $prev.onclick = function () { onPrev(); };
  $locate.onclick = function () { locate(); };

  audio.onplay  = function () {
    setPlayIcon(true);
    markActive();
    if (cur >= 0) { setTabTitle(tracks[cur]); syncMedia(tracks[cur]); }
  };
  audio.onpause = function () { setPlayIcon(false); };

  function syncMedia(t) {
    if (!t || !('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title || '',
        artist: t.artist || '',
        album: t.album || ''
      });
    } catch (e) {}
  }
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler && navigator.mediaSession.setActionHandler('play', function () {
      var p = audio.play(); if (p && p.catch) p.catch(function () {});
    });
    navigator.mediaSession.setActionHandler && navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
    navigator.mediaSession.setActionHandler && navigator.mediaSession.setActionHandler('previoustrack', function () { onPrev(); });
    navigator.mediaSession.setActionHandler && navigator.mediaSession.setActionHandler('nexttrack', function () { onNext(false); });
  }
  audio.onended = function () { onNext(true); };
  audio.ontimeupdate = function () {
    if (seeking) return;
    var d = audio.duration;
    if (d && isFinite(d)) {
      $prog.value = Math.round(audio.currentTime / d * 1000);
      $nowCur.textContent = fmt(audio.currentTime);
      $nowTotal.textContent = fmt(d);
    }
  };
  $prog.oninput = function () { seeking = true; };
  $prog.onchange = function () {
    seeking = false;
    var d = audio.duration;
    if (d && isFinite(d)) audio.currentTime = $prog.value / 1000 * d;
  };

  $shuffle.onclick = function () {
    shuffleOn = !shuffleOn;
    $shuffle.classList.toggle('on', shuffleOn);
    $shuffle.title = shuffleOn ? '随机播放：开' : '随机播放：关';
    history = [];
  };
  function applyLoop() {
    $loop.classList.toggle('on', loopMode !== 'off');
    $loop.title = loopMode === 'off' ? '顺序播完即止'
               : loopMode === 'all' ? '列表循环' : '单曲循环';
    $loopBadge.style.display = loopMode === 'one' ? 'inline' : 'none';
  }
  $loop.onclick = function () {
    loopMode = LOOP_MODES[(LOOP_MODES.indexOf(loopMode) + 1) % LOOP_MODES.length];
    applyLoop();
  };
  applyLoop();

  $search.addEventListener('input', function () {
    query = this.value.trim().toLowerCase();
    render();
  });
  $search.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      this.value = '';
      query = '';
      render();
      this.blur();
    }
  });

  window.addEventListener('pagehide', function () { freeAudio(); });

  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); $play.click(); }
    else if (e.code === 'ArrowRight') { $next.click(); }
    else if (e.code === 'ArrowLeft') { $prev.click(); }
  });

  fetch(PLAYLIST, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      var pl = (d && d.playlist) || {};
      var raw = pl.tracks || [];
      var dropped = 0;
      tracks = [];
      for (var i = 0; i < raw.length; i++) {
        var t = raw[i];
        if (!t) { dropped++; continue; }
        var id = String(t.id == null ? '' : t.id).trim();
        if (!/^\d+$/.test(id)) { dropped++; continue; }
        t.id = id;
        if (t.duration != null) {
          var n = parseInt(t.duration, 10);
          t.duration = isFinite(n) && n > 0 ? n : null;
        }
        tracks.push(t);
      }
      if (!tracks.length) throw new Error('歌单为空或格式有误');
      playlistMeta = pl;
      droppedCount = dropped;
      baseTitle = 'FLAC 歌单';
      setTabTitle(null);
      render();
    })
    .catch(function (e) {
      $stats.textContent = '歌单载入失败';
      $root.innerHTML = '<div class="err">歌单载入失败：' + (e.message || '') +
                        '<br>请确认同目录下存在 playlist.json</div>';
    });
})();
</script>
</body>
</html>
